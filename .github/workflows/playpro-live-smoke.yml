name: PlayPro Live Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Vercel production deployment
        shell: bash
        run: sleep 60

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          mkdir -p /tmp/playpro-smoke
          cd /tmp/playpro-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Locate production parse error
        shell: bash
        run: |
          cd /tmp/playpro-smoke
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = 'https://playpro-platform.vercel.app/';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const pageErrors = [];
          page.on('pageerror', error => pageErrors.push(error.message));

          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForTimeout(4000);

          const state = await page.evaluate(async () => {
            const { Parser } = await import('https://cdn.jsdelivr.net/npm/acorn@8.18.0/+esm');
            const results = [];
            for (const s of Array.from(document.scripts)) {
              if (s.type && s.type !== 'text/javascript' && s.type !== 'application/javascript' && s.type !== '') continue;
              const src = s.src || 'inline';
              let source = s.textContent || '';
              try {
                if (s.src) {
                  const response = await fetch(s.src, { cache: 'no-store' });
                  source = await response.text();
                  if (!response.ok) throw new Error(`HTTP ${response.status}`);
                }
                Parser.parse(source, { ecmaVersion: 'latest', sourceType: 'script', locations: true });
                results.push({ src, ok: true });
              } catch (e) {
                results.push({
                  src,
                  ok: false,
                  error: String(e && e.message || e),
                  line: e && e.loc ? e.loc.line : null,
                  column: e && e.loc ? e.loc.column : null,
                  excerpt: e && e.loc ? source.split(/\r?\n/).slice(Math.max(0, e.loc.line - 3), e.loc.line + 2) : source.slice(0, 300)
                });
              }
            }
            const splash = document.getElementById('splash');
            const cs = splash ? getComputedStyle(splash) : null;
            return {
              splashVisible: !!splash && cs.display !== 'none' && cs.visibility !== 'hidden' && Number(cs.opacity) > 0.01,
              bodyLength: document.body.innerText.trim().length,
              results
            };
          });

          console.log(JSON.stringify({ pageErrors, ...state }, null, 2));
          const bad = state.results.filter(x => !x.ok);
          if (bad.length) process.exit(2);
          if (state.splashVisible || state.bodyLength < 20 || pageErrors.length) process.exit(3);
          await browser.close();
          EOF
          node smoke.mjs
