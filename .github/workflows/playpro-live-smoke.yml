name: PlayPro Live Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Vercel production deployment
        shell: bash
        run: sleep 60

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          mkdir -p /tmp/playpro-smoke
          cd /tmp/playpro-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Diagnose production scripts in a real browser
        shell: bash
        run: |
          cd /tmp/playpro-smoke
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = 'https://playpro-platform.vercel.app/';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const pageErrors = [];

          page.on('pageerror', error => pageErrors.push(error.message));
          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForTimeout(4000);

          const state = await page.evaluate(async () => {
            const scripts = Array.from(document.scripts);
            const results = [];
            for (let i = 0; i < scripts.length; i++) {
              const s = scripts[i];
              if (s.type && s.type !== 'text/javascript' && s.type !== 'application/javascript' && s.type !== '') continue;
              let source = s.textContent || '';
              let src = s.src || 'inline';
              try {
                if (s.src) {
                  const response = await fetch(s.src, { cache: 'no-store' });
                  source = await response.text();
                  if (!response.ok) throw new Error(`HTTP ${response.status}`);
                }
                new Function(source);
                results.push({ src, ok: true });
              } catch (e) {
                results.push({ src, ok: false, error: String(e && e.message || e), preview: source.slice(0, 180) });
              }
            }

            const splash = document.getElementById('splash');
            const cs = splash ? getComputedStyle(splash) : null;
            return {
              splashVisible: !!splash && cs.display !== 'none' && cs.visibility !== 'hidden' && Number(cs.opacity) > 0.01,
              bodyLength: document.body.innerText.trim().length,
              scriptChecks: results
            };
          });

          console.log(JSON.stringify(state, null, 2));
          if (pageErrors.length) console.error('PAGE_ERRORS\n' + pageErrors.join('\n'));
          const bad = state.scriptChecks.filter(x => !x.ok);
          if (bad.length) throw new Error(`Syntax/resource check failed for ${bad.length} script(s)`);
          if (state.splashVisible) throw new Error('Splash remains visible after 4 seconds');
          if (state.bodyLength < 20) throw new Error('App body is unexpectedly empty');
          await browser.close();
          if (pageErrors.length) process.exit(2);
          console.log('PLAYPRO LIVE SMOKE: shell + scripts clean');
          EOF
          node smoke.mjs
