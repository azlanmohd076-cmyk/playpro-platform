name: PlayPro Live Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Vercel production deployment
        shell: bash
        run: sleep 60

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          mkdir -p /tmp/playpro-smoke
          cd /tmp/playpro-smoke
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Check production in a real browser
        shell: bash
        run: |
          cd /tmp/playpro-smoke
          cat > smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = 'https://playpro-platform.vercel.app/';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const pageErrors = [];
          const consoleErrors = [];

          page.on('pageerror', error => pageErrors.push(error.stack || error.message));
          page.on('console', msg => {
            if (msg.type() === 'error') consoleErrors.push(msg.text());
          });

          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
          await page.waitForTimeout(4000);

          const state = await page.evaluate(() => {
            const splash = document.getElementById('splash');
            const s = splash ? getComputedStyle(splash) : null;
            return {
              splashVisible: !!splash && s.display !== 'none' && s.visibility !== 'hidden' && Number(s.opacity) > 0.01,
              bodyText: document.body.innerText.slice(0, 3000),
              title: document.title,
              scripts: Array.from(document.scripts).map(s => s.src || 'inline').filter(Boolean)
            };
          });

          console.log(JSON.stringify(state, null, 2));
          if (pageErrors.length) console.error('PAGE_ERRORS\n' + pageErrors.join('\n---\n'));
          if (consoleErrors.length) console.error('CONSOLE_ERRORS\n' + consoleErrors.join('\n---\n'));

          if (state.splashVisible) throw new Error('Splash remains visible after 4 seconds');
          if (!state.bodyText || state.bodyText.trim().length < 20) throw new Error('App body is unexpectedly empty');

          await browser.close();
          if (pageErrors.length) process.exit(2);
          if (consoleErrors.length) process.exit(3);
          console.log('PLAYPRO LIVE SMOKE: runtime clean');
          EOF
          node smoke.mjs
