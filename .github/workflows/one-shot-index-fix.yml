name: One-shot PlayPro index fix
on:
  push:
    branches: [ops-fix-index-6003-20260916]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch main and verify
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          old = '    +\'</style><link rel="stylesheet" href="/css/playpro-shell-v1.css">\n'
          new = '    +\'</style><link rel="stylesheet" href="/css/playpro-shell-v1.css">\'\n'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 broken line, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          python3 - <<'PY'
          import re, pathlib, subprocess, tempfile
          s = pathlib.Path('public/index.html').read_text(encoding='utf-8')
          errors = []
          for i, m in enumerate(re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.I | re.S), 1):
              body = m.group(1)
              if not body.strip():
                  continue
              start = s[:m.start(1)].count('\n') + 1
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                  f.write(body)
                  name = f.name
              r = subprocess.run(['node', '--check', name], text=True, capture_output=True)
              if r.returncode:
                  errors.append(f'SCRIPT {i} START_LINE {start}\n{r.stderr}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('INLINE SCRIPT SYNTAX: ALL OK')
          PY
          git config user.name 'azlanmohd076-cmyk'
          git config user.email 'azlanmohd076-cmyk@users.noreply.github.com'
          rm -f .github/workflows/one-shot-index-fix.yml
          git add public/index.html .github/workflows/one-shot-index-fix.yml
          git commit -m 'fix: SyntaxError line 6003 public/index.html'
          git push origin main
