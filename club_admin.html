<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b172a"><title>PlayPro — Club Admin Dashboard</title>
<link rel="stylesheet" href="../css/shared_dashboard_styles.css">
<style>
:root{--ink:#102033;--muted:#6b7b8f;--line:#dbe3ea;--panel:#fff;--soft:#f3f7fa;--brand:#00a33b;--navy:#0b172a;--danger:#c43d3d}body{margin:0;background:#eef3f7;color:var(--ink);font:14px Inter,system-ui,sans-serif}.top{background:var(--navy);color:#fff;padding:18px clamp(18px,5vw,64px);display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800}.brand span{color:#4cc9f0}.user{color:#cbd5e1;font-size:12px}.wrap{max-width:1200px;margin:auto;padding:28px clamp(18px,5vw,64px) 60px}.crumb{font-size:12px;color:var(--muted);margin-bottom:8px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.heading h1{font-size:30px;line-height:1.15;margin:0 0 8px;letter-spacing:-.04em}.heading p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 5px 18px #1020330b;overflow:hidden}.card h2{font-size:15px;margin:0}.card-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.content{padding:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-bottom:18px}.stat{background:#fff;padding:14px;text-align:center}.stat strong{font-size:25px;display:block}.stat span{font-size:11px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-group{display:grid;gap:6px}.form-group.full{grid-column:1/-1}.form-label{font-size:12px;font-weight:700;color:#405064}.form-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:#fff}.form-input:focus{outline:2px solid #b9ebcb;border-color:var(--brand)}.btn{border:0;border-radius:7px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#edf2f5;color:var(--ink)}.btn:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.notice{display:none;padding:12px 14px;border-radius:8px;margin-bottom:18px}.notice.show{display:block}.notice.error{background:#fff0f0;color:#a62d2d}.notice.success{background:#e8f8ee;color:#167342}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{padding:8px 12px;border:0;background:#edf2f5;border-radius:999px;font-weight:700;cursor:pointer}.tab.active{background:#dff6e8;color:#087c34}.list{max-height:480px;overflow:auto}.person{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid #edf1f4}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#dff6e8;color:#087c34;font-weight:800;flex-shrink:0}.person-main{flex:1;min-width:0}.person-name{font-weight:700}.person-meta{font-size:12px;color:var(--muted);margin-top:3px}.pill{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:#edf2f5;color:#526174}.remove{color:var(--danger);font-size:12px;font-weight:700;background:none;border:0;cursor:pointer}.empty,.loading{padding:30px 18px;text-align:center;color:var(--muted)}@media(max-width:760px){.heading,.grid{display:block}.heading{margin-bottom:18px}.grid>.card{margin-bottom:18px}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}}
</style></head>
<body><header class="top"><div class="brand">Play<span>Pro</span> / Club Admin</div><div id="userLabel" class="user">Menyemak akses...</div></header>
<main class="wrap"><div class="crumb">Club Admin / Squad Management</div><div class="heading"><div><h1>Squad Command Centre</h1><p>Urus pemain dan jurulatih kelab anda dengan rekod yang terkawal.</p></div><span id="clubLabel" class="pill">Memuatkan kelab...</span></div><div id="notice" class="notice"></div><div class="grid"><section class="card"><div class="card-head"><h2>Skuad aktif</h2><span id="count" class="pill">—</span></div><div class="content"><div class="stats"><div class="stat"><strong id="playerCount">—</strong><span>Pemain aktif</span></div><div class="stat"><strong id="coachCount">—</strong><span>Jurulatih</span></div><div class="stat"><strong id="positionCount">—</strong><span>Posisi unik</span></div></div><div class="tabs"><button class="tab active" data-tab="players">Pemain</button><button class="tab" data-tab="coaches">Jurulatih</button></div><div id="peopleList" class="list"><div class="loading">Memuatkan skuad...</div></div></div></section>
<section class="card"><div class="card-head"><h2 id="formTitle">Daftar pemain baharu</h2></div><div class="content"><form id="personForm"><div class="form-grid"><div class="form-group full"><label class="form-label" for="fullName">Nama penuh *</label><input class="form-input" id="fullName" required maxlength="120" autocomplete="name"></div><div class="form-group" id="dobGroup"><label class="form-label" for="dateOfBirth">Tarikh lahir *</label><input class="form-input" id="dateOfBirth" type="date" required></div><div class="form-group" id="positionGroup"><label class="form-label" for="position">Posisi *</label><select class="form-input" id="position" required><option value="">Pilih posisi</option><option value="goalkeeper">Penjaga gol</option><option value="defender">Pertahanan</option><option value="midfielder">Tengah</option><option value="forward">Penyerang</option></select></div><div class="form-group" id="jerseyGroup"><label class="form-label" for="jerseyNumber">Nombor jersi *</label><input class="form-input" id="jerseyNumber" type="number" min="1" max="99" required></div><div class="form-group" id="licenseGroup" hidden><label class="form-label" for="license">Lesen / kelayakan</label><input class="form-input" id="license" maxlength="80" placeholder="Contoh: AFC C"></div></div><div class="actions"><button class="btn secondary" type="reset">Kosongkan</button><button class="btn primary" id="saveBtn" type="submit">Daftar pemain</button></div></form></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="../js/supabase.js"></script><script src="../js/repositories.js"></script><script>
'use strict';const $=id=>document.getElementById(id);let clubId=null,players=[],coaches=[],activeTab='players';const positions={goalkeeper:'Penjaga gol',defender:'Pertahanan',midfielder:'Tengah',forward:'Penyerang'};
function notice(text,type='error'){const n=$('notice');n.textContent=text;n.className='notice show '+type}function initials(name){return (name||'?').split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase()}function render(){const rows=activeTab==='players'?players:coaches;$('count').textContent=rows.length+' rekod';$('playerCount').textContent=players.length;$('coachCount').textContent=coaches.length;$('positionCount').textContent=new Set(players.map(p=>p.position)).size;$('peopleList').innerHTML=rows.length?rows.map(p=>`<div class="person"><div class="avatar">${initials(p.fullName)}</div><div class="person-main"><div class="person-name">${p.fullName}</div><div class="person-meta">${activeTab==='players'?`${positions[p.position]||p.position} · ${p.dateOfBirth||'Tarikh lahir tiada'}`:`${p.license||'Lesen belum direkodkan'}`}</div></div>${activeTab==='players'?`<span class="pill">#${p.jerseyNumber??'—'}</span>`:''}<button class="remove" data-table="${activeTab==='players'?'players':'coaches'}" data-id="${p.id}">Nyahaktif</button></div>`).join(''):'<div class="empty">Tiada rekod aktif.</div>'}
function setTab(tab){activeTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const player=tab==='players';$('formTitle').textContent=player?'Daftar pemain baharu':'Daftar jurulatih baharu';$('dobGroup').hidden=!player;$('positionGroup').hidden=!player;$('jerseyGroup').hidden=!player;$('licenseGroup').hidden=player;$('dateOfBirth').required=player;$('position').required=player;$('jerseyNumber').required=player;$('saveBtn').textContent=player?'Daftar pemain':'Daftar jurulatih'}
async function load(){const profile=await Auth.profile();if(!profile){notice('Sila log masuk sebagai Club Admin untuk meneruskan.');$('userLabel').textContent='Akses memerlukan log masuk';return}if(profile.role!=='club_admin'){notice('Akses ditolak: halaman ini hanya untuk Club Admin.');$('userLabel').textContent=profile.fullName||'Pengguna';return}$('userLabel').textContent=profile.fullName||profile.email||'Club Admin';clubId=await UserRepo.myClubId();if(!clubId){notice('Profil anda belum dipautkan kepada kelab.');$('clubLabel').textContent='Kelab belum dipautkan';return}const club=await ClubRepo.get(clubId);$('clubLabel').textContent=club?.name||'Kelab anda';[players,coaches]=await Promise.all([SquadRepo.players(clubId),SquadRepo.coaches(clubId)]);render()}
$('personForm').onsubmit=async e=>{e.preventDefault();if(!clubId)return;const player=activeTab==='players';const input={fullName:$('fullName').value,dateOfBirth:$('dateOfBirth').value,position:$('position').value,jerseyNumber:$('jerseyNumber').value,license:$('license').value};if(player&&(!input.dateOfBirth||!input.position||!input.jerseyNumber)){notice('Lengkapkan semua maklumat pemain.');return}if(!confirm(`Simpan pendaftaran ${player?'pemain':'jurulatih'} ini?`))return;const btn=$('saveBtn');btn.disabled=true;const out=player?await SquadRepo.addPlayer(clubId,input):await SquadRepo.addCoach(clubId,input);btn.disabled=false;if(out.error){notice('Gagal menyimpan. Semak polisi RLS, enum posisi dan nombor jersi yang mungkin sudah digunakan.');return}notice('Rekod berjaya ditambah.','success');e.target.reset();if(player)players=await SquadRepo.players(clubId);else coaches=await SquadRepo.coaches(clubId);render()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('peopleList').onclick=async e=>{const b=e.target.closest('.remove');if(!b||!confirm('Nyahaktifkan rekod ini?'))return;const out=await SquadRepo.deactivate(b.dataset.table,b.dataset.id);if(out.error){notice('Rekod gagal dinyahaktifkan.');return}if(b.dataset.table==='players')players=players.filter(p=>p.id!==b.dataset.id);else coaches=coaches.filter(p=>p.id!==b.dataset.id);render()};load().catch(err=>{console.error('[v0] Club Admin init error',err);notice('Dashboard gagal dimuatkan. Cuba lagi.')});
</script></body></html>
