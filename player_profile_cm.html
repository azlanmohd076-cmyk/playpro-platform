<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Player Profile</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--g:#00d4aa;--gold:#f0c040;--blue:#2687ff;--red:#ef4444;--yellow:#eab308;--green:#16a34a;--bg:#e9ecef;--panel:#fff;--ink:#152018;--muted:#65736b;--line:#cfd7d2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#dce2df,#eef1ef);color:var(--ink);font:13px Arial,system-ui,sans-serif}.wrap{width:min(1100px,100%);margin:auto;padding:14px}.top{display:flex;align-items:center;gap:14px;background:#07100c;color:#fff;padding:10px 14px;border-radius:8px 8px 0 0}.logo{font-size:22px;font-weight:950;color:var(--g)}.top a{color:#dbe7e1;text-decoration:none;font-weight:700}.top .spacer{margin-left:auto}.crumb{background:#f7f8f7;border:1px solid var(--line);padding:8px 12px;color:var(--muted)}.layout{display:grid;grid-template-columns:260px 1fr;gap:10px;margin-top:10px}.panel{background:var(--panel);border:1px solid #bfc9c3;box-shadow:0 1px 2px #0001}.panel h3{margin:0;padding:9px 11px;background:linear-gradient(#f7f8f7,#e4e8e6);border-bottom:1px solid var(--line);font-size:13px}.inner{padding:12px}.portrait{height:250px;background:#dfe5e2;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}.portrait img{width:100%;height:100%;object-fit:cover}.name{font-size:24px;font-weight:950}.verified{display:inline-block;margin-left:6px;border-radius:99px;padding:3px 7px;background:#e8f2ff;color:#1260bb;font-size:10px;font-weight:900}.meta{color:var(--muted);margin-top:5px}.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #edf0ee}.row:last-child{border-bottom:0}.label{color:var(--muted)}.value{font-weight:800;text-align:right}.btn{border:1px solid #b9c5be;background:#fff;border-radius:6px;padding:8px 10px;font-weight:800;cursor:pointer}.primary{background:#07100c;color:#fff;border-color:#07100c}.follow{background:var(--g);border-color:var(--g);color:#00130e}.tabs{display:flex;gap:2px;background:#d5dbd8;border:1px solid #bfc9c3;margin-top:10px;overflow:auto}.tab{padding:10px 13px;font-weight:900;white-space:nowrap;cursor:pointer}.tab.on{background:#fff;color:#075d4d}.section{display:none;margin-top:10px}.section.on{display:block}.hero{display:grid;grid-template-columns:1fr auto;gap:14px;padding:12px;background:linear-gradient(90deg,#0c382b,#0a5c48);color:#fff}.ovr{font-size:54px;line-height:.85;font-weight:950;color:var(--gold)}.position{font-weight:900;color:#c9f8ed}.bars{display:grid;grid-template-columns:1fr 1fr;gap:7px}.attr{border:1px solid #dce2df;background:#fafbfa;padding:7px;border-radius:4px}.attrline{display:flex;justify-content:space-between}.num{font-weight:950}.bar{height:5px;background:#e3e8e5;margin-top:5px}.fill{height:100%}.red{background:var(--red)}.yellow{background:var(--yellow)}.blue{background:var(--blue)}.green{background:var(--green)}.dna-note{margin-top:10px;padding:9px;background:#f3f6f4;color:var(--muted);border-left:3px solid var(--g)}.card-preview{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}.pc{background:linear-gradient(155deg,#3b2b06,#100c02);border:2px solid var(--gold);border-radius:18px;color:#fff;padding:12px;text-align:center;box-shadow:0 10px 35px #0004}.pc img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#ffffff0d}.pc .big{font-size:43px;font-weight:950}.six{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.six div{font-size:9px;color:#d7cda8}.six b{display:block;font-size:17px;color:#fff}.passport{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.passport .box{border:1px solid var(--line);padding:12px;background:#fafbfa}.passport b{display:block;color:#075d4d;margin-bottom:4px;font-size:10px}.history{overflow:auto}.history table{width:100%;border-collapse:collapse}.history th,.history td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}.history th{background:#f1f4f2}.wallbox textarea,.modal input,.modal select,.modal textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px}.post{padding:10px 0;border-bottom:1px solid var(--line)}.modalwrap{display:none;position:fixed;inset:0;background:#0009;z-index:20;place-items:center;padding:18px}.modal{width:min(520px,100%);background:#fff;padding:18px;border-radius:10px}.modal label{display:block;margin:10px 0 4px;font-weight:800;color:#075d4d}.msg{min-height:20px;color:#a11;margin-top:8px}.kyc{background:#fff8df;border:1px solid #e3c96c;padding:12px;margin-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}@media(max-width:780px){.layout{grid-template-columns:1fr}.portrait{height:210px}.card-preview{grid-template-columns:1fr}.bars{grid-template-columns:1fr}}@media(max-width:520px){.passport{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.six{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="wrap"><nav class="top"><div class="logo">PlayPro</div><a href="player.html">PLAYER</a><a href="/">HOME</a><span class="spacer"></span><span id="session"></span></nav><div class="crumb">🏠 Hub › Player › Profile</div><div id="app">Memuatkan profile...</div></main><div class="modalwrap" id="modal"><div class="modal"><button style="float:right" class="btn" onclick="closeEdit()">✕</button><h2>Edit Player Profile</h2><label>Nama sebenar</label><input id="full_name"><label>Nama panggilan</label><input id="preferred_name"><label>Nama dipaparkan</label><select id="display_name_mode"><option value="preferred">Nama panggilan</option><option value="legal">Nama sebenar</option></select><label>Biodata</label><textarea id="bio" maxlength="500"></textarea><label>Visibility</label><select id="profile_visibility"><option value="public">Public</option><option value="private">Private</option></select><div class="actions"><button class="btn primary" onclick="saveEdit()">Simpan</button><button class="btn" onclick="closeEdit()">Batal</button></div><div id="em" class="msg"></div></div></div><script>'use strict';const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtdWlyaGVudmpydXZmeGVub2F4bSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzc3NTYzNDk0LCJleHAiOjIwOTMxMzk0OTR9.ZNphviTQfnMjkGIdZtevwC8jmJjTCaXHhojcv4g5R20');let me=null,p=null,a={};const keys=['passing','dribbling','finishing','first_touch','tackling','heading','pace','stamina','strength','agility','leadership','composure','teamwork','work_rate','positioning','vision','decision_making','anticipation'];const names={passing:'Passing',dribbling:'Dribbling',finishing:'Finishing',first_touch:'First Touch',tackling:'Tackling',heading:'Heading',pace:'Pace',stamina:'Stamina',strength:'Strength',agility:'Agility',leadership:'Leadership',composure:'Composure',teamwork:'Teamwork',work_rate:'Work Rate',positioning:'Positioning',vision:'Vision',decision_making:'Decision Making',anticipation:'Anticipation'};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));const val=k=>Math.max(0,Math.min(20,Number(a[k])||0));const pos=x=>({goalkeeper:'GK',defender:'DEF',midfielder:'MID',forward:'FWD'})[x]||'—';const colour=x=>x===0?'':x<=5?'red':x<=10?'yellow':x<=15?'blue':'green';function overall(){const q=keys.map(val).filter(Boolean);return q.length?Math.round(q.reduce((x,y)=>x+y,0)/q.length*5):0}function tier(o){return o<20?'BASIC':o<40?'NOVICE':o<60?'INTERMEDIATE':o<80?'ADVANCED':'PRO'}function six(){const m={goalkeeper:[['gk_handling','HAN'],['gk_reflexes','REF'],['gk_positioning','POS'],['strength','STR'],['agility','AGI'],['passing','PAS']],defender:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['passing','PAS']],midfielder:[['passing','PAS'],['vision','VIS'],['dribbling','DRI'],['stamina','STA'],['decision_making','DEC'],['teamwork','TEA']],forward:[['finishing','FIN'],['pace','PAC'],['dribbling','DRI'],['first_touch','TOU'],['positioning','POS'],['composure','COM']]};return(m[p.position]||m.midfielder).map(x=>({l:x[1],v:Number(a[x[0]])||0}))}function show(id,el){document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on')}async function boot(){const s=await SB.auth.getSession();me=s.data.session?.user||null;const id=new URLSearchParams(location.search).get('id');if(!id)return location.replace('player.html');const r=await SB.rpc('get_player_profile',{p_player_id:id});if(r.error||!r.data?.ok)return $('app').innerHTML='<div class="panel"><div class="inner">Profile tidak ditemui.</div></div>';if(r.data.restricted)return $('app').innerHTML='<div class="panel"><div class="inner" style="text-align:center;padding:40px">🔒 <h2>Profile Private</h2><p class="meta">Pemain ini menghadkan profile kepada follower yang diluluskan.</p><button class="btn follow" onclick="follow()">＋ Minta Follow</button></div></div>';p=r.data.player;a=r.data.attributes||{};$('session').textContent=me?.email||'';render();loadHistory();loadKyc()}function render(){const own=me?.id===p.profile_id,o=overall(),s=six();$('app').innerHTML=`<div class="layout"><aside><div class="panel"><div class="portrait">${p.photo_url?`<img src="${esc(p.photo_url)}">`:'⚽'}</div><div class="inner"><div class="name">${esc(p.preferred_name||p.full_name)} ${p.verification_status==='verified'?'<span class="verified">✓ VERIFIED</span>':''}</div><div class="meta">${pos(p.position)} · ${esc(p.club_name||'Free Agent')}</div><div class="actions">${own?'<button class="btn primary" onclick="openEdit()">⚙ Edit</button>':'<button class="btn follow" onclick="follow()">＋ Follow</button>'}<button class="btn" onclick="share()">↗ Share</button></div></div></div><div class="panel" style="margin-top:10px"><h3>PLAYER FACTS</h3><div class="inner"><div class="row"><span class="label">Passport</span><span class="value">${esc(p.football_passport_no||'KYC belum selesai')}</span></div><div class="row"><span class="label">Position</span><span class="value">${pos(p.position)}</span></div><div class="row"><span class="label">Foot</span><span class="value">${esc(p.preferred_foot||'—')}</span></div><div class="row"><span class="label">Age</span><span class="value">${p.age??'—'}</span></div><div class="row"><span class="label">Height</span><span class="value">${p.height_cm?esc(p.height_cm)+' cm':'—'}</span></div><div class="row"><span class="label">Weight</span><span class="value">${p.weight_kg?esc(p.weight_kg)+' kg':'—'}</span></div><div class="row"><span class="label">Followers</span><span class="value">${p.follower_count||0}</span></div></div></div></aside><section><div class="hero"><div><div class="name">${esc(p.preferred_name||p.full_name)}</div><div class="position">${pos(p.position)} · ${esc(p.club_name||'Free Agent')} · ${esc(p.nationality||'Malaysian')}</div><div style="margin-top:9px">${esc(p.bio||'Belum ada biodata.')}</div></div><div style="text-align:right"><div class="ovr">${o}</div><div style="color:#fff">${tier(o)}</div></div></div><div class="tabs"><div class="tab on" onclick="show('dna',this)">🧬 DNA</div><div class="tab" onclick="show('card',this)">🃏 CARD</div><div class="tab" onclick="show('passport',this)">📖 PASSPORT</div><div class="tab" onclick="show('history',this)">📊 MATCH HISTORY</div><div class="tab" onclick="show('career',this)">🏆 CAREER</div><div class="tab" onclick="show('wall',this)">💬 WALL</div></div><div class="section on" id="dna"><div class="panel"><h3>FOOTBALL DNA · 1–20</h3><div class="inner"><div class="bars">${keys.map(k=>`<div class="attr"><div class="attrline"><span>${names[k]}</span><span class="num">${val(k)||'—'}</span></div><div class="bar"><div class="fill ${colour(val(k))}" style="width:${val(k)*5}%"></div></div></div>`).join('')}</div><div class="dna-note">Atribut tidak boleh diisi sendiri. Sumber rasmi: assessment oleh Coach bertauliah PlayPro dan, pada fasa akan datang, data prestasi perlawanan rasmi. AI belum aktif.</div></div></div></div><div class="section" id="card"><div class="panel"><h3>PLAYPRO PLAYER CARD</h3><div class="inner card-preview"><div class="pc"><div style="display:flex;justify-content:space-between"><div><div class="big">${o}</div><b>${pos(p.position)}</b></div><div>🇲🇾</div></div>${p.photo_url?`<img src="${esc(p.photo_url)}">`:'<div style="height:180px;display:grid;place-items:center;font-size:60px">⚽</div>'}<div style="font-size:17px;font-weight:950;margin-top:7px">${esc(p.preferred_name||p.full_name)}</div><div style="font:9px monospace;color:#d8bf6d">${esc(p.football_passport_no||'KYC PENDING')}</div><div class="six">${s.map(x=>`<div><b>${x.v||'—'}</b>${x.l}</div>`).join('')}</div><div style="margin-top:9px;color:var(--gold);font-weight:950">${tier(o)}</div></div><div><h2>${tier(o)}</h2><p class="meta">Card ini membaca profile + Football DNA. Card visual penuh dan fungsi share berada pada halaman Player Card.</p><div class="actions"><button class="btn primary" onclick="location.href='player_card_v2.html?id='+encodeURIComponent(p.id)">Buka Card Penuh →</button></div></div></div></div></div><div class="section" id="passport"><div class="panel"><h3>FOOTBALL PASSPORT · LIFETIME RECORD</h3><div class="inner"><div class="passport"><div class="box"><b>PASSPORT NO.</b>${esc(p.football_passport_no||'Belum KYC')}</div><div class="box"><b>VERIFICATION</b>${p.verification_status==='verified'?'✓ VERIFIED':'UNVERIFIED'}</div><div class="box"><b>IDENTITY DISPLAY</b>${p.display_name_mode==='legal'?'Nama sebenar':'Nama panggilan'}</div><div class="box"><b>CURRENT CLUB</b>${esc(p.club_name||'Free Agent')}</div></div><div class="kyc" id="kycbox">Memuatkan status KYC...</div></div></div></div><div class="section" id="history"><div class="panel"><h3>OFFICIAL MATCH HISTORY</h3><div class="inner history" id="hist">Memuatkan...</div></div></div><div class="section" id="career"><div class="panel"><h3>CAREER HISTORY</h3><div class="inner"><p class="meta">Career timeline akan dibina daripada rekod kelab, pertandingan dan perlawanan rasmi. Tiada data direka jika sumber belum ada.</p><div class="row"><span class="label">Current club</span><span class="value">${esc(p.club_name||'Free Agent')}</span></div><div class="row"><span class="label">Jersey</span><span class="value">${p.jersey_number??'—'}</span></div></div></div></div><div class="section" id="wall"><div class="panel"><h3>PLAYER WALL</h3><div class="inner"><div class="wallbox"><textarea id="post" maxlength="500" placeholder="Tulis status kau..."></textarea><button class="btn primary" onclick="post()">Post</button></div><div id="posts" class="meta" style="margin-top:12px">Wall akan memuatkan status pemain.</div></div></div></div></section></div>`}async function loadHistory(){const r=await SB.rpc('get_player_match_history',{p_player_id:p.id,p_limit:50});const d=r.data?.matches||r.data?.history||r.data||[];if(!Array.isArray(d)||!d.length)return $('hist').innerHTML='<span class="meta">Belum ada rekod perlawanan rasmi.</span>';const ks=Object.keys(d[0]);$('hist').innerHTML='<table><thead><tr>'+ks.slice(0,5).map(k=>`<th>${esc(k)}</th>`).join('')+'</tr></thead><tbody>'+d.map(row=>'<tr>'+ks.slice(0,5).map(k=>`<td>${esc(row[k])}</td>`).join('')+'</tr>').join('')+'</tbody></table>'}async function loadKyc(){if(!p||me?.id!==p.profile_id)return;const r=await SB.rpc('get_my_player_kyc_status');const d=r.data;if(r.error||!d?.ok)return $('kycbox').innerHTML='KYC belum tersedia.';if(d.verification_status==='verified')return $('kycbox').innerHTML='<b>✓ VERIFIED</b><br>Football Passport: <strong>'+esc(d.football_passport_no)+'</strong>';const st=d.kyc_status==='pending'?'⏳ KYC sedang disemak':d.kyc_status==='rejected'?'❌ KYC ditolak':'🔐 KYC belum dihantar';$('kycbox').innerHTML='<b>'+st+'</b><p style="margin:6px 0;color:var(--muted)">KYC diperlukan apabila kau mahu masuk kelab atau pertandingan.</p><button class="btn primary" onclick="requestKyc()">'+(d.kyc_status==='pending'?'Lihat Status':'Mulakan KYC')+'</button>'}async function requestKyc(){const id=prompt('Jenis dokumen: mykad / mykid / passport');if(!id||!['mykad','mykid','passport'].includes(id.toLowerCase()))return alert('Pilih mykad, mykid atau passport.');const state=prompt('Kod negeri kelahiran 2 digit (contoh 05)');if(!state||!/^[0-9]{2}$/.test(state))return alert('Kod negeri mesti 2 digit.');const r=await SB.rpc('request_player_kyc',{p_id_type:id.toLowerCase(),p_legal_name:p.full_name,p_birth_state_code:state});if(r.error)return alert(r.error.message);alert('Permohonan KYC dihantar.');loadKyc()}function openEdit(){$('full_name').value=p.full_name||'';$('preferred_name').value=p.raw_preferred_name||'';$('display_name_mode').value=p.display_name_mode||'preferred';$('bio').value=p.bio||'';$('profile_visibility').value=p.profile_visibility||'public';$('modal').style.display='grid'}function closeEdit(){$('modal').style.display='none'}async function saveEdit(){const r=await SB.rpc('update_my_player_profile',{p_payload:{full_name:$('full_name').value.trim(),preferred_name:$('preferred_name').value.trim(),display_name_mode:$('display_name_mode').value,bio:$('bio').value.trim(),profile_visibility:$('profile_visibility').value}});if(r.error)return $('em').textContent=r.error.message;closeEdit();location.reload()}async function follow(){const r=await SB.rpc('follow_player',{p_player_id:p.id});if(r.error)alert(r.error.message);else location.reload()}async function post(){const body=$('post')?.value.trim();if(!body)return;const r=await SB.from('player_posts').insert({player_id:p.id,author_profile_id:me.id,body});if(r.error)alert(r.error.message);else location.reload()}async function share(){if(navigator.share)navigator.share({title:'PlayPro Player Profile',text:p.preferred_name||p.full_name,url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Link profile disalin.')}}boot();</script></body></html>
