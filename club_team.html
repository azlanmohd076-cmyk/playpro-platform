<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Team / Squad</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>
:root{--ink:#18211c;--muted:#69766f;--line:#d5ddd8;--nav:#07120d;--green:#00b894;--blue:#1565b8;--gold:#f0c13b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#dce4df,#f1f4f2);font:13px Arial,system-ui,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,100%);margin:auto;padding:12px}.top{display:flex;align-items:center;gap:14px;background:var(--nav);color:#fff;padding:11px 14px;border-radius:8px 8px 0 0}.logo{font-size:22px;font-weight:950;color:var(--green)}.spacer{flex:1}.top a{color:#dce8e2;font-weight:900}.crumb{background:#f8faf9;border:1px solid var(--line);padding:8px 12px;color:var(--muted)}.hero{margin-top:10px;background:linear-gradient(120deg,#07392b,#1261b8);color:#fff;padding:15px;border-radius:6px}.title{font-size:27px;font-weight:950}.sub{color:#dcebf4;margin-top:4px}.layout{display:grid;grid-template-columns:1fr 310px;gap:10px;margin-top:10px}.panel{background:#fff;border:1px solid #c4cec8;border-radius:6px;box-shadow:0 2px 5px #0000000b}.panel h3{margin:0;padding:9px 11px;background:linear-gradient(#fafbfa,#e7ece9);border-bottom:1px solid var(--line);font-size:12px}.pad{padding:11px}.pitch{position:relative;aspect-ratio:.72;max-width:600px;margin:auto;background:linear-gradient(145deg,#197c31,#2b9b43);border:4px solid #fff;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px #fff8}.pitch:before{content:"";position:absolute;inset:8%;border:2px solid #ffffffaa}.pitch:after{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:2px solid #ffffffaa}.circle{position:absolute;width:23%;aspect-ratio:1;border:2px solid #ffffffaa;border-radius:50%;left:38.5%;top:38.5%}.center-dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;left:calc(50% - 4px);top:calc(50% - 4px)}.box{position:absolute;left:25%;right:25%;height:14%;border:2px solid #ffffffaa}.box.top{top:8%}.box.bottom{bottom:8%}.goal{position:absolute;left:38%;right:38%;height:3%;border:2px solid #fff}.goal.top{top:4%}.goal.bottom{bottom:4%}.slot{position:absolute;width:70px;height:70px;border-radius:50%;transform:translate(-50%,-50%);background:#ffd84d;border:2px solid #fff;display:grid;place-items:center;text-align:center;font-weight:950;font-size:10px;cursor:pointer;box-shadow:0 2px 8px #0005;z-index:2;padding:4px}.slot.empty{background:#ffffff33;color:#fff;border:2px dashed #fff}.slot small{font-size:9px}.pool{display:grid;gap:6px;max-height:620px;overflow:auto}.player{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:5px;background:#fafcfa;cursor:grab}.player.selected{outline:2px solid var(--green);background:#eaf8f3}.player img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#dfe6e1}.player b{display:block}.player span{font-size:10px;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.btn{border:1px solid #bdc8c1;background:#fff;border-radius:5px;padding:8px 10px;font-weight:900;cursor:pointer}.primary{background:var(--nav);color:#fff;border-color:var(--nav)}.green{background:var(--green);color:#00130e;border-color:var(--green)}.select{padding:8px;border:1px solid var(--line);border-radius:5px;font-weight:900}.note{padding:9px;background:#eef6f2;border-left:3px solid var(--green);color:#56645d;margin-top:9px}.msg{font-weight:900;margin-top:8px;min-height:20px}.modalwrap{display:none;position:fixed;inset:0;background:#0009;z-index:20;place-items:center;padding:15px}.modal{width:min(560px,100%);background:#fff;border-radius:8px;padding:18px}.modal input,.modal select{width:100%;padding:9px;border:1px solid var(--line);border-radius:5px}.modal label{display:block;font-weight:900;margin:9px 0 4px;color:#075d4d}@media(max-width:850px){.layout{grid-template-columns:1fr}.pool{max-height:none;grid-template-columns:1fr 1fr}}@media(max-width:520px){.pool{grid-template-columns:1fr}.slot{width:55px;height:55px;font-size:9px}}
</style></head><body><main class="wrap"><nav class="top"><div class="logo">PlayPro</div><a href="club.html">← CLUB CENTER</a><span class="spacer"></span><span id="who">—</span></nav><div class="crumb">🏠 Club › Team / Squad</div><div id="app">Memuatkan squad…</div></main><div class="modalwrap" id="modal"><div class="modal"><button class="btn" style="float:right" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div><script>
'use strict';const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ');let me=null,team=null,roster=[],directory=[],tactics=null,selectedPlayer=null,dragId=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const age=x=>x==='open'?'OPEN':x==='veteran'?'VETERAN':x.toUpperCase();
const FORM={'4-3-3':[[50,92,'GK'],[18,72,'LB'],[38,76,'CB'],[62,76,'CB'],[82,72,'RB'],[28,55,'CM'],[50,61,'DM'],[72,55,'CM'],[22,31,'LW'],[50,23,'ST'],[78,31,'RW']],'4-2-3-1':[[50,92,'GK'],[18,72,'LB'],[38,76,'CB'],[62,76,'CB'],[82,72,'RB'],[36,59,'DM'],[64,59,'DM'],[23,38,'LAM'],[50,42,'AM'],[77,38,'RAM'],[50,22,'ST']],'3-4-3':[[50,92,'GK'],[30,74,'CB'],[50,78,'CB'],[70,74,'CB'],[15,55,'LM'],[38,58,'CM'],[62,58,'CM'],[85,55,'RM'],[22,30,'LW'],[50,22,'ST'],[78,30,'RW']],'3-5-2':[[50,92,'GK'],[30,75,'CB'],[50,79,'CB'],[70,75,'CB'],[14,55,'LWB'],[35,57,'CM'],[50,47,'DM'],[65,57,'CM'],[86,55,'RWB'],[38,25,'ST'],[62,25,'ST']],'3-4-2-1':[[50,92,'GK'],[30,75,'CB'],[50,79,'CB'],[70,75,'CB'],[15,55,'LM'],[38,58,'CM'],[62,58,'CM'],[85,55,'RM'],[37,36,'AM'],[63,36,'AM'],[50,22,'ST']],'4-4-2':[[50,92,'GK'],[18,72,'LB'],[38,76,'CB'],[62,76,'CB'],[82,72,'RB'],[16,52,'LM'],[38,57,'CM'],[62,57,'CM'],[84,52,'RM'],[38,25,'ST'],[62,25,'ST']],'4-1-4-1':[[50,92,'GK'],[18,72,'LB'],[38,76,'CB'],[62,76,'CB'],[82,72,'RB'],[50,61,'DM'],[17,43,'LM'],[38,48,'CM'],[62,48,'CM'],[83,43,'RM'],[50,23,'ST']]};
function openModal(h){$('modalBody').innerHTML=h;$('modal').style.display='grid'}function closeModal(){$('modal').style.display='none'}
async function boot(){const s=await SB.auth.getSession();me=s.data.session?.user||null;if(!me){$('app').innerHTML='<div class="panel"><div class="pad">🔐 Log masuk diperlukan.</div></div>';return}$('who').textContent=me.email||'PlayPro User';const id=new URLSearchParams(location.search).get('team');if(!id){$('app').innerHTML='<div class="panel"><div class="pad">Team ID tiada.</div></div>';return}const r=await SB.from('club_teams').select('id,club_id,name,age_category,squad_label,display_name,season,status,formation,primary_coach_profile_id,assistant_coach_profile_id').eq('id',id).maybeSingle();if(r.error||!r.data){$('app').innerHTML='<div class="panel"><div class="pad">Squad tidak ditemui.</div></div>';return}team=r.data;await Promise.all([loadRoster(),loadDirectory(),loadTactics()]);render()}
async function loadRoster(){const r=await SB.rpc('get_team_roster',{p_team_id:team.id});roster=r.data||[]}
async function loadDirectory(){const r=await SB.rpc('get_club_player_directory',{p_club_id:team.club_id});directory=(r.data||[]).filter(p=>!roster.some(x=>x.player_id===p.player_id))}
async function loadTactics(){const r=await SB.from('club_team_tactics').select('*').eq('team_id',team.id).maybeSingle();tactics=r.data||{formation:team.formation||'4-3-3',lineup:[],bench:[]}}
function render(){const f=tactics.formation||team.formation||'4-3-3';$('app').innerHTML='<div class="hero"><div class="title">'+esc(team.display_name)+'</div><div class="sub">'+age(team.age_category)+' · Squad '+esc(team.squad_label)+' · '+esc(f)+' · '+roster.length+' pemain</div></div><div class="actions"><select class="select" id="formation" onchange="changeFormation(this.value)">'+Object.keys(FORM).map(x=>'<option '+(x===f?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="btn green" onclick="saveTactics()">💾 Save Tactical XI</button><button class="btn" onclick="showAddPlayer()">＋ Add Player</button><button class="btn" onclick="showTmr()">⚡ Team Match Room</button></div><div class="layout"><section class="panel"><h3>TACTICAL XI · DRAG / TAP PLAYER KE POSISI</h3><div class="pad"><div class="pitch" id="pitch"><div class="circle"></div><div class="center-dot"></div><div class="box top"></div><div class="box bottom"></div><div class="goal top"></div><div class="goal bottom"></div>'+FORM[f].map((s,i)=>'<div class="slot '+(s[2]?'':'empty')+'" data-slot="'+i+'" style="left:'+s[0]+'%;top:'+s[1]+'%" ondragover="event.preventDefault()" ondrop="dropPlayer(event,'+i+')" onclick="placeSelected('+i+')">'+slotText(i,s[2])+'</div>').join('')+'</div><div class="note">Desktop: drag pemain ke bulatan. Telefon: tap pemain dahulu, kemudian tap posisi. Klik nama dalam posisi untuk buka Player Profile.</div></div></section><aside class="panel"><h3>PLAYER POOL · '+roster.length+'</h3><div class="pad"><div class="pool">'+(roster.length?roster.map(p=>'<div class="player '+(selectedPlayer===p.player_id?'selected':'')+'" draggable="true" ondragstart="startDrag(event,\''+p.player_id+'\')" onclick="selectPlayer(\''+p.player_id+'\')">'+(p.photo_url?'<img src="'+esc(p.photo_url)+'">':'<img alt="" src="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2736%27 height=%2736%27%3E%3Crect width=%2736%27 height=%2736%27 fill=%27%23dfe6e1%27/%3E%3C/svg%3E">')+'<div><b>'+esc(p.display_name)+'</b><span>#'+esc(p.jersey_number??'—')+' · '+esc(p.player_position)+'</span></div></div>').join(''):'<div class="empty">Squad masih kosong. Add Player untuk mula.</div>')+'</div></div></aside></div>'}
function startDrag(e,id){dragId=id;selectedPlayer=id;if(e.dataTransfer)e.dataTransfer.setData('text/plain',id)}function selectPlayer(id){selectedPlayer=selectedPlayer===id?null:id;render()}function placeSelected(slot){if(!selectedPlayer)return;const id=selectedPlayer;tactics.lineup=(tactics.lineup||[]).filter(x=>x.slot!==slot&&x.player_id!==id);tactics.lineup.push({slot,player_id:id});selectedPlayer=null;render()}function dropPlayer(e,i){e.preventDefault();const id=(e.dataTransfer&&e.dataTransfer.getData('text/plain'))||dragId;if(id){selectedPlayer=id;placeSelected(i)}}function slotText(i,label){const current=(tactics.lineup||[]).find(x=>x.slot===i);if(!current)return '<small>'+esc(label||'DROP')+'</small>';const p=roster.find(x=>x.player_id===current.player_id);return '<small>#'+esc(p?.jersey_number??'')+'</small><span>'+esc(p?.display_name||'Player')+'</span>'}
function changeFormation(f){tactics.formation=f;tactics.lineup=[];selectedPlayer=null;render()}
async function saveTactics(){const r=await SB.rpc('save_team_tactics',{p_team_id:team.id,p_formation:tactics.formation,p_lineup:tactics.lineup||[],p_bench:tactics.bench||[],p_notes:null});$('who').textContent=r.error?'❌ '+r.error.message:'✓ Tactical XI saved';setTimeout(()=>boot(),700)}
function showAddPlayer(){openModal('<h2>＋ Tambah Pemain</h2><p class="small">Senarai diambil daripada Player Profile sebenar dalam kelab. Database akan menolak KYC yang belum verified dan umur yang tidak layak.</p><label>Pemain</label><select id="pid">'+(directory.length?directory.map(p=>'<option value="'+esc(p.player_id)+'">'+esc(p.display_name)+' · '+esc(p.player_position)+'</option>').join(''):'<option value="">Tiada pemain yang boleh dipilih</option>')+'</select><label>Nombor jersi (optional)</label><input id="jersey" type="number" min="0" max="99"><div class="actions"><button class="btn green" '+(directory.length?'':'disabled')+' onclick="addPlayer()">Tambah</button><button class="btn" onclick="closeModal()">Batal</button></div><div id="mmsg" class="msg"></div>')}
async function addPlayer(){const r=await SB.rpc('add_player_to_club_team',{p_team_id:team.id,p_player_id:$('pid').value,p_jersey:Number($('jersey').value)||null});if(r.error){$('mmsg').textContent='❌ '+r.error.message;return}closeModal();await boot()}
function showTmr(){openModal('<h2>⚡ Team Match Room</h2><p>TMR ialah ruang operasi untuk satu <b>fixture</b>, bukan match history.</p><div class="note"><b>Tiada masalah matchboard bertimbun.</b> Identiti TMR = Team + Fixture. Satu fixture = satu room untuk team tersebut. Selepas finalized, room menjadi rekod analisis dan tidak di-reset. Fixture seterusnya mendapat room baharu. Event gol, kad, pertukaran dan statistik kekal dipautkan ke fixture/player/referee melalui pipeline rasmi.</div><div class="actions"><button class="btn primary" onclick="closeModal()">Tutup</button></div>')}
boot();
</script></body></html>
