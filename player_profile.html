round:#00d4aa16;color:var(--g);font-weight:900}.section{display:none;margin-top:12px}.section.on{display:block}.panel{background:rgba(14,24,19,.97);border:1px solid var(--line);border-radius:20px;padding:18px}.attrs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.attr{background:#ffffff05;border:1px solid #ffffff0b;border-radius:11px;padding:9px}.bar{height:6px;background:#ffffff0b;border-radius:99px;margin-top:7px}.fill{height:100%;border-radius:99px}.red{background:var(--red)}.yellow{background:#eab308}.blue{background:var(--blue)}.green{background:#16a34a}.overall{font-size:50px;font-weight:950;color:var(--gold)}.dnahead{display:flex;justify-content:space-between;align-items:center}.passport{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.fact{background:#ffffff05;border-radius:12px;padding:12px}.fact b{display:block;color:var(--g);font-size:11px;margin-bottom:4px}.cardbox{text-align:center}.pc{width:230px;min-height:315px;margin:auto;border-radius:19px;padding:12px;background:linear-gradient(155deg,#3b2b06,#100c02);border:2px solid var(--gold);box-shadow:0 0 50px #f0c04055}.pc-top{display:flex;justify-content:space-between}.pc-ovr{font-size:42px;font-weight:950}.pc-photo{height:145px;margin:7px 0;border-radius:12px;background:#ffffff0a;display:grid;place-items:center;font-size:55px;overflow:hidden}.pc-photo img{width:100%;height:100%;object-fit:cover}.pc-name{font-size:17px;font-weight:950;text-transform:uppercase}.pc-id{font:9px monospace;color:#d8bf6d}.pc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}.pc-stat{font-size:9px;color:#d7cda8}.pc-stat b{display:block;font-size:16px;color:#fff}.history{display:grid;gap:0}.row{display:grid;grid-template-columns:90px 1fr 110px;gap:8px;padding:10px 0;border-bottom:1px solid #ffffff0b}.post{padding:12px 0;border-bottom:1px solid #ffffff0b}.postbox textarea,.modal input,.modal textarea,.modal select{width:100%;padding:11px;border-radius:11px;border:1 q.length?Math.round(q.reduce((x,y)=>x+y,0)/q.length*5):0}function tier(o){return o<20?'BASIC':o<40?'NOVICE':o<60?'INTERMEDIATE':o<80?'ADVANCED':'PRO'}function colour(x){return x===0?'':x<=5?'red':x<=10?'yellow':x<=15?'blue':'green'}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function six(){const m={goalkeeper:[['gk_handling','HAND'],['gk_reflexes','REF'],['gk_positioning','POS'],['strength','STR'],['agility','AGI'],['passing','PAS']],defender:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['passing','PAS']],midfielder:[['passing','PAS'],['vision','VIS'],['dribbling','DRI'],['stamina','STA'],['decision_making','DEC'],['teamwork','TEA']],forward:[['finishing','FIN'],['pace','PAC'],['dribbling','DRI'],['first_touch','TOU'],['positioning','POS'],['composure','COM']]};return(m[p.position]||m.midfielder).map(x=>({l:x[1],v:Number(a[x[0]])||0}))}async function boot(){const s=(await SB.auth.getSession()).data.session;me=s?.user||null;let id=new URLSearchParams(location.search).get('id');if(!id&&me){const q=await SB.from('players').select('id').eq('profile_id',me.id).maybeSingle();id=q.data?.id}if(!id)return location.replace('player.html');const r=await SB.rpc('get_player_profile',{p_player_id:id});if(r.error||!r.data?.ok)return document.getElementById('app').innerHTML='<div class="panel">Profile tidak ditemui.</div>';if(r.data.restricted)return document.getElementById('app').innerHTML='<div class="panel lock"><div style="font-size:50px">🔒</div><h2>Profile Private</h2><p class="muted">Follow pemain ini untuk meminta akses.</p><button class="btn follow" onclick="follow()">'+(r.data.follow_status==='pending'?'⏳ Permintaan dihantar':'＋ Minta Follow')+'</button></div>';p=r.data.player;a=r.data.attributes||{};render();history(id)}function render(){const own=me?.id===p.profile_id,follow=window._follow||'none',o=ovr();document.getElementById('app').innerHTML=`<section class="hero"><div class="avatar">${p.photo_url?`<img src="${esc(p.photo_url)}">`:'👤'}</div><div><div class="name">${esc(p.preferred_name||p.full_name)} ${p.verification_status==='verified'?'<span class="badge">✓ VERIFIED</span>':''}</div><div class="meta">${pos(p.position)} · ${esc(p.club_name||'Free Agent')} · ${esc(p.nationality||'Malaysian')} · ${p.age??'—'} tahun</div><div class="bio">${esc(p.bio||'Belum ada biodata.')}</div><div class="actions">${own?'':'<button class="btn follow" onclick="follow()">＋ Follow</button>'}${own?'<button class="btn" onclick="openEdit()">⚙ Edit Profile</button>':''}<button class="btn" onclick="share()">↗ Kongsi</button></div></div><div><div class="muted">FOLLOWERS</div><div style="font-size:30px;font-weight:950">${p.follower_count||0}</div><div class="muted" style="margin-top:10px">PASSPORT</div><div style="color:var(--gold);font-size:12px">${esc(p.football_passport_no)}</div></div></section><div class="tabs"><div class="tab on" onclick="show('dna',this)">🧬 DNA</div><div class="tab" onclick="show('card',this)">🃏 CARD</div><div class="tab" onclick="show('passport',this)">📖 PASSPORT</div><div class="tab" onclick="show('history',this)">📊 HISTORY</div><div class="tab" onclick="show('wall',this)">💬 WALL</div></div><div class="section on" id="dna"><div class="panel"><div class="dnahead"><div><h2>Football DNA</h2><div class="muted">18 atribut · 0–20 · 0 = belum dinilai</div></div><div class="overall">${o}</div></div><div class="attrs">${keys.map(k=>`<div class="attr"><div style="display:flex;justify-content:space-between"><span>${names[k]}</span><b>${v(k)||'—'}</b></div><div class="bar"><div class="fill ${colour(v(k))}" style="width:${v(k)*5}%"></div></div></div>`).join('')}</div><div class="muted" style="margin-top:15px">Atribut tidak boleh diisi sendiri. Coach bertauliah akan menjadi sumber assessment; data match rasmi pula akan menjadi input organik pada enjin masa depan. AI belum aktif.</div></div></div><div class="section" id="card"><div class="panel cardbox"><div class="pc"><div class="pc-top"><div><div class="pc-ovr">${o}</div><b>${pos(p.position)}</b></div><div>🇲🇾</div></div><div class="pc-photo">${p.photo_url?`<img src="${esc(p.photo_url)}">`:'⚽'}</div><div class="pc-name">${esc(p.preferred_name||p.full_name)}</div><div class="pc-id">${esc(p.football_passport_no)}</div><div class="pc-stats">${six().map(x=>`<div class="pc-stat"><b>${x.v||'—'}</b>${x.l}</div>`).join('')}</div><div style="margin-top:10px;color:var(--gold);font-weight:950">${tier(o)}</div></div><div class="actions" style="justify-content:center"><button class="btn follow" onclick="location.href='player_card_v2.html?id='+encodeURIComponent(p.id)">Buka Kad Penuh ↗</button></div></div></div><div class="section" id="passport"><div class="panel"><h2>📖 Football Passport</h2><p class="muted">Rekod perjalanan bola sepak sebenar kau — sejarah ini dibina daripada rekod rasmi.</p><div class="passport"><div class="fact"><b>Passport No.</b>${esc(p.football_passport_no)}</div><div class="fact"><b>Verification</b>${p.verification_status==='verified'?'✓ Verified':'Belum KYC'}</div><div class="fact"><b>Posisi</b>${pos(p.position)}</div><div class="fact"><b>Kelab</b>${esc(p.club_name||'Free Agent')}</div><div class="fact"><b>Tinggi</b>${p.height_cm?esc(p.height_cm)+' cm':'—'}</div><div class="fact"><b>Berat</b>${p.weight_kg?esc(p.weight_kg)+' kg':'—'}</div></div></div></div><div class="section" id="history"><div class="panel"><h2>📊 Match History</h2><div id="hist" class="history muted">Memuatkan...</div></div></div><div class="section" id="wall"><div class="panel">${own?'<div class="postbox"><textarea id="post" maxlength="500" placeholder="Tulis status kau..."></textarea><button class="btn follow" onclick="post()">Post</button><div id="pm" class="msg"></div></div>':''}<div id="posts" style="margin-top:12px"><span class="muted">Wall dimuatkan selepas log masuk.</span></div></div></div>`;window._follow=follow;loadPosts()}</script><script>function show(id,e){document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));e.classList.add('on')}async function follow(){if(!me)return location.href='player_signup.html';const r=await SB.rpc('follow_player',{p_player_id:p.id});if(r.error)return alert(r.error.message);boot()}async function history(id){const r=await SB.rpc('get_player_match_history',{p_player_id:id,p_limit:50});const h=r.data||[],el=document.getElementById('hist');if(!h.length){el.textContent='Belum ada perlawanan rasmi.';return}el.innerHTML=h.map(x=>`<div class="row"><span>${x.match_date?new Date(x.match_date).toLocaleDateString('ms-MY'):''}</span><span><b>${esc(x.home_club||'Home')}</b> ${x.home_goals??0}–${x.away_goals??0} <b>${esc(x.away_club||'Away')}</b></span><span>${x.minutes_played||0}' · ⚽${x.goals||0}</span></div>`).join('')}async function loadPosts(){const el=document.getElementById('posts');if(!me||!el)return;const r=await SB.from('player_posts').select('body,created_at').eq('player_id',p.id).order('created_at',{ascending:false}).limit(20);if(r.error)return;el.innerHTML=r.data.length?r.data.map(x=>`<div class="post">${esc(x.body)}<div class="muted">${new Date(x.created_at).toLocaleString('ms-MY')}</div></div>`).join(''):'<div class="muted">Belum ada status.</div>'}async function post(){const body=document.getElementById('post').value.trim();if(!body)return;const r=await SB.from('player_posts').insert({player_id:p.id,author_profile_id:me.id,body});if(r.error)return document.getElementById('pm').textContent='❌ '+r.error.message;document.getElementById('post').value='';loadPosts()}function openEdit(){document.getElementById('ep').value=p.preferred_name||'';document.getElementById('eb').value=p.bio||'';document.getElementById('en').value=p.nationality||'Malaysian';document.getElementById('ev').value=p.profile_visibility||'public';document.getElementById('modal').style.display='grid'}function closeEdit(){document.getElementById('modal').style.display='none'}async function save(){const r=await SB.rpc('update_my_player_profile',{p_payload:{preferred_name:document.getElementById('ep').value,bio:document.getElementById('eb').value,nationality:document.getElementById('en').value,profile_visibility:document.getElementById('ev').value}});if(r.error)return document.getElementById('em').textContent='❌ '+r.error.message;closeEdit();boot()}function share(){const u=location.href;navigator.share?navigator.share({title:'PlayPro Player Profile',text:'⚽ Tengok profile pemain di PlayPro',url:u}).catch(()=>{}):navigator.clipboard.writeText(u).then(()=>alert('Link disalin.'))}boot();</script></body></html>
