<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — KYC Review</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--bg:#07100c;--card:#101a15;--line:#26372f;--txt:#edf6f1;--muted:#8da197;--g:#00d4aa;--gold:#f0c040;--red:#ff7d7d}*{box-sizing:border-box}body{margin:0;background:#07100c;color:var(--txt);font:14px system-ui,sans-serif;padding:20px}.wrap{max-width:1100px;margin:auto}.head{display:flex;justify-content:space-between;gap:15px;align-items:end}.brand{color:var(--g);font-weight:900}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px}.pill{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:900}.p{background:#342d10;color:#ffe17a}.m{color:var(--muted)}.docs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.docs img{width:100%;max-height:280px;object-fit:contain;background:#000;border-radius:10px}.docs a{color:var(--g);font-weight:800}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,textarea{width:100%;background:#08110d;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}label{display:block;color:var(--g);font-size:11px;font-weight:800;margin:10px 0 5px}button{padding:10px 14px;border:0;border-radius:9px;font-weight:900;cursor:pointer}.approve{background:var(--g);color:#00120d}.reject{background:#411b1b;color:#ffd0d0}.actions{display:flex;gap:8px;margin-top:12px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}@media(max-width:650px){.docs{grid-template-columns:1fr}.row{grid-template-columns:1fr}.head{display:block}}</style></head>
<body><main class="wrap"><div class="head"><div><div class="brand">PLAYPRO / ADMIN</div><h1>Player KYC Review</h1><div class="muted">Panel semakan terhad kepada akaun PlayPro berkuasa. Dokumen diberikan melalui URL sementara.</div></div><button onclick="load()">↻ Refresh</button></div><div id="msg" class="muted" style="margin-top:15px">Memuatkan…</div><section id="list" class="grid"></section></main>
<script>'use strict';const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtdWlyaGVudmpydXZmeW5vYXhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NjM0OTQsImV4cCI6MjA5MzEzOTQ5NH0.ZNphviTQfnMjkGIdZtevwC8jmJjTCaXHhojcv4g5R20');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));async function load(){const s=await SB.auth.getSession();if(!s.data.session)return $('msg').textContent='Sila log masuk sebagai PlayPro privileged user.';const r=await SB.functions.invoke('kyc-review-player',{method:'GET'});if(r.error){$('msg').textContent='Akses/ralat: '+r.error.message;return}const d=r.data;if(!d?.ok){$('msg').textContent=d?.error||'Akses ditolak';return}$('msg').textContent=d.count+' permohonan KYC menunggu semakan.';$('list').innerHTML='';if(!d.count){$('list').innerHTML='<div class="empty">Tiada KYC pending. Sistem bersih. ✓</div>';return}for(const x of d.requests){const p=x.player||{};const urls=x.document_urls||[];const card=document.createElement('article');card.className='card';card.innerHTML=`<div><span class="pill p">PENDING</span> <span class="m">${esc(x.id_type)}</span></div><h2>${esc(p.preferred_name||p.full_name||'Player')}</h2><div class="muted">Nama pada permohonan: ${esc(x.legal_name_claimed)}<br>Tarikh lahir profil: ${esc(p.date_of_birth)}<br>Kod negeri: ${esc(x.birth_state_code||'-')}<br>Auto-match: <b>${esc(x.match_status||'not_processed')}</b> · ${x.match_score==null?'-':esc(x.match_score)+'%'}<br>Extracted: ${esc(x.extracted_legal_name||'-')} · ${esc(x.extracted_birth_date||'-')}<br>Masked ID: ${esc(x.extracted_identifier_masked||'-')}</div><div class="docs">${urls.map((u,i)=>u.toLowerCase().includes('.pdf')?`<a href="${esc(u)}" target="_blank" rel="noopener">Buka dokumen ${i+1} ↗</a>`:`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Dokumen ${i+1}"></a>`).join('')}</div><label>NAMA SAH DISAHKAN (isi jika OCR tidak tepat)</label><input id="name_${x.id}" value="${esc(x.extracted_legal_name||x.legal_name_claimed||'')}"><div class="row"><div><label>TARIKH LAHIR DISAHKAN (opsyenal)</label><input id="dob_${x.id}" type="date" value="${esc(x.extracted_birth_date||p.date_of_birth||'')}"></div><div><label>KOD NEGERI DISAHKAN</label><input id="state_${x.id}" inputmode="numeric" maxlength="2" value="${esc(x.birth_state_code||'')}"></div></div><label>NOTA REVIEW</label><textarea id="note_${x.id}" rows="2" placeholder="Sebab / catatan semakan wajib untuk keputusan manual"></textarea><div class="actions"><button class="approve" onclick="decide('${x.id}','approve')">✓ APPROVE & VERIFY</button><button class="reject" onclick="decide('${x.id}','reject')">✕ REJECT</button></div>`;$('list').appendChild(card)}}async function decide(id,action){const note=$(action==='reject'?`note_${id}`:`note_${id}`).value.trim();if(action==='reject'&&!note)return alert('Sebab penolakan wajib diisi.');if(action==='approve'&&!confirm('Sahkan KYC pemain ini? Nama sah akan dikunci dan Football Passport akan dijana.'))return;const body={kyc_id:id,action,reviewer_note:note};if(action==='approve'){body.verified_legal_name=$(`name_${id}`).value.trim();body.verified_birth_date=$(`dob_${id}`).value||null;body.verified_birth_state_code=$(`state_${id}`).value.trim()}const r=await SB.functions.invoke('kyc-review-player',{body});if(r.error)return alert(r.error.message);if(!r.data?.ok)return alert(r.data?.error||'Keputusan gagal');await load()}load();</script></body></html>
