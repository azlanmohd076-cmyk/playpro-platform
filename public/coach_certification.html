nan certification.</div>'}async function requestCourse(){const r=await SB.rpc('request_playpro_coach_certification',{p_course_no:Number($('course').value),p_track:$('track').value});$('msg').textContent=r.error?'❌ '+r.error.message:'✓ Permohonan certification dihantar';if(!r.error)boot()}boot();</script></body></html>
