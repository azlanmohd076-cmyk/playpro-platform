<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b172a"><title>PlayPro — League Admin Match Centre</title>
<link rel="stylesheet" href="../css/shared_dashboard_styles.css">
<style>
:root{--ink:#102033;--muted:#6b7b8f;--line:#dbe3ea;--panel:#fff;--soft:#f3f7fa;--brand:#0077b6;--navy:#0b172a;--ok:#16865b;--warn:#b7791f;--danger:#c43d3d}*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:var(--ink);font:14px Inter,system-ui,sans-serif;overflow:auto}button,input,select{font:inherit}.top{background:var(--navy);color:#fff;padding:20px clamp(18px,5vw,64px);display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:20px;font-weight:800;letter-spacing:-.03em}.brand span{color:#4cc9f0}.user{font-size:12px;color:#cbd5e1}.wrap{max-width:1240px;margin:auto;padding:28px clamp(18px,5vw,64px) 60px}.crumb{color:var(--muted);font-size:12px;margin-bottom:8px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.heading h1{font-size:30px;line-height:1.15;margin:0 0 8px;letter-spacing:-.04em}.heading p{margin:0;color:var(--muted)}.select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 14px;color:var(--ink);min-width:230px}.layout{display:grid;grid-template-columns:290px 1fr;gap:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 5px 18px #1020330b}.panel-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.panel-head h2{font-size:15px;margin:0}.fixture-list{padding:8px}.fixture{width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;padding:14px 12px;border-radius:7px;cursor:pointer;color:var(--ink)}.fixture:hover,.fixture.active{background:#eaf6fb;border-left-color:var(--brand)}.fixture-date{font-size:11px;color:var(--muted);margin-bottom:6px}.fixture-teams{font-weight:700}.fixture-meta{font-size:11px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between}.badge{font-size:10px;font-weight:800;letter-spacing:.05em;padding:4px 7px;border-radius:999px;background:#fff3d6;color:var(--warn)}.badge.official{background:#def7eb;color:var(--ok)}.hero{padding:24px 26px;background:linear-gradient(135deg,#0b172a,#123b59);color:#fff;border-radius:12px 12px 0 0}.hero-top{display:flex;justify-content:space-between;align-items:start}.hero h2{margin:0;font-size:13px;font-weight:500;color:#a9c6d7}.hero-date{color:#b8ccda;font-size:12px}.scoreline{display:flex;align-items:center;justify-content:center;gap:28px;margin:22px 0 8px}.club{text-align:center;min-width:130px;font-weight:700}.crest{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;margin:0 auto 8px;font-size:15px;font-weight:900}.score{font-size:38px;font-weight:900;letter-spacing:.06em}.venue{text-align:center;color:#b8ccda;font-size:12px}.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 20px}.tab{padding:14px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:700}.tab.active{color:var(--brand);border-color:var(--brand)}.form{padding:22px}.form h3{margin:0 0 18px;font-size:16px}.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field select{border:1px solid var(--line);border-radius:7px;background:#fff;padding:10px 11px;color:var(--ink);width:100%}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:24px 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.btn{border:1px solid var(--line);border-radius:7px;padding:11px 15px;cursor:pointer;font-weight:700;background:#fff;color:var(--ink)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.notice{display:none;padding:12px 14px;border-radius:7px;margin:0 22px 18px;font-size:13px}.notice.show{display:block}.notice.error{background:#fff0f0;color:var(--danger)}.notice.success{background:#e8f8f0;color:var(--ok)}.loading,.empty{padding:35px;text-align:center;color:var(--muted)}.summary{padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-bottom:1px solid var(--line)}.summary strong{display:block;font-size:20px}.summary span{font-size:11px;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}.heading{align-items:stretch;flex-direction:column}.select{width:100%}.stats{grid-template-columns:1fr 1fr}.scoreline{gap:12px}.club{min-width:100px}.top{padding:16px 18px}}@media(max-width:480px){.score-grid,.stats{grid-template-columns:1fr}.heading h1{font-size:25px}.hero{padding:20px 15px}}
</style>
</head>
<body>
<header class="top"><div class="brand">Play<span>Pro</span> / Match Centre</div><div id="userLabel" class="user">Menyemak akses...</div></header>
<main class="wrap"><div class="crumb">League Admin &nbsp;/&nbsp; Match Centre</div><div class="heading"><div><h1>Ratify Result</h1><p>Sahkan keputusan rasmi perlawanan dan kemas kini rekod liga.</p></div><select id="leagueSelect" class="select" aria-label="Pilih liga"><option value="">Memuatkan liga...</option></select></div>
<div id="pageNotice" class="notice"></div><div class="layout"><aside class="panel"><div class="panel-head"><h2>Perlawanan</h2><span id="fixtureCount" class="user">—</span></div><div id="fixtureList" class="loading">Memuatkan perlawanan...</div></aside>
<section class="panel"><div id="matchHero" class="hero"><div class="loading" style="color:#b8ccda">Pilih perlawanan untuk bermula.</div></div><div id="matchContent" class="empty">Pilih perlawanan pending daripada senarai di sebelah.</div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="../js/supabase.js"></script><script src="../js/repositories.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);let leagues=[],fixtures=[],selected=null,user=null;
const fields=[['home_goals','Gol tuan rumah','0','100'],['away_goals','Gol pelawat','0','100'],['home_possession','Possession tuan rumah (%)','0','100'],['away_possession','Possession pelawat (%)','0','100'],['home_shots','Shots tuan rumah','0','100'],['away_shots','Shots pelawat','0','100'],['home_shots_on_target','Shots on target tuan rumah','0','100'],['away_shots_on_target','Shots on target pelawat','0','100'],['home_corners','Corners tuan rumah','0','50'],['away_corners','Corners pelawat','0','50'],['home_fouls','Fouls tuan rumah','0','100'],['away_fouls','Fouls pelawat','0','100'],['home_yellow_cards','Kad kuning tuan rumah','0','20'],['away_yellow_cards','Kad kuning pelawat','0','20'],['home_red_cards','Kad merah tuan rumah','0','10'],['away_red_cards','Kad merah pelawat','0','10'],['home_saves','Saves tuan rumah','0','50'],['away_saves','Saves pelawat','0','50']];
function notice(text,type='error'){const n=$('pageNotice');n.textContent=text;n.className='notice show '+type;window.scrollTo({top:0,behavior:'smooth'})}function date(v){return v?new Date(v).toLocaleDateString('ms-MY',{day:'2-digit',month:'short',year:'numeric'}):'—'}function norm(r){return Array.isArray(r)?r[0]||null:r||null}function val(r,k){return r?.[k]??''}
function renderFixtures(){const el=$('fixtureList');$('fixtureCount').textContent=fixtures.length+' rekod';if(!fixtures.length){el.innerHTML='<div class="empty">Tiada perlawanan untuk liga ini.</div>';return}el.innerHTML=fixtures.map((f,i)=>{const r=norm(f.matchResults);return `<button class="fixture ${selected?.id===f.id?'active':''}" data-i="${i}"><div class="fixture-date">${date(f.matchDate)}</div><div class="fixture-teams">${f.homeClub?.name||'Home'} <span style="color:var(--muted)">vs</span> ${f.awayClub?.name||'Away'}</div><div class="fixture-meta"><span>${f.venue||'Venue TBD'}</span><span class="badge ${f.status==='official'||r?.isOfficial?'official':''}">${f.status==='official'||r?.isOfficial?'OFFICIAL':'PENDING'}</span></div></button>`}).join('');el.querySelectorAll('.fixture').forEach(b=>b.onclick=()=>selectFixture(fixtures[Number(b.dataset.i)]))}
function renderHero(f,r){$('matchHero').innerHTML=`<div class="hero-top"><div><h2>${f.status==='official'||r?.isOfficial?'OFFICIAL RESULT':'RESULT PENDING RATIFICATION'}</h2><div class="hero-date">${date(f.matchDate)}</div></div><div class="hero-date">${f.venue||'Venue TBD'}</div></div><div class="scoreline"><div class="club"><div class="crest">${(f.homeClub?.name||'H').slice(0,1)}</div>${f.homeClub?.name||'Home'}</div><div class="score">${r?`${r.homeGoals??0} — ${r.awayGoals??0}`:'— — —'}</div><div class="club"><div class="crest">${(f.awayClub?.name||'A').slice(0,1)}</div>${f.awayClub?.name||'Away'}</div></div><div class="venue">Fixture ID: ${f.id}</div>`}
function renderForm(r={}){$('matchContent').innerHTML=`<div class="tabs"><button class="tab active">Ratify Result</button><button class="tab" type="button" onclick="showStats()">Match summary</button></div><form id="ratifyForm" class="form"><h3>Keputusan rasmi</h3><div class="score-grid">${fields.slice(0,2).map(([k,l,min,max])=>`<div class="field"><label for="${k}">${l} *</label><input required type="number" id="${k}" name="${k}" min="${min}" max="${max}" step="1" value="${val(r,k)}"></div>`).join('')}</div><div class="section-title">Statistik perlawanan</div><div class="stats">${fields.slice(2).map(([k,l,min,max])=>`<div class="field"><label for="${k}">${l}</label><input type="number" id="${k}" name="${k}" min="${min}" max="${max}" step="1" value="${val(r,k)}"></div>`).join('')}</div><div class="section-title">Tambahan</div><div class="score-grid"><div class="field"><label for="penalty_status">Keputusan penalti</label><select id="penalty_status"><option value="">Tiada</option><option value="home">Tuan rumah menang penalti</option><option value="away">Pelawat menang penalti</option></select></div><div class="field"><label for="extra_time_minutes">Masa tambahan (minit)</label><input type="number" id="extra_time_minutes" min="0" max="30" value="${val(r,'extraTimeMinutes')}" placeholder="0"></div></div><div class="actions"><button class="btn" type="button" onclick="loadResult()">Reset</button><button class="btn primary" type="submit">Ratify &amp; publish result</button></div></form>`;$('ratifyForm').onsubmit=submitResult}
function showStats(){const r=selected.result||{};$('matchContent').innerHTML=`<div class="summary"><div><strong>${r.homeGoals??'—'}</strong><span>${selected.homeClub?.name||'Home'} goals</span></div><div><strong>${r.awayGoals??'—'}</strong><span>${selected.awayClub?.name||'Away'} goals</span></div><div><strong>${r.isOfficial?'Official':'Pending'}</strong><span>Status keputusan</span></div></div><div class="empty">Gunakan tab Ratify Result untuk mengedit statistik.</div>`}
async function selectFixture(f){selected=f;renderFixtures();$('matchContent').innerHTML='<div class="loading">Memuatkan keputusan...</div>';const r=await FixtureRepo.result(f.id);selected.result=r;renderHero(f,r);renderForm(r||{})}
async function loadResult(){if(selected)selectFixture(selected)}
async function submitResult(e){e.preventDefault();if(!selected)return;const form=new FormData(e.target),payload={};fields.forEach(([k])=>{const x=form.get(k);if(x!=='')payload[k]=Number(x)});payload.extra_time_minutes=Number($('extra_time_minutes').value||0);if(payload.home_possession+payload.away_possession!==100) {notice('Jumlah possession mestilah tepat 100%.');return}if(payload.home_shots_on_target>payload.home_shots||payload.away_shots_on_target>payload.away_shots){notice('Shots on target tidak boleh melebihi jumlah shots.');return}if(!confirm('Ratify keputusan ini sebagai keputusan rasmi? Tindakan ini akan mengemas kini standings liga.'))return;const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Menyimpan...';const out=await FixtureRepo.ratifyResult(selected.id,payload,user.id);btn.disabled=false;btn.textContent='Ratify & publish result';if(out.error){notice('Keputusan gagal disimpan. Semak polisi RLS dan struktur match_results.');return}selected.status='official';selected.result=out.data;renderHero(selected,out.data);renderFixtures();notice('Keputusan berjaya diratifikasi dan diterbitkan.','success');}
async function init(){try{user=await Auth.user();if(!user){$('userLabel').textContent='Akses memerlukan log masuk';notice('Sila log masuk sebagai League Admin untuk mengakses Match Centre.');return}const profile=await Auth.profile();$('userLabel').textContent=profile?.fullName||user.email||'League Admin';leagues=await LeagueRepo.all();if(!leagues.length){$('leagueSelect').innerHTML='<option>Tiada liga</option>';notice('Tiada liga aktif ditemui.');return}$('leagueSelect').innerHTML=leagues.map(l=>`<option value="${l.id}">${l.name} — ${l.season||''}</option>`).join('');await loadLeague(leagues[0].id);$('leagueSelect').onchange=()=>loadLeague($('leagueSelect').value)}catch(err){console.error('[v0] Match Centre init error',err);notice('Match Centre gagal dimuatkan. Sila cuba lagi.')}}async function loadLeague(id){$('fixtureList').innerHTML='<div class="loading">Memuatkan perlawanan...</div>';fixtures=await FixtureRepo.byLeague(id,null,50);renderFixtures()}init();
</script></body></html>
