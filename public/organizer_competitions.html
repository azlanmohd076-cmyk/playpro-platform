<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Organiser Competition Console</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{margin:0;background:#eef2ef;font:14px Arial;color:#17211c}.wrap{max-width:1100px;margin:auto;padding:14px}.top,.bottom{display:flex;gap:18px;align-items:center;background:#07120d;color:#fff;padding:12px 15px}.top a,.bottom a{color:#fff;text-decoration:none;font-weight:900}.spacer{flex:1}.card{background:#fff;border:1px solid #d5ddd8;border-radius:8px;padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-weight:900;margin:7px 0}.field input,.field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5cf;border-radius:5px}.field textarea{min-height:80px}.btn{display:inline-block;padding:10px 13px;border:1px solid #bfcac3;border-radius:5px;background:#fff;font-weight:900;cursor:pointer}.primary{background:#00b894;border-color:#00b894}.row{padding:12px 0;border-bottom:1px solid #e7ece9}.row:last-child{border:0}.muted{color:#68756e;font-size:12px}.msg{font-weight:900;margin-top:9px}.empty{text-align:center;padding:28px;color:#68756e}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><nav class="top"><b style="color:#00b894;font-size:21px">PlayPro</b><a href="/">LIVE</a><a href="/">CARI</a><a href="/">ASSESSMENTS</a><a href="/">KEDAI</a><span class="spacer" id="who">—</span></nav><div class="card"><b>ORGANISER › COMPETITION CONSOLE</b><p class="muted">Competition ialah objek rasmi PlayPro yang mengawal peserta, eligibility, rules, fixtures, officials, results dan discipline.</p></div><div class="card"><h2>＋ Create Competition</h2><div class="grid"><div class="field"><label>Nama pertandingan</label><input id="name" placeholder="Contoh: U12 Bukit Kepayang League"></div><div class="field"><label>Season</label><input id="season" placeholder="2026"></div></div><div class="field"><label>Description</label><textarea id="desc"></textarea></div><div class="grid"><div class="field"><label>Yellow-card threshold</label><input id="yellow" type="number" min="1" value="5"></div><div class="field"><label>Red / second-yellow suspension (matches)</label><input id="ban" type="number" min="1" value="1"></div></div><button class="btn primary" onclick="createCompetition()">Create Draft Competition</button><div id="msg" class="msg"></div></div><div class="card"><h2>Competition sedia ada</h2><div id="list">Memuatkan…</div></div><nav class="bottom"><a href="/">CREATE</a><a href="/club">MYTEAM</a><a href="/">INBOX</a><a href="/">PASSPORT</a></nav></main><script>'use strict';const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ'),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const s=await SB.auth.getSession(),u=s.data.session?.user;if(!u){$('list').innerHTML='<div class="empty">Sila log masuk.</div>';return}$('who').textContent=u.email||'PlayPro User';const p=await SB.from('profiles').select('role,full_name').eq('id',u.id).single();if(p.error||!['organizer','developer'].includes(p.data?.role)){$('msg').textContent='Akses console ini memerlukan role Organizer/Developer.';$('list').innerHTML='<div class="empty">Role organizer belum aktif untuk akaun ini.</div>';return}load()}async function load(){const r=await SB.from('leagues').select('id,name,season,status,description,yellow_card_threshold,red_card_ban_matches,founder_id,created_at').order('created_at',{ascending:false});if(r.error){$('list').textContent='Gagal: '+r.error.message;return}const rows=r.data||[];$('list').innerHTML=rows.length?rows.map(x=>'<div class="row"><b>'+esc(x.name)+'</b> <span class="muted">'+esc(x.status)+'</span><div class="muted">Season: '+esc(x.season||'—')+' · Yellow threshold: '+x.yellow_card_threshold+' · Suspension: '+x.red_card_ban_matches+' match</div><div>'+esc(x.description||'')+'</div></div>').join(''):'<div class="empty">Belum ada competition.</div>'}async function createCompetition(){const r=await SB.rpc('create_playpro_competition',{p_name:$('name').value,p_season:$('season').value,p_description:$('desc').value,p_yellow_card_threshold:Number($('yellow').value||5),p_red_card_ban_matches:Number($('ban').value||1)});if(r.error){$('msg').textContent='❌ '+r.error.message;return}$('msg').textContent='✓ Draft competition + rule configuration dicipta';$('name').value='';$('desc').value='';load()}boot();</script></body></html>
