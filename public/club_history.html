<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Club History</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{margin:0;background:#eef2ef;font:14px Arial;color:#17211c}.wrap{max-width:1050px;margin:auto;padding:14px}.top,.bottom{display:flex;gap:18px;align-items:center;background:#07120d;color:#fff;padding:12px 15px}.top a,.bottom a{color:#fff;text-decoration:none;font-weight:900}.spacer{flex:1}.card{background:#fff;border:1px solid #d5ddd8;border-radius:8px;padding:14px;margin-top:12px}.row{padding:13px 0;border-bottom:1px solid #e7ece9}.row:last-child{border:0}.muted{color:#68756e;font-size:12px}.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#e7f2ff;color:#075ea8;font-size:10px;font-weight:900}.empty{padding:35px;text-align:center;color:#68756e}</style></head><body><main class="wrap"><nav class="top"><b style="color:#00b894;font-size:21px">PlayPro</b><a href="/">LIVE</a><a href="/">CARI</a><a href="/">ASSESSMENTS</a><a href="/">KEDAI</a><span class="spacer" id="who">—</span></nav><div class="card"><b>CLUB › HISTORY</b><p class="muted">Sejarah rasmi kelab datang daripada pencapaian/keputusan yang disahkan. TMR tidak menjadi sumber Club History.</p></div><div class="card"><div id="club">Memuatkan kelab…</div></div><div class="card"><h3>Rekod Sejarah</h3><div id="list">Memuatkan…</div></div><nav class="bottom"><a href="/">CREATE</a><a href="/club">MYTEAM</a><a href="/">INBOX</a><a href="/">PASSPORT</a></nav></main><script>'use strict';const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ');const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const s=await SB.auth.getSession(),u=s.data.session?.user;if(!u){$('list').innerHTML='<div class="empty">Sila log masuk dahulu.</div>';return}$('who').textContent=u.email||'PlayPro User';const c=await SB.rpc('get_my_club_dashboard');if(c.error||!c.data?.length){$('list').innerHTML='<div class="empty">Tiada kelab aktif untuk user ini.</div>';return}const club=c.data[0];$('club').innerHTML='<b>'+esc(club.club_name)+'</b><div class="muted">'+esc(club.club_code||'')+' · '+esc(club.verification_status||'pending')+'</div>';const r=await SB.from('club_history_records').select('record_type,title,competition_name,season,result_text,achievement,event_date,notes,source_fixture_id,created_at').eq('club_id',club.club_id).order('event_date',{ascending:false}).order('created_at',{ascending:false});if(r.error){$('list').innerHTML='<div class="empty">Gagal membaca history: '+esc(r.error.message)+'</div>';return}const rows=r.data||[];$('list').innerHTML=rows.length?rows.map(x=>'<div class="row"><span class="badge">'+esc(x.record_type)+'</span> <b>'+esc(x.title)+'</b><div class="muted">'+esc(x.competition_name||'')+(x.season?' · '+esc(x.season):'')+(x.event_date?' · '+esc(x.event_date):'')+'</div>'+(x.result_text?'<div>'+esc(x.result_text)+'</div>':'')+(x.achievement?'<div><b>Pencapaian:</b> '+esc(x.achievement)+'</div>':'')+(x.notes?'<div class="muted">'+esc(x.notes)+'</div>':'')+'</div>').join(''):'<div class="empty">Belum ada rekod rasmi. Rekod akan muncul apabila keputusan/achievement yang sah wujud.</div>'}boot();</script></body></html>
