<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Player KYC</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--g:#00d4aa;--gold:#f0c040;--bg:#07100c;--card:#101a15;--line:#26372f;--txt:#edf6f1;--muted:#8da197;--err:#ffb4b4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123022,#050a07 70%);min-height:100vh;color:var(--txt);font:15px system-ui,sans-serif;padding:20px}.box{width:min(620px,100%);margin:auto;background:rgba(16,26,21,.97);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 25px 70px #0008}.logo{font-size:28px;font-weight:950;color:var(--g)}.muted{color:var(--muted);line-height:1.5}label{display:block;font-size:12px;color:var(--g);font-weight:850;margin:14px 0 6px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#08110d;color:#fff}.notice{padding:13px;border:1px solid #8a6d18;background:#251f0b;border-radius:12px;margin:15px 0;line-height:1.5}.upload{border:1px dashed #3a5548;border-radius:12px;padding:14px;background:#ffffff04}.upload input{border:0;padding:8px 0;background:transparent}.btn{width:100%;padding:13px;margin-top:16px;border:0;border-radius:11px;font-weight:900;cursor:pointer}.primary{background:var(--g);color:#00110b}.secondary{background:#ffffff0a;color:#fff;border:1px solid var(--line)}.msg{min-height:22px;margin-top:12px;text-align:center}.ok{color:#9ff4df}.err{color:var(--err)}.passport{margin-top:18px;padding:15px;background:#ffffff06;border:1px solid var(--line);border-radius:12px}.passport strong{color:var(--gold);font-family:monospace}.status{margin:12px 0;padding:12px;border-radius:12px;background:#ffffff06;border:1px solid var(--line)}</style></head><body><main class="box"><div class="logo">PlayPro</div><h2>🔐 Pengesahan Identiti PlayPro</h2><p class="muted">Sahkan identiti sekali sahaja. Pengesahan ini dikongsi oleh semua peranan PlayPro dan sah selama lima tahun.</p><div class="notice">🪪 MyKad / MyKid / Pasport. Satu pengesahan untuk semua peranan. Dokumen disimpan secara private.</div><div id="state">Memuatkan status...</div><div id="form" style="display:none"><label>JENIS DOKUMEN</label><select id="type" onchange="syncUpload()"><option value="mykad">MyKad</option><option value="mykid">MyKid</option><option value="passport">Passport</option></select><label>NAMA SAH</label><input id="name" placeholder="Nama seperti dokumen rasmi"><label>KOD NEGERI KELAHIRAN</label><input id="statecode" inputmode="numeric" maxlength="2" placeholder="Contoh: 05"><label>DOKUMEN DEPAN / UTAMA</label><div class="upload"><input id="front" type="file" accept="image/jpeg,image/png,application/pdf"></div><div id="backWrap"><label>DOKUMEN BELAKANG</label><div class="upload"><input id="back" type="file" accept="image/jpeg,image/png"></div></div><button class="btn primary" id="submit" onclick="submitKyc()">Hantar & Semak KYC →</button><div id="msg" class="msg"></div></div><button class="btn secondary" onclick="location.href='/player.html'">← Kembali ke Player</button></main><script>
'use strict';
const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);
const destinations={player:'/player.html',coach:'/coach_profile_v2.html',club:'/club.html',organizer:'/organizer_profile.html',referee:'/referee_profile.html'};
const next=destinations[params.get('next')]||'/role_center.html';
let uid=null,kycId=null;
function syncUpload(){$('backWrap').style.display=$('type').value==='mykad'?'block':'none'}
function showVerified(d){
  $('state').innerHTML='<div class="passport">✓ IDENTITI DISAHKAN<br>KYC sah sehingga <strong>'+esc(d.expires_at?new Date(d.expires_at).toLocaleDateString('ms-MY'):'—')+'</strong><p class="muted">Pengesahan ini digunakan untuk semua peranan PlayPro. Anda tidak perlu menghantar dokumen semula apabila menambah peranan.</p></div><button class="btn primary" id="continue">Teruskan →</button>';
  $('form').style.display='none';
  $('continue').onclick=()=>location.href=next;
}
async function boot(){
  const s=await SB.auth.getSession();
  if(!s.data.session)return location.replace('/?login=1');
  uid=s.data.session.user.id;
  const r=await SB.rpc('get_my_identity_kyc_status');
  if(r.error||!r.data?.ok){$('state').innerHTML='<p class="err">Gagal membaca status KYC pusat.</p>';return;}
  const d=r.data;
  if(d.is_verified){showVerified(d);return;}
  kycId=d.kyc_id||null;
  $('state').innerHTML='<div class="status">Status identiti: <b>'+esc(String(d.status||'not_submitted').toUpperCase())+'</b>'+(d.expires_at?' · Tamat '+esc(new Date(d.expires_at).toLocaleDateString('ms-MY')):'')+'</div>';
  if(d.status==='processing'||(d.status==='pending'&&d.provider_status==='processed')){ $('form').style.display='none'; $('state').innerHTML+='<p class="muted">Dokumen telah diterima. Tiada tindakan atau muat naik semula diperlukan. PlayPro akan menyemak identiti ini untuk semua peranan.</p>'; return; }
  $('form').style.display='block';
  const profile=await SB.from('profiles').select('full_name').eq('id',uid).maybeSingle();
  $('name').value=profile.data?.full_name||'';
  syncUpload();
}
function makePath(file,label){
  if(!file)throw new Error('Fail '+label+' diperlukan');
  if(!['image/jpeg','image/png','application/pdf'].includes(file.type))throw new Error('Format dokumen mesti JPG, PNG atau PDF.');
  if(file.size>10*1024*1024)throw new Error('Fail melebihi 10MB.');
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  return uid+'/'+crypto.randomUUID()+'.'+ext;
}
async function submitKyc(){
  const btn=$('submit'),type=$('type').value,name=$('name').value.trim(),state=$('statecode').value.trim();
  if(!name)return $('msg').textContent='Isi nama sah seperti dokumen.';
  if(state&&!/^[0-9]{2}$/.test(state))return $('msg').textContent='Kod negeri kelahiran mesti 2 digit.';
  btn.disabled=true;btn.textContent='Menyimpan pengesahan...';$('msg').className='msg';$('msg').textContent='';
  try{
    const selectedFiles=type==='mykad'?[$('front').files[0],$('back').files[0]]:[$('front').files[0]];
    const req=await SB.rpc('request_identity_kyc',{p_id_type:type,p_legal_name:name,p_birth_state_code:state||null});
    if(req.error)throw req.error;
    if(req.data?.status==='verified'){showVerified(req.data);return;}
    kycId=req.data?.kyc_id;if(!kycId)throw new Error('ID pengesahan tidak dijana.');
    const paths=selectedFiles.map((f,i)=>makePath(f,i===0?'utama':'belakang'));
    for(let i=0;i<selectedFiles.length;i++){
      const up=await SB.storage.from('kyc-documents').upload(paths[i],selectedFiles[i],{contentType:selectedFiles[i].type,upsert:false});
      if(up.error)throw up.error;
    }
    const attached=await SB.rpc('attach_identity_kyc_documents',{p_kyc_id:kycId,p_document_paths:paths});
    if(attached.error)throw attached.error;
    const f=await SB.functions.invoke('kyc-verify-coach',{body:{kyc_id:kycId}});
    if(f.error)throw f.error;
    if(!f.data?.ok)throw new Error(f.data?.error||'Pemprosesan dokumen gagal.');
    $('msg').className='msg ok';
    $('msg').textContent='✓ Dokumen diterima. Semakan identiti sedang menunggu pengesahan PlayPro. KYC ini akan digunakan untuk semua peranan.';
    $('form').style.display='none';$('state').innerHTML='<div class="status">Status identiti: <b>PENDING</b>. Dokumen telah diterima dan OCR tidak akan dijalankan semula tanpa set dokumen baharu. Anda tidak perlu menghantar dokumen untuk peranan lain.</div>';
  }catch(e){
    $('msg').className='msg err';$('msg').textContent='❌ '+(e.message||e);
    btn.disabled=false;btn.textContent='Hantar & Semak KYC →';
  }
}
$('type').addEventListener('change',syncUpload);
$('submit').addEventListener('click',submitKyc);
boot().catch(e=>{$('state').innerHTML='<p class="err">KYC gagal dimuatkan: '+esc(e.message||e)+'</p>';});
</script></body></html>
