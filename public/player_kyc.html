<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Player KYC</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--g:#00d4aa;--gold:#f0c040;--bg:#07100c;--card:#101a15;--line:#26372f;--txt:#edf6f1;--muted:#8da197;--err:#ffb4b4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123022,#050a07 70%);min-height:100vh;color:var(--txt);font:15px system-ui,sans-serif;padding:20px}.box{width:min(620px,100%);margin:auto;background:rgba(16,26,21,.97);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 25px 70px #0008}.logo{font-size:28px;font-weight:950;color:var(--g)}.muted{color:var(--muted);line-height:1.5}label{display:block;font-size:12px;color:var(--g);font-weight:850;margin:14px 0 6px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#08110d;color:#fff}.notice{padding:13px;border:1px solid #8a6d18;background:#251f0b;border-radius:12px;margin:15px 0;line-height:1.5}.upload{border:1px dashed #3a5548;border-radius:12px;padding:14px;background:#ffffff04}.upload input{border:0;padding:8px 0;background:transparent}.btn{width:100%;padding:13px;margin-top:16px;border:0;border-radius:11px;font-weight:900;cursor:pointer}.primary{background:var(--g);color:#00110b}.secondary{background:#ffffff0a;color:#fff;border:1px solid var(--line)}.msg{min-height:22px;margin-top:12px;text-align:center}.ok{color:#9ff4df}.err{color:var(--err)}.passport{margin-top:18px;padding:15px;background:#ffffff06;border:1px solid var(--line);border-radius:12px}.passport strong{color:var(--gold);font-family:monospace}.status{margin:12px 0;padding:12px;border-radius:12px;background:#ffffff06;border:1px solid var(--line)}</style></head><body><main class="box"><div class="logo">PlayPro</div><h2>🔐 Player KYC</h2><p class="muted">KYC diperlukan apabila profile pemain hendak digunakan untuk kemasukan kelab atau pertandingan. Pengguna biasa tidak perlu KYC.</p><div class="notice">🪪 <b>Dokumen:</b> MyKad / MyKid / Passport.<br>Dokumen disimpan dalam stor <b>private</b>. Ia tidak menjadi sebahagian daripada profile awam.</div><div id="state">Memuatkan status...</div><div id="form" style="display:none"><label>JENIS DOKUMEN</label><select id="type" onchange="syncUpload()"><option value="mykad">MyKad</option><option value="mykid">MyKid</option><option value="passport">Passport</option></select><label>NAMA SAH</label><input id="name" placeholder="Nama seperti dokumen rasmi"><label>KOD NEGERI KELAHIRAN</label><input id="statecode" inputmode="numeric" maxlength="2" placeholder="Contoh: 05"><label>DOKUMEN DEPAN / UTAMA</label><div class="upload"><input id="front" type="file" accept="image/jpeg,image/png,application/pdf"></div><div id="backWrap"><label>DOKUMEN BELAKANG</label><div class="upload"><input id="back" type="file" accept="image/jpeg,image/png"></div></div><button class="btn primary" id="submit" onclick="submitKyc()">Hantar & Semak KYC →</button><div id="msg" class="msg"></div></div><button class="btn secondary" onclick="location.href='player.html'">← Kembali ke Player</button></main><script>'use strict';const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtdWlyaGVudmpydXZmeW5vYXhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NjM0OTQsImV4cCI6MjA5MzEzOTQ5NH0.ZNphviTQfnMjkGIdZtevwC8jmJjTCaXHhojcv4g5R20');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));let uid=null,profile=null;function syncUpload(){$('backWrap').style.display=$('type').value==='mykad'?'block':'none'}async function boot(){const s=await SB.auth.getSession();if(!s.data.session)return location.replace('player_signup.html');uid=s.data.session.user.id;const p=await SB.from('players').select('id,full_name,verification_status,football_passport_no').eq('profile_id',uid).maybeSingle();profile=p.data;if(p.error||!profile)return $('state').innerHTML='<p class="err">Profile pemain tidak ditemui.</p>';const r=await SB.rpc('get_my_player_kyc_status');const d=r.data;if(r.error||!d?.ok)return $('state').innerHTML='<p class="err">Gagal membaca status KYC.</p>';if(d.verification_status==='verified'){$('state').innerHTML='<div class="passport">✓ VERIFIED<br>Football Passport: <strong>'+esc(d.football_passport_no)+'</strong></div>';return} $('state').innerHTML='<div class="status">Status: <b>'+esc(d.kyc_status||'not_submitted')+'</b>'+ (d.provider_status?' · Google: <b>'+esc(d.provider_status)+'</b>':'')+(d.match_status&&d.match_status!=='not_processed'?' · Padanan: <b>'+esc(d.match_status)+'</b>':'')+'</div>';$('name').value=profile.full_name||'';$('form').style.display='block';syncUpload()}async function upload(file,label){if(!file)throw new Error('Fail '+label+' diperlukan');if(file.size>10*1024*1024)throw new Error('Fail '+label+' melebihi 10MB');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=uid+'/'+crypto.randomUUID()+'.'+ext;const r=await SB.storage.from('kyc-documents').upload(path,file,{contentType:file.type,upsert:false});if(r.error)throw r.error;return path}async function submitKyc(){const btn=$('submit');const type=$('type').value,name=$('name').value.trim(),state=$('statecode').value.trim();if(!name)return $('msg').textContent='Isi nama sah seperti dokumen.';if(!/^[0-9]{2}$/.test(state))return $('msg').textContent='Kod negeri kelahiran mesti 2 digit.';btn.disabled=true;btn.textContent='Memuat naik & memproses...';$('msg').className='msg';$('msg').textContent='';try{const paths=[await upload($('front').files[0],'utama')];if(type==='mykad')paths.push(await upload($('back').files[0],'belakang'));const r=await SB.rpc('request_player_kyc_document',{p_id_type:type,p_legal_name:name,p_birth_state_code:state,p_document_storage_paths:paths});if(r.error)throw r.error;const k=r.data;if(!k?.kyc_id)throw new Error('KYC ID tidak dijana');const f=await SB.functions.invoke('kyc-verify-player',{body:{kyc_id:k.kyc_id}});if(f.error)throw f.error;const d=f.data;if(!d?.ok)throw new Error(d?.error||'Google Document AI gagal memproses dokumen');$('msg').className='msg ok';$('msg').textContent='✓ Dokumen diterima. Semakan Google selesai; status kekal PENDING sehingga keputusan KYC rasmi dibuat.';setTimeout(boot,900)}catch(e){$('msg').className='msg err';$('msg').textContent='❌ '+(e.message||e);btn.disabled=false;btn.textContent='Hantar & Semak KYC →'}}boot();</script></body></html>
