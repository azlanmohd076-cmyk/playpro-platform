<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Developer Panel</title><style>body{font-family:system-ui,sans-serif;background:#07110d;color:#eaf5ef;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#101b16;border:1px solid #ffffff18;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.num{font-size:30px;font-weight:900;color:#39df93}.muted{opacity:.65;font-size:13px}input,button,select{font:inherit;border-radius:9px;padding:10px;border:1px solid #ffffff22;background:#16231d;color:#fff}button{cursor:pointer;background:#087f51}button.danger{background:#8d3030}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ffffff12;text-align:left;font-size:13px}.ok{color:#39df93}.bad{color:#ff8c8c}</style></head><body><main class="wrap"><section id="login" class="card"><h2>🔐 PlayPro Developer Panel</h2><p class="muted">Akses developer sahaja. Supabase menentukan role sebenar; tiada role hardcode dalam UI.</p><div class="row"><input id="email" type="email" placeholder="Email developer"><input id="pw" type="password" placeholder="Password"><button onclick="login()">Log Masuk</button></div><p id="err" class="bad"></p></section><section id="panel" class="hidden"><div class="row" style="justify-content:space-between"><h1>PlayPro Master Control</h1><button onclick="logout()">Log Keluar</button></div><section class="grid"><div class="card"><div id="players" class="num">—</div><div class="muted">Pemain</div></div><div class="card"><div id="coaches" class="num">—</div><div class="muted">Coach</div></div><div class="card"><div id="clubs" class="num">—</div><div class="muted">Kelab</div></div><div class="card"><div id="leagues" class="num">—</div><div class="muted">Pertandingan/Liga</div></div><div class="card"><div id="kyc" class="num">—</div><div class="muted">KYC Player Pending</div></div></section><section class="card"><h2>🪪 Player KYC Pending</h2><div id="kycList" class="muted">Memuatkan…</div></section><section class="card"><h2>⚽ Pemain terkini</h2><div id="playerList" class="muted">Memuatkan…</div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtdWlyaGVudmpydXZmeGVub2F4bSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzc3NTYzNDk0LCJleHAiOjIwOTMxMzk0OTR9.ZNphviTQfnMjkGIdZtevwC8jmJjTCaXHhojcv4g5R20');const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function login(){ $('err').textContent='';const{data,error}=await SB.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});if(error){$('err').textContent=error.message;return}const{data:p,error:e}=await SB.from('profiles').select('id,full_name,email,role').eq('id',data.user.id).single();if(e||p?.role!=='developer'){await SB.auth.signOut();$('err').textContent='Akses ditolak: akaun bukan developer.';return}$('login').classList.add('hidden');$('panel').classList.remove('hidden');load()}async function logout(){await SB.auth.signOut();location.reload()}async function count(table,id){const{count,error}=await SB.from(table).select(id||'id',{count:'exact',head:true});if(error)throw error;return count??0}async function load(){try{const[c1,c2,c3,c4,k]=await Promise.all([count('players'),count('coaches'),count('clubs'),count('leagues'),count('identity_verifications')]);$('players').textContent=c1;$('coaches').textContent=c2;$('clubs').textContent=c3;$('leagues').textContent=c4;const{count:kc,error:ke}=await SB.from('identity_verifications').select('id',{count:'exact',head:true}).eq('subject_type','player').eq('status','pending');if(ke)throw ke;$('kyc').textContent=kc??0;await loadKyc();await loadPlayers()}catch(e){$('err').textContent=e.message}}async function loadKyc(){const{data,error}=await SB.from('identity_verifications').select('id,profile_id,id_type,legal_name_claimed,birth_state_code,status,extracted_legal_name,extracted_birth_date,extracted_identifier_masked,submitted_at').eq('subject_type','player').eq('status','pending').order('submitted_at',{ascending:true}).limit(50);if(error){$('kycList').innerHTML='<span class="bad">'+esc(error.message)+'</span>';return}if(!data?.length){$('kycList').textContent='Tiada KYC pending.';return}$('kycList').innerHTML='<table><tr><th>ID</th><th>Nama dokumen</th><th>Jenis</th><th>Kod negeri</th><th>Tindakan</th></tr>'+data.map(x=>`<tr><td><code>${esc(x.id)}</code></td><td>${esc(x.extracted_legal_name||x.legal_name_claimed||'—')}</td><td>${esc(x.id_type)}</td><td>${esc(x.birth_state_code||'—')}</td><td><button onclick="approve('${x.id}','${esc(x.extracted_legal_name||x.legal_name_claimed||'').replace(/'/g,"\\'")}','${esc(x.birth_state_code||'').replace(/'/g,"\\'")}')">✓ Lulus</button> <button class="danger" onclick="reject('${x.id}')">✕ Tolak</button></td></tr>`).join('')+'</table>'}async function approve(id,name,state){const note=prompt('Nota approval (optional):','KYC disahkan oleh PlayPro');const{data,error}=await SB.rpc('approve_player_kyc',{p_kyc_id:id,p_reviewer_note:note,p_verified_legal_name:name||null,p_verified_birth_date:null,p_verified_birth_state_code:state||null});if(error){alert('Approval gagal: '+error.message);return}alert('KYC diluluskan. Passport: '+(data?.football_passport_no||'—'));load()}async function reject(id){const reason=prompt('Sebab penolakan KYC:','Dokumen tidak sah / maklumat tidak sepadan');if(!reason)return;const{error}=await SB.rpc('reject_player_kyc',{p_kyc_id:id,p_reviewer_note:reason});if(error){alert('Rejection gagal: '+error.message);return}load()}async function loadPlayers(){const{data,error}=await SB.from('players').select('id,full_name,preferred_name,football_passport_no,verification_status,dna_overall,created_at').order('created_at',{ascending:false}).limit(30);if(error){$('playerList').innerHTML='<span class="bad">'+esc(error.message)+'</span>';return}$('playerList').innerHTML='<table><tr><th>Nama</th><th>Passport</th><th>Verify</th><th>DNA OVR</th></tr>'+(data||[]).map(p=>`<tr><td>${esc(p.preferred_name||p.full_name)}</td><td>${esc(p.football_passport_no||'—')}</td><td>${p.verification_status==='verified'?'<span class="ok">VERIFIED</span>':esc(p.verification_status)}</td><td>${esc(p.dna_overall??'—')}</td></tr>`).join('')+'</table>'}</script></body></html>
