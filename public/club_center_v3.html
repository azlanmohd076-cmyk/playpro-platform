eat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top a{display:none}.title{font-size:22px}}</style></head><body><main class="wrap"><nav class="top"><b style="color:#00b894;font-size:21px">PlayPro</b><a href="/">LIVE</a><a href="/">CARI</a><a href="/">ASSESSMENTS</a><a href="/">KEDAI</a><span class="spacer" id="who">—</span></nav><div class="crumb">🏠 Hub › Club › Club Center</div><div id="app">Memuatkan…</div><nav class="bottom"><a href="/">CREATE</a><a href="/club">MYTEAM</a><a href="/">INBOX</a><a href="/">PASSPORT</a></nav></main><script>'use strict';const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ'),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let club=null,teams=[];async function boot(){const s=await SB.auth.getSession(),u=s.data.session?.user;if(!u){$('app').innerHTML='<div class="card"><div class="empty">🔐 Sila log masuk ke PlayPro.</div></div>';return}$('who').textContent=u.email||'PlayPro User';const c=await SB.rpc('get_my_club_dashboard');if(c.error||!c.data?.length){$('app').innerHTML='<div class="card"><div class="empty">Tiada kelab aktif. Gunakan Create untuk bina kelab.</div></div>';return}club=c.data[0];const t=await SB.from('club_teams').select('id,display_name,age_category,squad_label,formation,status').eq('club_id',club.club_id).order('age_category');teams=t.data||[];render()}function render(){$('app').innerHTML='<div class="hero"><div class="title">'+esc(club.club_name)+'</div><div class="sub">'+esc(club.club_type||'Kelab')+' · '+esc(club.club_code||'')+' · '+(club.verification_status==='verified'?'✓ VERIFIED CLUB':'UNDER REVIEW')+'</div></div><div class="grid"><div class="stat"><b>'+club.team_count+'</b>Team / Squad</div><div class="stat"><b>'+club.member_count+'</b>Club Members</div><div class="stat"><b>U6–U23</b>Age Pathway</div><div class="stat"><b>35+</b>Veteran</div></div><div class="tabs"><a class="tab" href="/club">🏢 Profile</a><a class="tab" href="#teams">👥 Team / Squad</a><a class="tab" href="/club/training">📅 Training</a><a class="tab" href="/club/history">🏆 History</a><a class="tab" href="/club/membership">💳 Membership</a></div><section class="card section"><h3>Club Identity</h3><div class="listrow"><b>Owner</b><div class="sub" style="color:var(--muted)">Pemilik ialah PlayPro user sebenar</div></div><div class="listrow"><b>Location</b><div style="color:var(--muted)">'+esc([club.city,club.state,club.country].filter(Boolean).join(', ')||'Belum ditetapkan')+'</div></div><div class="listrow"><b>Verification</b><div style="color:var(--muted)">'+esc(club.verification_status||'pending')+'</div></div></section><section class="card section" id="teams"><h3>Team / Squad</h3>'+(teams.length?teams.map(t=>'<div class="listrow"><b>'+esc(t.display_name)+'</b><div style="color:var(--muted)">'+esc(t.age_category.toUpperCase())+' · Squad '+esc(t.squad_label)+' · '+esc(t.formation||'4-3-3')+'</div><div class="actions" style="margin-top:7px"><a class="btn primary" href="/club/team?team='+encodeURIComponent(t.id)+'">Open Team</a><a class="btn" href="/club_team.html?team='+encodeURIComponent(t.id)+'">TMR / Squad</a></div></div>').join(''):'<div class="empty">Squad belum dicipta.</div>')+'<div class="actions" style="margin-top:10px"><a class="btn" href="/club_team.html">＋ Create / Manage Squad</a></div></section><section class="card section"><h3>Operations</h3><div class="actions"><a class="btn" href="/club/training">📅 Training Scheduler</a><a class="btn" href="/club/history">🏆 Club History</a><a class="btn" href="/club/membership">👥 Membership & Fees</a><a class="btn" href="/club/operations">⚙ Club Operations</a></div></section>'}boot();</script></body></html>
