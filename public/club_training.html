<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Club Training</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{margin:0;background:#eef2ef;font:14px Arial;color:#17211c}.wrap{max-width:1000px;margin:auto;padding:14px}.top,.bottom{display:flex;gap:18px;align-items:center;background:#07120d;color:#fff;padding:12px 15px}.top a,.bottom a{color:#fff;text-decoration:none;font-weight:900}.spacer{flex:1}.card{background:#fff;border:1px solid #d5ddd8;border-radius:8px;padding:14px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-weight:900;margin:6px 0}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5cf;border-radius:5px}.field textarea{min-height:70px}.btn{padding:9px 12px;border:1px solid #bfcac3;border-radius:5px;background:#fff;font-weight:900;cursor:pointer}.primary{background:#00b894;border-color:#00b894}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #e7ece9}.muted{color:#68756e;font-size:12px}.msg{font-weight:900;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><nav class="top"><b style="color:#00b894;font-size:21px">PlayPro</b><a href="/">LIVE</a><a href="/">CARI</a><a href="/">ASSESSMENTS</a><a href="/">KEDAI</a><span class="spacer"></span><span id="who">—</span></nav><div class="card"><b>CLUB › TRAINING</b><p class="muted">Sesi latihan disimpan melalui RPC backend; bukan direct table write.</p><div class="field"><label>Team / Squad</label><select id="team"></select></div></div><div class="card"><h3>＋ Jadual Latihan</h3><div class="grid"><div class="field"><label>Tajuk</label><input id="title" placeholder="Contoh: Technical & Finishing"></div><div class="field"><label>Jenis sesi</label><input id="type" value="training"></div><div class="field"><label>Mula</label><input id="start" type="datetime-local"></div><div class="field"><label>Tamat</label><input id="end" type="datetime-local"></div></div><div class="field"><label>Nota</label><textarea id="notes"></textarea></div><button class="btn primary" onclick="createSession()">Simpan Sesi</button><div id="msg" class="msg"></div></div><div class="card"><h3>Jadual Team</h3><div id="list">Memuatkan…</div></div><nav class="bottom"><a href="/">CREATE</a><a href="/club.html">MYTEAM</a><a href="/">INBOX</a><a href="/">PASSPORT</a></nav></main><script>'use strict';const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ');let teams=[];const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const s=await SB.auth.getSession();const me=s.data.session?.user;if(!me){$('list').textContent='Sila log masuk dahulu.';return}$('who').textContent=me.email||'PlayPro User';const r=await SB.rpc('get_my_club_dashboard');if(r.error||!r.data?.length){$('list').textContent='Tiada Club Owner/Admin aktif.';return}const club=r.data[0];const t=await SB.from('club_teams').select('id,display_name,age_category,squad_label').eq('club_id',club.club_id).order('age_category');teams=t.data||[];$('team').innerHTML=teams.map(x=>`<option value="${esc(x.id)}">${esc(x.display_name)} · ${esc(x.age_category)}</option>`).join('');$('team').onchange=loadSessions;if(teams.length)loadSessions();else $('list').textContent='Belum ada squad.'}async function loadSessions(){const id=$('team').value;if(!id)return;const r=await SB.rpc('playpro_list_team_training_sessions',{p_team_id:id,p_limit:100});if(r.error){$('list').textContent='Gagal: '+r.error.message;return}const rows=r.data||[];$('list').innerHTML=rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.session_type)} · ${new Date(x.starts_at).toLocaleString('ms-MY')} ${x.ends_at?'→ '+new Date(x.ends_at).toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'}):''}</div><div>${esc(x.notes||'')}</div></div><span>${esc(x.status)}</span></div>`).join(''):'Belum ada sesi latihan.'}async function createSession(){const team=$('team').value;if(!team){$('msg').textContent='Pilih team dahulu.';return}const start=$('start').value,end=$('end').value;const r=await SB.rpc('playpro_create_training_session',{p_team_id:team,p_title:$('title').value,p_session_type:$('type').value,p_starts_at:start?new Date(start).toISOString():null,p_ends_at:end?new Date(end).toISOString():null,p_venue_id:null,p_coach_profile_id:null,p_notes:$('notes').value});$('msg').textContent=r.error?'❌ '+r.error.message:'✓ Sesi latihan disimpan';if(!r.error){$('title').value='';$('notes').value='';loadSessions()}}boot();</script></body></html>
