<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayPro — Club Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#17211c;--muted:#68756e;--line:#d8dfdb;--panel:#fff;--bg:#e9eeeb;--nav:#07120d;--green:#00b894;--blue:#1261b8;--gold:#e8b52f;--red:#d64545}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#dce4df,#f0f3f1);font:13px Arial,system-ui,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,100%);margin:auto;padding:12px}.top{display:flex;align-items:center;gap:14px;background:var(--nav);color:#fff;padding:11px 14px;border-radius:8px 8px 0 0}.logo{font-size:22px;font-weight:950;color:var(--green)}.top a{font-weight:900;color:#d9e7e0}.spacer{flex:1}.crumb{background:#f7f9f8;border:1px solid var(--line);padding:8px 12px;color:var(--muted)}.layout{display:grid;grid-template-columns:230px 1fr;gap:10px;margin-top:10px}.panel{background:var(--panel);border:1px solid #c5cec8;box-shadow:0 2px 5px #0000000b;border-radius:5px}.panel h3{margin:0;padding:9px 11px;background:linear-gradient(#fafbfa,#e8ecea);border-bottom:1px solid var(--line);font-size:12px}.pad{padding:12px}.club-item{padding:10px;border-bottom:1px solid #edf0ee;cursor:pointer}.club-item.on{background:#eaf7f3;border-left:4px solid var(--green);padding-left:6px}.club-item b{display:block}.badge{display:inline-block;border-radius:99px;padding:3px 7px;font-size:10px;font-weight:900;background:#eef2ef;color:var(--muted)}.verified{background:#e7f2ff;color:#075ea8}.pending{background:#fff6d8;color:#8a6200}.btn{border:1px solid #c0cbc5;background:#fff;border-radius:5px;padding:8px 10px;font-weight:900;cursor:pointer}.primary{background:var(--nav);color:#fff;border-color:var(--nav)}.green{background:var(--green);color:#00130e;border-color:var(--green)}.danger{color:#9c2525}.actions{display:flex;gap:7px;flex-wrap:wrap}.hero{background:linear-gradient(120deg,#07382b,#1261b8);color:#fff;padding:18px;border-radius:6px}.hero .title{font-size:28px;font-weight:950}.hero .sub{margin-top:5px;color:#dcebf5}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.stat{background:#fff;border:1px solid var(--line);padding:11px;border-radius:5px}.stat b{display:block;font-size:22px}.section-title{font-weight:950;margin:14px 0 7px;font-size:15px}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf0ee}.label{color:var(--muted)}.value{font-weight:800;text-align:right}.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.team{padding:12px;border:1px solid var(--line);border-radius:6px;background:#fff}.team-top{display:flex;justify-content:space-between;gap:8px}.team-name{font-size:18px;font-weight:950}.team-meta{color:var(--muted);margin:4px 0 10px}.modalwrap{display:none;position:fixed;inset:0;background:#0009;z-index:30;place-items:center;padding:15px}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:8px;padding:18px}.modal label{display:block;font-weight:900;margin:9px 0 4px;color:#075d4d}.modal input,.modal select,.modal textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:5px}.modal textarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.msg{min-height:20px;margin-top:8px;font-weight:800}.venue{padding:10px 0;border-bottom:1px solid var(--line)}.venue:last-child{border:0}.venue b{display:block}.empty{padding:28px;text-align:center;color:var(--muted)}.small{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:2px;background:#d5dcd8;border:1px solid #c2cbc6;margin-top:10px;overflow:auto}.tab{padding:10px 14px;font-weight:950;white-space:nowrap;cursor:pointer}.tab.on{background:#fff;color:#075d4d}.page{display:none}.page.on{display:block}.notice{padding:10px;background:#fff6d8;border:1px solid #e2ca72;border-radius:5px;margin-top:10px}.ok{padding:10px;background:#e9f8f2;border:1px solid #9bdac9;border-radius:5px;margin-top:10px}@media(max-width:820px){.layout{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}.team-grid{grid-template-columns:1fr}}@media(max-width:520px){.two,.info-grid{grid-template-columns:1fr}.top{gap:8px;overflow:auto}.top a{display:none}.hero .title{font-size:22px}}
</style>
</head>
<body><main class="wrap">
<nav class="top"><div class="logo">PlayPro</div><a href="/">HOME</a><a href="player_profile_cm.html">PLAYER</a><a href="coach_profile_v2.html">COACH</a><span class="spacer"></span><span id="who">—</span></nav>
<div class="crumb">🏠 Hub › Club › Club Center</div>
<div id="app">Memuatkan Club Center…</div>
</main>
<div class="modalwrap" id="modal"><div class="modal"><button class="btn" style="float:right" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<script>
'use strict';
window.PLAYPRO_SUPABASE_URL='https://muirhenvjruvfxenoaxm.supabase.co';
window.PLAYPRO_SUPABASE_ANON_KEY='sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ';
const SB=supabase.createClient(window.PLAYPRO_SUPABASE_URL,window.PLAYPRO_SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
let me=null,clubs=[],club=null,types=[],teams=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeName={professional:'Kelab Profesional',semi_professional:'Kelab Separuh Profesional',amateur:'Kelab Amatur',grassroots_academy:'Akademi Bola Sepak / Akar Umbi',educational_institution:'Institusi Pendidikan',government_agency:'Jabatan / Agensi Kerajaan',corporate:'Kelab Korporat',community:'Kelab Komuniti',womens_club:'Kelab Bola Sepak Wanita',futsal:'Kelab Futsal',development:'Kelab Pembangunan',other:'Lain-lain'};
function openModal(html){$('modalBody').innerHTML=html;$('modal').style.display='grid'}function closeModal(){$('modal').style.display='none'}
async function boot(){
  $('app').innerHTML='<div class="panel"><div class="empty">⏳ Memuatkan Club Center…</div></div>';
  try{
    const s=await SB.auth.getSession();
    if(s.error) throw s.error;
    me=s.data.session?.user||null;
    if(!me){$('app').innerHTML='<div class="panel"><div class="empty">🔐 Sila log masuk ke PlayPro dahulu untuk mengurus kelab.</div><div class="pad"><a class="btn primary" href="/player_signup.html?next=/club.html">Log Masuk / Daftar</a></div></div>';return}
    $('who').textContent=me.email||'PlayPro User';
    await loadTypes();
    await loadClubs();
  }catch(error){
    console.error('[Club Center boot]',error);
    $('app').innerHTML='<div class="panel"><div class="empty">⚠️ Club Center gagal dimuatkan.</div><div class="pad"><div class="small">Club Center menerima ralat semasa bootstrap.</div><div class="notice">'+esc(error?.message||String(error))+'</div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="boot()">↻ Cuba Lagi</button><a class="btn" href="/">← PlayPro</a></div></div></div>';
  }
}
async function loadTypes(){
  const r=await SB.from('club_type_catalog').select('code,label,description').eq('active',true).order('sort_order');
  if(!r.error && r.data?.length) types=r.data;
  else if(r.error) console.warn('[Club Center types]',r.error.message);
  if(!types.length) types=Object.entries(typeName).map(([code,label])=>({code,label,description:''}));
}
async function loadClubs(){
  const r=await SB.rpc('get_my_club_dashboard');
  if(r.error){
    $('app').innerHTML='<div class="panel"><div class="empty">Gagal membaca Club Center.</div><div class="pad"><div class="notice">Backend: '+esc(r.error.message)+'</div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="loadClubs()">↻ Cuba Lagi</button></div></div></div>';
    return;
  }
  clubs=r.data||[];
  if(!clubs.length){renderNoClub();return}
  club=clubs[0];
  await loadClubData();
  render();
}
async function loadClubData(){const [tr,vr]=await Promise.all([SB.from('club_teams').select('id,name,age_category,squad_label,display_name,season,status,formation,primary_coach_profile_id,assistant_coach_profile_id').eq('club_id',club.club_id).order('age_category'),SB.from('club_training_venues').select('*').eq('club_id',club.club_id).order('is_primary',{ascending:false}).order('name')]);teams=tr.data||[];club.venues=vr.data||[]}
function renderNoClub(){$('app').innerHTML='<div class="hero"><div class="title">Bina Kelab PlayPro</div><div class="sub">Kelab hanya boleh dicipta oleh user sebenar yang telah melalui KYC. Satu akaun boleh mempunyai Player + Coach + Club Owner + Organiser + Referee.</div></div><div class="panel" style="margin-top:10px"><div class="pad"><div class="notice">🔒 KYC owner adalah pintu masuk rasmi Club. Jika KYC belum verified, butang Create Club akan ditolak oleh database.</div><div class="actions" style="margin-top:12px"><button class="btn green" onclick="showCreateClub()">＋ Create Club</button><button class="btn" onclick="location.href=&quot;player_kyc.html&quot;">KYC</button></div></div></div>'}
function render(){const verified=club.verification_status==='verified';$('app').innerHTML='<div class="hero"><div class="title">'+esc(club.club_name)+'</div><div class="sub">'+esc(typeName[club.club_type]||club.club_type||'Kelab')+' · '+esc(club.club_code||'')+' · '+(verified?'<span class="badge verified">✓ VERIFIED CLUB</span>':'<span class="badge pending">UNDER REVIEW</span>')+'</div></div><div class="grid4"><div class="stat"><b>'+club.team_count+'</b><span>Team / Squad</span></div><div class="stat"><b>'+club.member_count+'</b><span>Club Members</span></div><div class="stat"><b>'+club.venues.length+'</b><span>Training Venue</span></div><div class="stat"><b>U6–V</b><span>Age Pathway</span></div></div><div class="tabs"><div class="tab on" onclick="tab(&quot;profile&quot;,this)">🏢 Club Profile</div><div class="tab" onclick="tab(&quot;teams&quot;,this)">👥 Team / Squad</div><div class="tab" onclick="tab(&quot;training&quot;,this)">📅 Training</div><div class="tab" onclick="tab(&quot;history&quot;,this)">🏆 History</div></div><section class="page on" id="profile"><div class="section-title">Club Identity</div><div class="panel"><div class="pad"><div class="info-grid"><div class="row"><span class="label">Club ID</span><span class="value">'+esc(club.club_code)+'</span></div><div class="row"><span class="label">Owner</span><span class="value">KYC verified user</span></div><div class="row"><span class="label">Type</span><span class="value">'+esc(typeName[club.club_type]||club.club_type)+'</span></div><div class="row"><span class="label">Location</span><span class="value">'+esc([club.city,club.state].filter(Boolean).join(', ')||'—')+'</span></div><div class="row"><span class="label">Verification</span><span class="value">'+(verified?'✓ PlayPro Verified':'Pending PlayPro review')+'</span></div><div class="row"><span class="label">Squad policy</span><span class="value">U6–U23 / Open / Veteran 35+</span></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="editClub()">⚙ Edit Club</button><button class="btn green" onclick="showVenue()">📍 Add Training Ground</button></div></div></div><div class="section-title">Training Grounds</div><div class="panel"><div class="pad">'+(club.venues.length?club.venues.map(v=>'<div class="venue"><b>📍 '+esc(v.name)+(v.is_primary?' · PRIMARY':'')+'</b><div class="small">'+esc(v.address||[v.city,v.state].filter(Boolean).join(', ')||'Location pin saved')+'</div>'+(v.latitude&&v.longitude?'<div class="actions" style="margin-top:7px"><a class="btn" target="_blank" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v.latitude+','+v.longitude)+'">↗ Google Maps</a></div>':'')+'</div>').join(''):'<div class="empty">Belum ada padang latihan.</div>')+'</div></div></section><section class="page" id="teams"><div class="section-title">Team / Squad <button class="btn green" style="float:right" onclick="showTeam()">＋ Create Squad</button></div><div class="team-grid">'+(teams.length?teams.map(t=>'<a class="team" href="club_team.html?team='+encodeURIComponent(t.id)+'"><div class="team-top"><div class="team-name">'+esc(t.display_name)+'</div><span class="badge">'+esc(t.age_category.toUpperCase())+'</span></div><div class="team-meta">Squad '+esc(t.squad_label)+' · '+esc(t.formation||'4-3-3')+'</div><div class="actions"><span class="btn">Open Team →</span><span class="btn">TMR</span></div></a>').join(''):'<div class="panel"><div class="empty">Squad belum dicipta. Kelab bermula kosong.</div></div>')+'</div></section><section class="page" id="training"><div class="section-title">Training Schedule</div><div class="panel"><div class="empty">Training scheduler sudah disediakan di database. Jadual sesi akan dipaparkan di sini apabila sesi pertama dicipta.</div></div></section><section class="page" id="history"><div class="section-title">Club History</div><div class="panel"><div class="empty">Rekod pencapaian dan sejarah kelab akan masuk di sini. TMR tidak dicampur dengan Club History.</div></div></section>'}
function tab(id,el){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
function showCreateClub(){openModal('<h2>Create Club</h2><p class="small">Owner/KYC telah diwajibkan oleh backend. Selepas create, kelab masuk status PlayPro verification.</p><label>Nama Kelab</label><input id="c_name" required><label>Club Type</label><select id="c_type">'+types.map(t=>'<option value="'+esc(t.code)+'">'+esc(t.label)+'</option>').join('')+'</select><div class="two"><div><label>Tahun Ditubuhkan</label><input id="c_year" type="number" min="1800" max="2100"></div><div><label>No. ROS (optional)</label><input id="c_ros"></div></div><label>Deskripsi</label><textarea id="c_desc"></textarea><div class="two"><div><label>City</label><input id="c_city"></div><div><label>Negeri</label><input id="c_state"></div></div><div class="actions" style="margin-top:12px"><button class="btn green" onclick="createClub()">Create Club</button><button class="btn" onclick="closeModal()">Batal</button></div><div id="mmsg" class="msg"></div>')}
async function createClub(){const payload={name:$('c_name').value,club_type:$('c_type').value,year_founded:$('c_year').value,ros_registration_no:$('c_ros').value,description:$('c_desc').value,city:$('c_city').value,state:$('c_state').value,country:'Malaysia'};const r=await SB.rpc('create_playpro_club',{p_payload:payload});if(r.error){$('mmsg').textContent='❌ '+r.error.message;return}closeModal();await loadClubs()}
function editClub(){openModal('<h2>Edit Club Profile</h2><label>Nama</label><input id="e_name" value="'+esc(club.club_name)+'"><label>Club Type</label><select id="e_type">'+types.map(t=>'<option value="'+esc(t.code)+'" '+(t.code===club.club_type?'selected':'')+'>'+esc(t.label)+'</option>').join('')+'</select><label>Deskripsi</label><textarea id="e_desc">'+esc(club.description||'')+'</textarea><div class="two"><div><label>ROS</label><input id="e_ros" value="'+esc(club.ros_registration_no||'')+'"></div><div><label>WhatsApp</label><input id="e_wa" value="'+esc(club.whatsapp_phone||'')+'"></div></div><div class="two"><div><label>City</label><input id="e_city" value="'+esc(club.city||'')+'"></div><div><label>Negeri</label><input id="e_state" value="'+esc(club.state||'')+'"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveClub()">Simpan</button><button class="btn" onclick="closeModal()">Batal</button></div><div id="mmsg" class="msg"></div>')}
async function saveClub(){const r=await SB.rpc('update_playpro_club',{p_club_id:club.club_id,p_payload:{name:$('e_name').value,club_type:$('e_type').value,description:$('e_desc').value,ros_registration_no:$('e_ros').value,whatsapp_phone:$('e_wa').value,city:$('e_city').value,state:$('e_state').value}});if(r.error){$('mmsg').textContent='❌ '+r.error.message;return}closeModal();await loadClubs()}
function showVenue(){openModal('<h2>📍 Add Training Ground</h2><p class="small">Simpan koordinat pin dan PlayPro akan menghasilkan pautan Google Maps. Google Maps URLs tidak memerlukan API key.</p><label>Nama Padang</label><input id="v_name" placeholder="Contoh: Padang Utama Bukit Kepayang"><label>Alamat</label><input id="v_address"><div class="two"><div><label>Latitude</label><input id="v_lat" type="number" step="0.000001"></div><div><label>Longitude</label><input id="v_lng" type="number" step="0.000001"></div></div><div class="two"><div><label>City</label><input id="v_city"></div><div><label>Negeri</label><input id="v_state"></div></div><label><input id="v_primary" type="checkbox"> Jadikan padang utama</label><div class="actions" style="margin-top:12px"><button class="btn green" onclick="saveVenue()">Simpan Pin</button><button class="btn" onclick="closeModal()">Batal</button></div><div id="mmsg" class="msg"></div>')}
async function saveVenue(){const lat=$('v_lat').value,lng=$('v_lng').value;const maps=lat&&lng?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(lat+','+lng):'';const r=await SB.rpc('save_club_training_venue',{p_club_id:club.club_id,p_payload:{name:$('v_name').value,address:$('v_address').value,city:$('v_city').value,state:$('v_state').value,latitude:lat,longitude:lng,google_maps_url:maps,is_primary:$('v_primary').checked}});if(r.error){$('mmsg').textContent='❌ '+r.error.message;return}closeModal();await loadClubs()}
function showTeam(){const ages=['u6','u7','u8','u9','u10','u11','u12','u13','u14','u15','u16','u17','u18','u19','u20','u21','u22','u23','open','veteran'];openModal('<h2>＋ Create Team / Squad</h2><p class="small">Squad dicipta kosong. Pemain hanya boleh ditambah melalui Player Profile sebenar dan KYC verified; umur tidak boleh lebih rendah daripada kategori U.</p><label>Age Category</label><select id="t_age">'+ages.map(a=>'<option>'+a.toUpperCase()+'</option>').join('')+'</select><div class="two"><div><label>Squad Label</label><input id="t_label" value="A" maxlength="4"></div><div><label>Nama paparan (optional)</label><input id="t_name" placeholder="U10 A"></div></div><div class="actions" style="margin-top:12px"><button class="btn green" onclick="createTeam()">Create Squad</button><button class="btn" onclick="closeModal()">Batal</button></div><div id="mmsg" class="msg"></div>')}
async function createTeam(){const age=$('t_age').value.toLowerCase();const r=await SB.rpc('create_club_team',{p_club_id:club.club_id,p_payload:{age_category:age,squad_label:$('t_label').value,name:$('t_name').value}});if(r.error){$('mmsg').textContent='❌ '+r.error.message;return}location.href='club_team.html?team='+encodeURIComponent(r.data.team_id)}
boot();
</script></body></html>
