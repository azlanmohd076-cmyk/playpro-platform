<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayPro — Club Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#17211c;--muted:#68756e;--line:#d8dfdb;--panel:#fff;--bg:#eef2ef;--nav:#07120d;--green:#00b894;--blue:#1261b8;--gold:#e8b52f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,system-ui,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{max-width:1180px;margin:auto;padding:12px}.top,.bottom{display:flex;align-items:center;gap:16px;background:var(--nav);color:#fff;padding:12px 15px}.top a,.bottom a{font-weight:900}.logo{font-size:22px;font-weight:950;color:var(--green)}.spacer{flex:1}.panel{background:#fff;border:1px solid var(--line);border-radius:7px;margin-top:10px}.pad{padding:14px}.hero{background:linear-gradient(120deg,#07382b,#1261b8);color:#fff;padding:20px;border-radius:7px;margin-top:10px}.hero h1{margin:0;font-size:28px}.muted{color:var(--muted);font-size:12px}.hero .muted{color:#dcebf5}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.stat{background:#fff;border:1px solid var(--line);padding:12px;border-radius:6px}.stat b{display:block;font-size:23px}.tabs{display:flex;gap:2px;margin-top:10px;background:#d9dfdc;border:1px solid #c8d0cb;overflow:auto}.tab{padding:11px 15px;font-weight:950;cursor:pointer;white-space:nowrap}.tab.on{background:#fff;color:#075d4d}.page{display:none}.page.on{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf0ee}.row:last-child{border:0}.label{color:var(--muted)}.value{font-weight:800;text-align:right}.team{padding:13px;border:1px solid var(--line);border-radius:6px;margin-top:8px;background:#fff}.team h3{margin:0 0 4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{display:inline-block;padding:8px 11px;border:1px solid #bdc8c1;border-radius:5px;background:#fff;font-weight:900;cursor:pointer}.green{background:var(--green);border-color:var(--green)}.primary{background:var(--nav);color:#fff;border-color:var(--nav)}.badge{display:inline-block;padding:3px 7px;border-radius:99px;font-size:10px;font-weight:900;background:#edf2ef}.verified{background:#e7f2ff;color:#075ea8}.gold{background:#fff5ce;color:#765700}.item{padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item b{display:block}.empty{padding:28px;text-align:center;color:var(--muted)}.notice{padding:10px;background:#fff7d7;border:1px solid #e2ca72;border-radius:5px}.modalwrap{display:none;position:fixed;inset:0;background:#0009;z-index:20;place-items:center;padding:15px}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;padding:18px;border-radius:8px}.modal label{display:block;font-weight:900;margin:9px 0 4px;color:#075d4d}.modal input,.modal select,.modal textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:5px}.modal textarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.two{grid-template-columns:1fr}.top a{display:none}}
</style></head>
<body><main class="wrap">
<nav class="top"><div class="logo">PlayPro</div><a href="/">LIVE</a><a href="/">CARI</a><a href="/">ASSESSMENTS</a><a href="/">KEDAI</a><span class="spacer"></span><span id="who">—</span></nav>
<div id="app"><div class="panel"><div class="empty">Memuatkan Club Center…</div></div></div>
<nav class="bottom"><a href="/">CREATE</a><a href="/club">MYTEAM</a><a href="/">INBOX</a><a href="/">PASSPORT</a></nav>
</main><div class="modalwrap" id="modal"><div class="modal"><button class="btn" style="float:right" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<script>
'use strict';
const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ');
let me,club,teams=[],venues=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeName={professional:'Profesional',semi_professional:'Separuh Profesional',amateur:'Amatur',grassroots_academy:'Akademi Akar Umbi',educational_institution:'Institusi Pendidikan',government_agency:'Jabatan / Agensi Kerajaan',corporate:'Korporat',community:'Komuniti',womens_club:'Kelab Wanita',futsal:'Futsal',development:'Pembangunan',other:'Lain-lain'};
function modal(h){$('modalBody').innerHTML=h;$('modal').style.display='grid'}function closeModal(){$('modal').style.display='none'}
async function boot(){const s=await SB.auth.getSession();me=s.data.session?.user;if(!me){$('app').innerHTML='<div class="panel"><div class="empty">🔐 Log masuk diperlukan.</div></div>';return}$('who').textContent=me.email||'PlayPro User';const r=await SB.rpc('get_my_club_dashboard');if(r.error){fail(r.error.message);return}if(!r.data?.length){$('app').innerHTML='<div class="hero"><h1>Create Club</h1><p class="muted">Club Owner/KYC dikawal oleh backend.</p><div class="actions"><button class="btn green" onclick="createClubForm()">＋ Create Club</button></div></div>';return}club=r.data[0];await Promise.all([loadTeams(),loadVenues()]);render()}
function fail(x){$('app').innerHTML='<div class="panel"><div class="empty">❌ '+esc(x)+'</div></div>'}
async function loadTeams(){const r=await SB.from('club_teams').select('id,name,display_name,age_category,squad_label,season,status,formation,primary_coach_profile_id,assistant_coach_profile_id').eq('club_id',club.club_id).order('age_category');if(r.error)throw r.error;teams=r.data||[]}
async function loadVenues(){const r=await SB.from('club_training_venues').select('*').eq('club_id',club.club_id).order('is_primary',{ascending:false}).order('name');venues=r.data||[]}
function render(){const verified=club.verification_status==='verified';$('app').innerHTML=`<section class="hero"><h1>${esc(club.club_name)}</h1><p class="muted">${esc(typeName[club.club_type]||club.club_type||'Club')} · ${esc(club.club_code||'')} · ${verified?'<span class="badge verified">✓ VERIFIED CLUB</span>':'<span class="badge gold">UNDER REVIEW</span>'}</p></section><div class="stats"><div class="stat"><b>${club.team_count||0}</b>Team / Squad</div><div class="stat"><b>${club.member_count||0}</b>Members</div><div class="stat"><b>${venues.length}</b>Training Ground</div><div class="stat"><b>U6–V</b>Age Pathway</div></div><div class="tabs"><div class="tab on" onclick="tab('profile',this)">🏢 Profile</div><div class="tab" onclick="tab('teams',this)">👥 Team / Squad</div><div class="tab" onclick="tab('training',this)">📅 Training</div><div class="tab" onclick="tab('history',this)">🏆 History</div><div class="tab" onclick="tab('members',this)">🤝 Membership</div></div><section class="page on" id="profile"><div class="panel"><div class="pad"><div class="grid"><div><div class="row"><span class="label">Club ID</span><span class="value">${esc(club.club_code)}</span></div><div class="row"><span class="label">Owner</span><span class="value">KYC user</span></div><div class="row"><span class="label">Type</span><span class="value">${esc(typeName[club.club_type]||club.club_type)}</span></div></div><div><div class="row"><span class="label">Location</span><span class="value">${esc([club.city,club.state].filter(Boolean).join(', ')||'—')}</span></div><div class="row"><span class="label">Verification</span><span class="value">${verified?'VERIFIED':'UNDER REVIEW'}</span></div><div class="row"><span class="label">Squad policy</span><span class="value">U6–U23 / Open / Veteran 35+</span></div></div></div><div class="actions"><a class="btn primary" href="/club/operations">Club Operations</a><a class="btn" href="/club/membership">Membership & Fees</a><button class="btn" onclick="venueForm()">📍 Add Training Ground</button></div></div></div><div class="panel"><div class="pad"><h3>Training Grounds</h3>${venues.length?venues.map(v=>`<div class="item"><b>📍 ${esc(v.name)} ${v.is_primary?'<span class="badge verified">PRIMARY</span>':''}</b><span class="muted">${esc(v.address||[v.city,v.state].filter(Boolean).join(', ')||'Location saved')}</span></div>`).join(''):'<div class="empty">Belum ada training ground.</div>'}</div></div></section><section class="page" id="teams"><div class="panel"><div class="pad"><div class="actions"><a class="btn green" href="/club/operations">＋ Create / Manage Squad</a></div>${teams.length?teams.map(t=>`<div class="team"><h3>${esc(t.display_name||t.name)}</h3><span class="badge">${esc(String(t.age_category||'').toUpperCase())}</span> <span class="muted">Squad ${esc(t.squad_label||'A')} · ${esc(t.formation||'4-3-3')} · ${esc(t.status||'active')}</span><div class="actions"><a class="btn" href="club_team.html?team=${encodeURIComponent(t.id)}">Open Team</a><a class="btn" href="club_team.html?team=${encodeURIComponent(t.id)}#tmr">TMR</a></div></div>`).join(''):'<div class="empty">Squad belum dicipta. Kelab bermula kosong.</div>'}</div></div></section><section class="page" id="training"><div class="panel"><div class="pad"><div class="actions"><a class="btn green" href="/club/training">＋ Jadual / Urus Training</a></div><div id="trainingList"><div class="empty">Memuatkan sesi latihan…</div></div></div></div></section><section class="page" id="history"><div class="panel"><div class="pad"><h3>Official Club History</h3><p class="muted">Hanya official match result yang telah melalui referee approval/ratification masuk ke sejarah. TMR tidak masuk.</p><div id="historyList"><div class="empty">Memuatkan sejarah…</div></div></div></div></section><section class="page" id="members"><div class="panel"><div class="pad"><div class="actions"><a class="btn green" href="/club/membership">Manage Membership</a></div><p>Membership menggunakan PlayPro ID/Passport ID + IC. Pembayaran melalui PlayPro; platform fee dikunci 5% di backend.</p><div class="notice">3 laluan: club invite/search → player request join → referee offer/invite.</div></div></div></section>`;loadTraining();loadHistory()}
function tab(id,el){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
async function loadTraining(){if(!teams.length){$('trainingList').innerHTML='<div class="empty">Tiada squad. Cipta squad dahulu.</div>';return}let all=[];for(const t of teams){const r=await SB.rpc('playpro_list_team_training_sessions',{p_team_id:t.id,p_limit:100});if(!r.error)(r.data||[]).forEach(x=>all.push({...x,team_name:t.display_name||t.name}))}all.sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));$('trainingList').innerHTML=all.length?all.map(x=>`<div class="item"><b>📅 ${esc(x.title)}</b><span>${esc(x.team_name)} · ${new Date(x.starts_at).toLocaleString('ms-MY')} · ${esc(x.status||'scheduled')}</span><div class="muted">${esc(x.notes||'')}</div></div>`).join(''):'<div class="empty">Belum ada sesi latihan.</div>'}
async function loadHistory(){const r=await SB.from('club_history_records').select('*').eq('club_id',club.club_id).order('recorded_at',{ascending:false}).limit(100);if(r.error){$('historyList').innerHTML='<div class="empty">History belum boleh dibaca: '+esc(r.error.message)+'</div>';return}const rows=r.data||[];$('historyList').innerHTML=rows.length?rows.map(x=>`<div class="item"><b>${esc(x.title||x.record_type||'Official Match')}</b><span>${esc(x.description||'')}</span><div class="muted">${x.recorded_at?new Date(x.recorded_at).toLocaleString('ms-MY'):''}</div></div>`).join(''):'<div class="empty">Belum ada official history. Ini normal jika club belum mempunyai official match.</div>'}
function venueForm(){modal(`<h2>Training Ground</h2><label>Nama</label><input id="vn"><label>Alamat</label><input id="va"><div class="two"><div><label>City</label><input id="vc"></div><div><label>Negeri</label><input id="vs"></div></div><div class="two"><div><label>Latitude</label><input id="vlat" type="number" step="any"></div><div><label>Longitude</label><input id="vlon" type="number" step="any"></div></div><label><input id="vp" type="checkbox"> Jadikan primary</label><div class="actions"><button class="btn green" onclick="saveVenue()">Simpan</button></div>`) }
async function saveVenue(){const p={name:$('vn').value,address:$('va').value,city:$('vc').value,state:$('vs').value,latitude:$('vlat').value?Number($('vlat').value):null,longitude:$('vlon').value?Number($('vlon').value):null,is_primary:$('vp').checked};const r=await SB.rpc('save_club_training_venue',{p_club_id:club.club_id,p_payload:p});if(r.error)return alert(r.error.message);closeModal();await loadVenues();render()}
function createClubForm(){modal(`<h2>Create Club</h2><label>Nama Kelab</label><input id="cn"><label>Club Type</label><select id="ct"><option value="professional">Profesional</option><option value="semi_professional">Separuh Profesional</option><option value="amateur">Amatur</option><option value="grassroots_academy">Akademi Akar Umbi</option><option value="educational_institution">Institusi Pendidikan</option><option value="government_agency">Jabatan / Agensi Kerajaan</option><option value="corporate">Korporat</option><option value="community">Komuniti</option><option value="womens_club">Kelab Wanita</option><option value="futsal">Futsal</option><option value="development">Pembangunan</option><option value="other">Lain-lain</option></select><div class="two"><div><label>Tahun Ditubuhkan</label><input id="cy" type="number"></div><div><label>ROS optional</label><input id="cr"></div></div><label>City</label><input id="cc"><label>Negeri</label><input id="cs"><label>Deskripsi</label><textarea id="cd"></textarea><div class="actions"><button class="btn green" onclick="createClub()">Create Club</button></div>`) }
async function createClub(){const r=await SB.rpc('create_playpro_club',{p_payload:{club_name:$('cn').value,club_type:$('ct').value,established_year:$('cy').value?Number($('cy').value):null,ros_registration_no:$('cr').value||null,city:$('cc').value,state:$('cs').value,description:$('cd').value}});if(r.error)return alert(r.error.message);closeModal();location.reload()}
boot();
</script></body></html>
