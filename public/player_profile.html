</style></head><body><main class="wrap"><div class="top"><div class="logo">PlayPro</div><a href="player.html">Player</a><a href="/">Home</a></div><div id="app">Memuatkan...</div></main><div class="modalwrap" id="modal"><div class="modal" style="max-width:560px;max-height:90vh;overflow:auto"><span style="float:right;cursor:pointer" onclick="closeEdit()">✕</span><h2>Edit Player Profile</h2><div style="display:flex;gap:14px;align-items:center;margin:14px 0"><img id="ephoto-preview" alt="Pratonton gambar pemain" style="display:none;width:76px;height:76px;object-fit:cover;border-radius:50%;border:2px solid var(--line)"><div style="flex:1"><label>GAMBAR PROFIL (JPG / PNG / WEBP, MAKSIMUM 5MB)</label><input id="ephoto" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewPhoto(this)"></div></div><label>NAMA PAPARAN</label><input id="ep" maxlength="80" placeholder="Nama panggilan"><label>PAPAR NAMA</label><select id="edm"><option value="preferred">Nama pilihan</option><option value="legal">Nama sah</option></select><label>BIODATA</label><textarea id="eb" maxlength="500"></textarea><label>KEWARGANEGARAAN</label><input id="en" maxlength="80" value="Malaysian"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>POSISI</label><select id="epos"><option value="goalkeeper">Penjaga Gol</option><option value="cb">Centre Back</option><option value="lb">Left Back</option><option value="rb">Right Back</option><option value="lwb">Left Wing Back</option><option value="rwb">Right Wing Back</option><option value="defender">Defender</option><option value="dm">Defensive Midfielder</option><option value="cm">Central Midfielder</option><option value="am">Attacking Midfielder</option><option value="lm">Left Midfielder</option><option value="rm">Right Midfielder</option><option value="midfielder">Midfielder</option><option value="cf">Centre Forward</option><option value="st">Striker</option><option value="ss">Second Striker</option><option value="forward |String(x||'—').toUpperCase();function ratedCount(){return keys.filter(k=>Number(a[k])>0).length}function ovr(){return null}function tier(){return ratedCount()===0?'BELUM DINILAI':ratedCount()!==keys.length?'PENILAIAN BELUM LENGKAP':'DNA LENGKAP · OVR BELUM DITETAPKAN'}function colour(x){return x===0?'':x<=5?'red':x<=10?'yellow':x<=15?'blue':'green'}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function six(){const m={goalkeeper:[['positioning','POS'],['anticipation','ANT'],['agility','AGI'],['strength','STR'],['passing','PAS'],['composure','COM']],gk:[['positioning','POS'],['anticipation','ANT'],['agility','AGI'],['strength','STR'],['passing','PAS'],['composure','COM']],defender:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['passing','PAS']],cb:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['passing','PAS']],lb:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['passing','PAS']],rb:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['passing','PAS']],lwb:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['stamina','STA']],rwb:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['stamina','STA']],midfielder:[['passing','PAS'],['vision','VIS'],['dribbling','DRI'],['stamina','STA'],['decision_making','DEC'],['teamwork','TEA']],dm:[['tackling','TAC'],['passing','PAS'],['positioning','POS'],['stamina','STA'],['decision_making','DEC'],['teamwork','TEA']],cm:[['passing','PAS'],['vision','VIS'],['dribbling','DRI'],['stamina','STA'],['decision_making','DEC'],['teamwork','TEA']],am:[['passing','PAS'],['vision','VIS'],['dribbling','DRI'],['first_touch','TOU'],['composure','COM'],['decision_making','DEC']],lm:[['passing','PAS'],['vi e="margin-top:15px">Atribut tidak boleh diisi sendiri. Coach bertauliah akan menjadi sumber assessment; data match rasmi pula akan menjadi input organik pada enjin masa depan. AI belum aktif.</div></div></div><div class="section" id="card"><div class="panel cardbox"><div class="pc"><div class="pc-top"><div><div class="pc-ovr">${o===null?'—':o}</div><b>${pos(p.position)}</b></div><div>🇲🇾</div></div><div class="pc-photo">${p.photo_url?`<img src="${esc(p.photo_url)}">`:'⚽'}</div><div class="pc-name">${esc(p.preferred_name||p.full_name)}</div><div class="pc-id">${esc(p.football_passport_no)}</div><div class="pc-stats">${six().map(x=>`<div class="pc-stat"><b>${x.v||'—'}</b>${x.l}</div>`).join('')}</div><div style="margin-top:10px;color:var(--gold);font-weight:950">${tier(o)}</div></div><div class="actions" style="justify-content:center"><button class="btn follow" onclick="location.href='player_card_v2.html?id='+encodeURIComponent(p.id)">Buka Kad Penuh ↗</button></div></div></div><div class="section" id="passport"><div class="panel"><h2>📖 Football Passport</h2><p class="muted">Rekod perjalanan bola sepak sebenar kau — sejarah ini dibina daripada rekod rasmi.</p><div class="passport"><div class="fact"><b>Passport No.</b>${esc(p.football_passport_no)}</div><div class="fact"><b>Verification</b>${p.verification_status==='verified'?'✓ Verified':'Belum KYC'}</div><div class="fact"><b>Posisi</b>${pos(p.position)}</div><div class="fact"><b>Kelab</b>${esc(p.club_name||'Free Agent')}</div><div class="fact"><b>Tinggi</b>${p.height_cm?esc(p.height_cm)+' cm':'—'}</div><div class="fact"><b>Berat</b>${p.weight_kg?esc(p.weight_kg)+' kg':'—'}</div></div></div></div><div class="section" id="history"><div class="panel"><h2>📊 Match History</h2><div id="hist" class="history muted">Memuatkan...</div></div></div><div class="section" id="wall"><div class="panel">${own?'<div class="postbox"><textarea id="post" maxlength="500" placeholder="Tulis status kau..."></textarea><button class="btn follow" onclick="post()">Post</button><div id="pm" class="msg"></div></div>':''}<div id="posts" style="margin-top:12px"><span class="muted">Wall dimuatkan selepas log masuk.</span></div></div></div>`;window._follow=follow;loadPosts()}</script><script>function show(id,e){document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));e.classList.add('on')}async function follow(){if(!me)return location.href='player_signup.html';const r=await SB.rpc('follow_player',{p_player_id:p.id});if(r.error)return alert(r.error.message);await boot()}async function unfollow(){if(!me)return location.href='player_signup.html';const r=await SB.rpc('unfollow_player',{p_player_id:p.id});if(r.error)return alert(r.error.message);await boot()}async function history(id){const el=document.getElementById('hist');el.textContent='Memuatkan rekod rasmi...';const r=await SB.rpc('get_player_match_history',{p_player_id:id,p_limit:50});if(r.error){console.error('[PlayPro] Match history:',r.error);el.textContent='Sejarah perlawanan tidak dapat dimuatkan buat masa ini.';return}const h=Array.isArray(r.data)?r.data:[];if(!h.length){el.textContent='Belum ada rekod perlawanan rasmi yang disahkan pengadil.';return}const sum=k=>h.reduce((n,x)=>n+(Number(x[k])||0),0);const apps=h.length,goals=sum('goals'),assists=sum('assists'),minutes=sum('minutes_played');el.innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px"><div class="fact"><b>Rekod dipaparkan</b>${apps}</div><div class="fact"><b>Gol</b>${goals}</div><div class="fact"><b>Assist</b>${assists}</div><div class="fact"><b>Minit</b>${minutes}</div></div><div class="muted" style="margin-bottom:8px">50 rekod rasmi terkini maksimum</div>`+h.map(x=>`<div class="row"><span>${x.match_date?new Date(x.match_date).toLocaleDateString('ms-MY'):''}</span><span><b>${esc(x.home_club||'Home')}</b> ${x.home_goals??0}–${x.away_goals??0} <b>${esc(x.away_club||'Away')}</b></span><span>${x.minutes_played||0}' · ⚽${x.goals||0} · A ${x.assists||0}</span></div>`).join('')}async function loadPosts(){const el=document.getElementById('posts');if(!el)return;if(!me){el.textContent='Log masuk untuk melihat Wall pemain.';return}const r=await SB.from('player_posts').select('body,created_at').eq('player_id',p.id).order('created_at',{ascending:false}).limit(20);if(r.error){console.error('[PlayPro] Wall:',r.error);el.textContent='Wall tidak dapat dimuatkan buat masa ini.';return}el.innerHTML=r.data.length?r.data.map(x=>`<div class="post">${esc(x.body)}<div class="muted">${new Date(x.created_at).toLocaleString('ms-MY')}</div></div>`).join(''):'<div class="muted">Belum ada status.</div>'}async function post(){const body=document.getElementById('post').value.trim();if(!body)return;const r=await SB.from('player_posts').insert({player_id:p.id,author_profile_id:me.id,body});if(r.error)return document.getElementById('pm').textContent='❌ '+r.error.message;document.getElementById('post').value='';loadPosts()}function openEdit(){const $=id=>document.getElementById(id);$('ep').value=p.raw_preferred_name||'';$('eb').value=p.bio||'';$('en').value=p.nationality||'Malaysian';$('ev').value=p.profile_visibility||'public';$('edm').value=p.display_name_mode||'preferred';$('epos').value=p.position||'midfielder';if(!$('epos').value){const op=document.createElement('option');op.value=p.position;op.textContent=pos(p.position)+' (posisi semasa)';$('epos').appendChild(op);$('epos').value=p.position}$('efoot').value=p.preferred_foot||'';$('ejersey').value=p.jersey_number??'';$('eheight').value=p.height_cm??'';$('eweight').value=p.weight_kg??'';$('ephoto').value='';$('em').textContent='';const preview=$('ephoto-preview');if(p.photo_url){preview.src=p.photo_url;preview.style.display='block'}else{preview.removeAttribute('src');preview.style.display='none'}$('modal').style.display='grid'}function previewPhoto(input){const file=input.files?.[0],preview=document.getElementById('ephoto-preview');if(!file){preview.style.display=p.photo_url?'block':'none';preview.src=p.photo_url||'';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){document.getElementById('em').textContent='❌ Pilih JPG, PNG atau WEBP bersaiz maksimum 5MB.';input.value='';return}preview.src=URL.createObjectURL(file);preview.style.display='block';document.getElementById('em').textContent=''}function closeEdit(){document.getElementById('modal').style.display='none'}async function save(){const $=id=>document.getElementById(id),btn=$('save-profile-btn'),err=$('em');const jersey=$('ejersey').value.trim(),height=$('eheight').value.trim(),weight=$('eweight').value.trim();if(jersey&&(Number(jersey)<1||Number(jersey)>99||!Number.isInteger(Number(jersey)))){err.textContent='❌ Nombor jersi mesti antara 1 hingga 99.';return}if(height&&(Number(height)<100||Number(height)>230)){err.textContent='❌ Tinggi mesti antara 100 hingga 230 cm.';return}if(weight&&(Number(weight)<30||Number(weight)>150)){err.textContent='❌ Berat mesti antara 30 hingga 150 kg.';return}const payload={preferred_name:$('ep').value.trim(),bio:$('eb').value.trim(),nationality:$('en').value.trim(),profile_visibility:$('ev').value,display_name_mode:$('edm').value};if($('epos').value!==p.position)payload.position=$('epos').value;if(($('efoot').value||null)!==(p.preferred_foot||null))payload.preferred_foot=$('efoot').value;if(jersey!==String(p.jersey_number??''))payload.jersey_number=jersey;if(height!==String(p.height_cm??''))payload.height_cm=height;if(weight!==String(p.weight_kg??''))payload.weight_kg=weight;const file=$('ephoto').files?.[0];btn.disabled=true;btn.textContent='Menyimpan...';err.textContent='';try{if(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw new Error('Gambar mesti JPG, PNG atau WEBP dan tidak melebihi 5MB.');const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];const objectPath=`${me.id}/${p.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;const upload=await SB.storage.from('player-photos').upload(objectPath,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(upload.error)throw upload.error;payload.photo_url=SB.storage.from('player-photos').getPublicUrl(objectPath).data.publicUrl}const r=await SB.rpc('update_my_player_profile',{p_payload:payload});if(r.error)throw r.error;closeEdit();await boot()}catch(e){console.error('[PlayPro] Profile save failed:',e);err.textContent='❌ '+(e.message||'Perubahan tidak dapat disimpan.')}finally{btn.disabled=false;btn.textContent='Simpan Perubahan'}}function share(){const u=location.href;navigator.share?navigator.share({title:'PlayPro Player Profile',text:'⚽ Tengok profile pemain di PlayPro',url:u}).catch(()=>{}):navigator.clipboard.writeText(u).then(()=>alert('Link disalin.'))}boot();</script></body></html>
