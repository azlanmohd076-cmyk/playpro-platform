<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Player Profile</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>
:root{--g:#00d4aa;--gold:#f0c040;--blue:#2488ff;--red:#ef4444;--bg:#06100c;--card:#0e1813;--line:#203129;--txt:#eef7f2;--muted:#8da198}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#16412f,#050a07 65%);min-height:100vh;color:var(--txt);font:14px system-ui,sans-serif}.wrap{width:min(980px,100%);margin:auto;padding:18px}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,var(--g),var(--gold));-webkit-background-clip:text;color:transparent}.top a{margin-left:auto;color:var(--muted);text-decoration:none}.hero{display:grid;grid-template-columns:160px 1fr auto;gap:20px;align-items:center;background:linear-gradient(135deg,#10251b,#09120e);border:1px solid #ffffff12;border-radius:24px;padding:22px;overflow:hidden}.avatar{width:150px;height:150px;border-radius:20px;object-fit:cover;background:#ffffff08;display:grid;place-items:center;font-size:54px}.name{font-size:34px;font-weight:950}.verified{display:inline-flex;align-items:center;gap:5px;background:#0b6cff22;color:#7db6ff;border:1px solid #2488ff55;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.meta{color:var(--muted);margin-top:8px}.bio{margin-top:14px;line-height:1.55;color:#c4d2ca}.actions{display:flex;gap:8px;margin-top:16px}.btn{border:1px solid var(--line);background:#ffffff07;color:var(--txt);padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer}.follow{background:linear-gradient(90deg,var(--g),#00a880);color:#00110b;border:0}.danger{color:#ffb0b0}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.panel{background:rgba(14,24,19,.97);border:1px solid var(--line);border-radius:20px;padding:18px}.tabs{display:flex;gap:6px;overflow:auto;margin:14px 0 0}.tab{white-space:nowrap;padding:10px 12px;border-radius:10px;color:var(--muted);cursor:pointer}.tab.on{background:#00d4aa16;color:var(--g);font-weight:900}.section{display:none}.section.on{display:block}.dnahead{display:flex;align-items:center;justify-content:space-between}.overall{font-size:48px;font-weight:950;color:var(--gold)}.subtle{color:var(--muted);font-size:12px}.attrs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.attr{background:#ffffff05;border:1px solid #ffffff0b;border-radius:11px;padding:9px}.bar{height:6px;background:#ffffff0b;border-radius:9px;margin-top:7px;overflow:hidden}.fill{height:100%;border-radius:9px}.red{background:var(--red)}.yellow{background:#eab308}.blue{background:var(--blue)}.green{background:#16a34a}.card3d{min-height:290px;display:grid;place-items:center;background:radial-gradient(circle,#ffffff09,transparent 60%);border-radius:16px}.player-card{width:210px;min-height:280px;border-radius:18px;padding:13px;position:relative;box-shadow:0 0 45px #f0c04055,0 20px 50px #0009;background:linear-gradient(155deg,#3b2b06,#120d02);border:2px solid #f0c040}.pc-top{display:flex;justify-content:space-between}.pc-ovr{font-size:34px;font-weight:950}.pc-pos{font-size:11px;font-weight:900}.pc-photo{height:125px;border-radius:11px;background:#ffffff0a;display:grid;place-items:center;font-size:55px;margin:8px 0;overflow:hidden}.pc-photo img{width:100%;height:100%;object-fit:cover}.pc-name{text-align:center;font-weight:950;letter-spacing:.06em}.pc-id{text-align:center;color:#d7bd68;font-size:9px;margin-top:2px}.pc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}.pc-stat{text-align:center;font-size:10px;color:#cbbd9c}.pc-stat b{display:block;font-size:15px;color:#fff}.passport{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fact{background:#ffffff05;border-radius:12px;padding:12px}.fact b{display:block;color:var(--g);font-size:11px;margin-bottom:4px}.history-row{display:grid;grid-template-columns:90px 1fr 100px;gap:10px;padding:11px 0;border-bottom:1px solid #ffffff0a}.post{padding:12px 0;border-bottom:1px solid #ffffff0a}.postbox textarea{width:100%;min-height:80px;background:#08110d;color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical}.edit{display:none;position:fixed;inset:0;background:#000a;z-index:10;place-items:center;padding:20px}.modal{width:min(560px,100%);background:#101a15;border:1px solid var(--line);border-radius:20px;padding:20px}.modal.on{display:block}.modal label{display:block;color:var(--g);font-size:11px;font-weight:900;margin:10px 0 5px}.modal input,.modal select,.modal textarea{width:100%;background:#07100c;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.close{float:right;cursor:pointer}.notice{padding:16px;border-radius:14px;background:#ffffff06;color:var(--muted);line-height:1.6}.restricted{text-align:center;padding:45px 15px}.request{color:#7db6ff}.msg{color:#ffb4b4;min-height:20px;margin-top:10px}@media(max-width:720px){.hero{grid-template-columns:100px 1fr}.avatar{width:100px;height:100px}.hero>.actions{grid-column:1/-1}.grid{grid-template-columns:1fr}.name{font-size:25px}.history-row{grid-template-columns:70px 1fr 75px}.passport{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><div class="logo">PlayPro</div><a href="/">← PlayPro</a></div><div id="app">Memuatkan profile...</div></main><div class="edit" id="edit"><div class="modal"><span class="close" onclick="closeEdit()">✕</span><h2>Edit Profile</h2><label>NAMA PANGGILAN</label><input id="e_preferred"><label>BIODATA</label><textarea id="e_bio" maxlength="500"></textarea><label>KEWARGANEGARAAN</label><input id="e_nat"><div class="actions"><button class="btn" onclick="saveEdit()">Simpan</button><button class="btn" onclick="closeEdit()">Batal</button></div><div id="emsg" class="msg"></div></div></div>
<script>'use strict';const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtdWlyaGVudmpydXZmeGVub2F4bSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzc3NTYzNDk0LCJleHAiOjIwOTMxMzk0OTR9.ZNphviTQfnMjkGIdZtevwC8jmJjTCaXHhojcv4g5R20');let me=null,player=null,attrs={},history=[];const A=['passing','dribbling','finishing','first_touch','tackling','heading','pace','stamina','strength','agility','leadership','composure','teamwork','work_rate','positioning','vision','decision_making','anticipation'];const L={passing:'Passing',dribbling:'Dribbling',finishing:'Finishing',first_touch:'First Touch',tackling:'Tackling',heading:'Heading',pace:'Pace',stamina:'Stamina',strength:'Strength',agility:'Agility',leadership:'Leadership',composure:'Composure',teamwork:'Teamwork',work_rate:'Work Rate',positioning:'Positioning',vision:'Vision',decision_making:'Decision Making',anticipation:'Anticipation'};function val(x){return Math.max(0,Math.min(20,Number(x)||0))}function cls(x){return x===0?'':x<=5?'red':x<=10?'yellow':x<=15?'blue':'green'}function overall(){const v=A.map(k=>val(attrs[k])).filter(x=>x>0);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*5):0}function tier(o){return o<20?'BASIC':o<40?'NOVICE':o<60?'INTERMEDIATE':o<80?'ADVANCED':'PRO'}function pos(p){return({goalkeeper:'GK',defender:'DEF',midfielder:'MID',forward:'FWD'})[p]||'—'}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
async function boot(){const ss=await SB.auth.getSession();me=ss.data.session?.user||null;let id=new URLSearchParams(location.search).get('id');if(!id&&me){const q=await SB.from('players').select('id').eq('profile_id',me.id).maybeSingle();id=q.data?.id}if(!id)return document.getElementById('app').innerHTML='<div class="notice">⚽ Profile pemain belum ada. <a href="player_signup.html" style="color:var(--g)">Daftar sebagai pemain</a></div>';const r=await SB.rpc('get_player_profile',{p_player_id:id});if(r.error||!r.data?.ok)return document.getElementById('app').innerHTML='<div class="notice">Profile tidak dapat dimuat.</div>';player=r.data.player;attrs=r.data.attributes||{};render(r.data);loadHistory(id);if(me)loadPosts(id)}
function render(d){if(d.restricted){document.getElementById('app').innerHTML='<section class="panel restricted"><div style="font-size:50px">🔒</div><h2>Profile Private</h2><p class="muted">Profile ini hanya boleh dilihat oleh pemilik dan follower yang telah diluluskan.</p><button class="btn follow" onclick="follow()">'+(d.follow_status==='pending'?'⏳ Permintaan dihantar':'＋ Minta Follow')+'</button></section>';return}const p=d.player,o=overall();const following=d.follow_status;document.getElementById('app').innerHTML=`<section class="hero"><div class="avatar">${p.photo_url?`<img src="${esc(p.photo_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:20px">`:'👤'}</div><div><div class="name">${esc(p.preferred_name||p.full_name)} ${p.verification_status==='verified'?'<span class="verified">✓ Verified</span>':''}</div><div class="meta">${pos(p.position)} · ${esc(p.club_name||'Free Agent')} · ${esc(p.nationality||'Malaysian')} · ${p.age??'—'} tahun</div><div class="bio">${esc(p.bio||'Belum ada biodata.')}</div><div class="actions">${me&&me.id!==p.profile_id?`<button class="btn follow" onclick="${following==='approved'?'unfollow()':'follow()'}">${following==='approved'?'✓ Following':following==='pending'?'⏳ Pending':'＋ Follow'}</button>`:''}${me&&me.id===p.profile_id?'<button class="btn" onclick="openEdit()">⚙ Edit Profile</button>':''}<button class="btn" onclick="share()">↗ Kongsi</button></div></div><div><div class="subtle">FOLLOWERS</div><div style="font-size:28px;font-weight:950">${p.follower_count||0}</div><div class="subtle" style="margin-top:10px">PASSPORT</div><div style="font-size:12px;color:var(--gold)">${esc(p.football_passport_no)}</div></div></section><div class="tabs"><div class="tab on" onclick="tab('dna',this)">🧬 Football DNA</div><div class="tab" onclick="tab('card',this)">🃏 Player Card</div><div class="tab" onclick="tab('passport',this)">📖 Passport</div><div class="tab" onclick="tab('history',this)">📊 Match History</div><div class="tab" onclick="tab('wall',this)">💬 Wall</div></div><div class="section on" id="dna"><div class="panel"><div class="dnahead"><div><h2>Football DNA</h2><div class="subtle">18 atribut · skala 0–20 · belum dinilai = 0</div></div><div class="overall">${o}<small style="font-size:13px;color:var(--muted)">/100</small></div></div><div class="attrs">${A.map(k=>{const v=val(attrs[k]);return`<div class="attr"><div style="display:flex;justify-content:space-between"><span>${L[k]}</span><b>${v===0?'—':v}</b></div><div class="bar"><div class="fill ${cls(v)}" style="width:${v*5}%"></div></div></div>`}).join('')}</div><div class="notice" style="margin-top:15px">Atribut tidak boleh diisi sendiri. Sumber rasmi ialah assessment oleh coach bertauliah dan, pada masa akan datang, prestasi organik daripada data perlawanan yang telah diluluskan referee. <b>AI engine belum diaktifkan.</b></div></div></div><div class="section" id="card"><div class="panel"><div class="card3d"><div class="player-card"><div class="pc-top"><div><div class="pc-ovr">${o}</div><div class="pc-pos">${pos(p.position)}</div></div><div>🇲🇾</div></div><div class="pc-photo">${p.photo_url?`<img src="${esc(p.photo_url)}">`:'⚽'}</div><div class="pc-name">${esc(p.preferred_name||p.full_name)}</div><div class="pc-id">${esc(p.football_passport_no)}</div><div class="pc-stats">${cardStats(p).map(s=>`<div class="pc-stat"><b>${s.v||'—'}</b>${s.l}</div>`).join('')}</div></div></div><div style="text-align:center;color:var(--muted);font-size:12px">Tier semasa: <b style="color:var(--gold)">${tier(o)}</b> · Card ialah aset profil/marketing PlayPro dan akan berkembang bersama DNA.</div></div></div><div class="section" id="passport"><div class="panel"><h2>📖 Football Passport</h2><p class="subtle">Rekod perjalanan bola sepak sebenar — bukan game save.</p><div class="passport" style="margin-top:15px"><div class="fact"><b>Passport No.</b>${esc(p.football_passport_no)}</div><div class="fact"><b>Status</b>${p.verification_status==='verified'?'✓ Verified':'Belum KYC / Unverified'}</div><div class="fact"><b>Posisi</b>${pos(p.position)}</div><div class="fact"><b>Kelab</b>${esc(p.club_name||'Free Agent')}</div><div class="fact"><b>Tinggi</b>${p.height_cm?esc(p.height_cm)+' cm':'—'}</div><div class="fact"><b>Berat</b>${p.weight_kg?esc(p.weight_kg)+' kg':'—'}</div></div></div></div><div class="section" id="history"><div class="panel"><h2>📊 Match History</h2><div id="history-list" class="subtle" style="margin-top:12px">Memuatkan...</div></div></div><div class="section" id="wall"><div class="panel">${me&&me.id===p.profile_id?'<div class="postbox"><textarea id="post" maxlength="500" placeholder="Tulis status kau... 500 aksara"></textarea><button class="btn follow" onclick="post()">Post ke Wall</button><div id="pmsg" class="msg"></div></div>':''}<div id="posts" style="margin-top:14px"><div class="subtle">Log masuk untuk melihat Wall.</div></div></div></div>`}
function cardStats(p){let map=p.position==='goalkeeper'?['handling','reflexes','positioning','strength','agility','passing']:p.position==='defender'?['tackling','heading','positioning','strength','pace','passing']:p.position==='midfielder'?['passing','vision','dribbling','stamina','decision_making','teamwork']:['finishing','pace','dribbling','first_touch','positioning','composure'];return map.map(k=>({l:k.replace('_',' ').toUpperCase(),v:val(attrs[k])||'—'}))}
function tab(id,el){document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');if(id==='wall'&&player)loadPosts(player.id)}async function follow(){const r=await SB.rpc('follow_player',{p_player_id:player.id});if(r.error)return alert(r.error.message);boot()}async function unfollow(){const r=await SB.rpc('unfollow_player',{p_player_id:player.id});if(r.error)return alert(r.error.message);boot()}async function loadHistory(id){const r=await SB.rpc('get_player_match_history',{p_player_id:id,p_limit:50});history=r.data||[];const el=document.getElementById('history-list');if(!history.length)return el.textContent='Belum ada perlawanan rasmi.';el.innerHTML=history.map(x=>`<div class="history-row"><span>${x.match_date?new Date(x.match_date).toLocaleDateString('ms-MY'):''}</span><span><b>${esc(x.home_club||'Home')}</b> ${x.home_goals??0}–${x.away_goals??0} <b>${esc(x.away_club||'Away')}</b></span><span>${x.minutes_played||0}' · ⚽${x.goals||0} · 🅰️${x.assists||0}</span></div>`).join('')}
async function loadPosts(id){const el=document.getElementById('posts');if(!me)return;const r=await SB.from('player_posts').select('id,body,created_at').eq('player_id',id).order('created_at',{ascending:false}).limit(20);if(r.error)return el.textContent=r.error.message;if(!r.data.length)return el.innerHTML='<div class="subtle">Belum ada status. Jadilah yang pertama.</div>';el.innerHTML=r.data.map(x=>`<div class="post"><div>${esc(x.body)}</div><div class="subtle">${new Date(x.created_at).toLocaleString('ms-MY')}</div></div>`).join('')}
async function post(){const body=document.getElementById('post').value.trim();if(!body)return;const r=await SB.from('player_posts').insert({player_id:player.id,author_profile_id:me.id,body});if(r.error)return document.getElementById('pmsg').textContent='❌ '+r.error.message;document.getElementById('post').value='';loadPosts(player.id)}function openEdit(){document.getElementById('e_preferred').value=player.preferred_name||'';document.getElementById('e_bio').value=player.bio||'';document.getElementById('e_nat').value=player.nationality||'Malaysian';document.getElementById('edit').style.display='grid'}function closeEdit(){document.getElementById('edit').style.display='none'}async function saveEdit(){const r=await SB.rpc('update_my_player_profile',{p_payload:{preferred_name:document.getElementById('e_preferred').value,bio:document.getElementById('e_bio').value,nationality:document.getElementById('e_nat').value}});if(r.error)return document.getElementById('emsg').textContent='❌ '+r.error.message;closeEdit();boot()}function share(){const u=location.href;navigator.share?navigator.share({title:'PlayPro Player Profile',text:'⚽ Tengok profile pemain aku di PlayPro',url:u}).catch(()=>{}):navigator.clipboard.writeText(u).then(()=>alert('Link profile disalin.'))}boot();</script></body></html>
