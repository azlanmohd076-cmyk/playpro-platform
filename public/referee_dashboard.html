<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Referee Dashboard</title><style>body{margin:0;background:#eef3f7;color:#172334;font:14px Inter,system-ui,sans-serif}.top{background:#071a35;color:#fff;padding:15px 20px;display:flex;justify-content:space-between}.brand{font-weight:900;font-size:20px}.brand span{color:#37c9f1}.wrap{max-width:1100px;margin:auto;padding:22px 16px 60px}.hero{background:linear-gradient(135deg,#073b7c,#0b67bd);color:#fff;border-radius:14px;padding:22px}.hero h1{margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.card{background:#fff;border:1px solid #dbe4ec;border-radius:12px;padding:16px}.wide{grid-column:1/-1}.stat{font-size:28px;font-weight:900}.muted{color:#68778a;font-size:12px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf1f4}.pill{padding:4px 8px;border-radius:99px;background:#fff3cd;font-size:11px;font-weight:900}.ok{background:#e5f7ec;color:#176b3c}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}a,button{border:0;border-radius:8px;padding:9px 12px;text-decoration:none;font-weight:900;cursor:pointer}.blue{background:#0b4ea2;color:#fff}.ghost{background:#edf2f5;color:#172334}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">Play<span>Pro</span> / Referee</div><div id="who">—</div></header><main class="wrap"><section class="hero"><h1 id="name">Referee Dashboard</h1><div id="meta" class="muted" style="color:#dcebf5">Memuatkan status pengadil…</div><div class="actions"><a class="blue" href="/referee/profile">Profil</a><a class="ghost" href="/referee/assignments">Assignments</a><a class="ghost" href="/referee">Operations / Accreditation</a></div></section><div class="grid"><section class="card"><div class="muted">PERLAWANAN</div><div class="stat" id="matches">0</div><div class="muted">dikendalikan</div></section><section class="card"><div class="muted">KAD KUNING</div><div class="stat" id="yellow">0</div></section><section class="card"><div class="muted">KAD MERAH</div><div class="stat" id="red">0</div></section><section class="card wide"><h3>Assignment Semasa</h3><div id="assignments">Memuatkan…</div></section><section class="card"><h3>Accreditation</h3><div id="acc">Memuatkan…</div></section><section class="card"><h3>Status</h3><div id="status">Memuatkan…</div></section><section class="card"><h3>Quick Access</h3><div class="actions"><a class="blue" href="/referee">Referee Operations</a><a class="ghost" href="/referee/matches">Match Operations</a></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const s=await SB.auth.getSession(),u=s.data.session?.user;if(!u){$('meta').textContent='Log masuk diperlukan.';return}$('who').textContent=u.email||'PlayPro User';const p=await SB.from('profiles').select('id,full_name,role').eq('id',u.id).maybeSingle();const r=await SB.from('referees').select('*').eq('user_id',u.id).maybeSingle();if(!r.data){$('meta').textContent='Profil pengadil belum diwujudkan.';return}const x=r.data;$('name').textContent=x.pitch_nickname||x.full_name||p.data?.full_name||'Pengadil';$('meta').textContent=(x.referee_code||'—')+' · '+(x.verification_status||'pending')+' · '+(x.license_type||'Lesen belum direkodkan');$('status').innerHTML='<div class="row"><span>Verification</span><b>'+esc(x.verification_status||'pending')+'</b></div><div class="row"><span>Card</span><b>'+esc((x.card_state||'normal').toUpperCase())+'</b></div><div class="row"><span>Accreditation</span><b>Level '+esc(x.playpro_accreditation_level||0)+'</b></div>';const st=await SB.from('v_referee_match_stats').select('matches_officiated,yellow_cards,red_cards').eq('referee_id',x.id).maybeSingle();if(st.data){$('matches').textContent=st.data.matches_officiated||0;$('yellow').textContent=st.data.yellow_cards||0;$('red').textContent=st.data.red_cards||0}const a=await SB.from('referee_accreditations').select('level_no,status,scheduled_at,completed_at').eq('referee_id',x.id).order('level_no');$('acc').innerHTML=(a.data||[]).map(v=>'<div class="row"><span>Level '+v.level_no+'</span><b>'+esc(v.status)+'</b></div>').join('')||'Belum ada rekod.';const q=await SB.from('referee_assignments').select('id,fixture_id,role,slot_no,status,accepted_at,assigned_at').eq('profile_id',u.id).order('assigned_at',{ascending:false}).limit(5);$('assignments').innerHTML=(q.data||[]).map(v=>'<div class="row"><span>'+esc(v.role)+' · '+esc(v.fixture_id.slice(0,8))+'</span><span class="pill '+(v.status==='accepted'?'ok':'')+'">'+esc(v.status)+'</span></div>').join('')||'<div class="muted">Tiada assignment.</div>'}load().catch(e=>{$('meta').textContent='Dashboard gagal dimuatkan.';console.error(e)})</script></body></html>
