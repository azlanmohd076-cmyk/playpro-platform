<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Referee Assignments</title><style>body{margin:0;background:#eef3f7;color:#172334;font:14px Inter,system-ui,sans-serif}.top{background:#071a35;color:#fff;padding:15px 20px;display:flex;justify-content:space-between}.brand{font-size:20px;font-weight:900}.brand span{color:#37c9f1}.wrap{max-width:1100px;margin:auto;padding:22px 16px 60px}.card{background:#fff;border:1px solid #dbe4ec;border-radius:12px;margin-top:16px;overflow:hidden}.head{padding:15px 17px;border-bottom:1px solid #dbe4ec;display:flex;justify-content:space-between}.body{padding:16px}.item{border:1px solid #dbe4ec;border-radius:10px;padding:14px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.label{color:#68778a;font-size:11px}.value{font-weight:800}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#fff3cd;font-size:11px;font-weight:900}.ok{background:#e5f7ec;color:#176b3c}.muted{color:#68778a;font-size:12px}a{display:inline-block;background:#0b4ea2;color:#fff;text-decoration:none;border-radius:8px;padding:9px 12px;font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">Play<span>Pro</span> / Assignments</div><div id="who">—</div></header><main class="wrap"><div class="card"><div class="head"><b>REFEREE ASSIGNMENTS</b><a href="/referee">Operations</a></div><div class="body"><div id="msg" class="muted">Memuatkan…</div><div id="list"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const s=await SB.auth.getSession(),u=s.data.session?.user;if(!u){$('msg').textContent='Log masuk diperlukan.';return}$('who').textContent=u.email||'PlayPro User';const p=await SB.from('profiles').select('id').eq('id',u.id).maybeSingle();if(!p.data){$('msg').textContent='Profil tidak ditemui.';return}const q=await SB.from('referee_assignments').select('id,fixture_id,role,slot_no,scope,is_start_operator,assigned_by,assigned_at,accepted_at,status,notes').eq('profile_id',u.id).order('assigned_at',{ascending:false}).limit(100);if(q.error){$('msg').textContent=q.error.message;return}$('msg').textContent=(q.data||[]).length+' assignment direkodkan.';$('list').innerHTML=(q.data||[]).map(v=>'<article class="item"><div class="grid"><div><div class="label">FIXTURE</div><div class="value">'+esc(v.fixture_id)+'</div></div><div><div class="label">ROLE</div><div class="value">'+esc(v.role)+'</div></div><div><div class="label">STATUS</div><div><span class="pill '+(v.status==='accepted'?'ok':'')+'">'+esc(v.status)+'</span></div></div><div><div class="label">SLOT</div><div class="value">'+esc(v.slot_no)+'</div></div><div><div class="label">DITUGASKAN</div><div class="value">'+esc(v.assigned_at?new Date(v.assigned_at).toLocaleString('ms-MY'):'—')+'</div></div><div><div class="label">DITERIMA</div><div class="value">'+esc(v.accepted_at?new Date(v.accepted_at).toLocaleString('ms-MY'):'Belum')+'</div></div></div>'+(v.notes?'<div class="muted" style="margin-top:10px">'+esc(v.notes)+'</div>':'')+'</article>').join('')||'<div class="muted">Tiada assignment.</div>'}load().catch(e=>{$('msg').textContent='Gagal memuatkan assignments.';console.error(e)})</script></body></html>
