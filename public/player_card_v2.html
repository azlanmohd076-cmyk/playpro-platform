<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta property="og:title" content="PlayPro Player Card"><meta property="og:description" content="Kad pemain sebenar PlayPro"><title>PlayPro — Player Card</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#183b2c,#050806 65%);color:#fff;font:14px system-ui,sans-serif;display:grid;place-items:center;padding:20px}.wrap{text-align:center}.card{width:310px;min-height:450px;border-radius:22px;padding:15px;position:relative;overflow:hidden;background:linear-gradient(155deg,#3b2b06,#100c02);border:2px solid #f0c040;box-shadow:0 0 70px #f0c04066,0 25px 70px #000b;transform-style:preserve-3d;transition:.35s}.card:hover{transform:rotateY(9deg) rotateX(-4deg) scale(1.02)}.shine{position:absolute;inset:-60%;background:linear-gradient(120deg,transparent 42%,#fff5 50%,transparent 58%);animation:s 4s infinite;pointer-events:none}@keyframes s{0%{transform:translateX(-30%)}55%,100%{transform:translateX(30%)}}.top{display:flex;justify-content:space-between;align-items:start}.ovr{font-size:55px;font-weight:950;line-height:.9}.pos{font-weight:900;color:#e7cf79}.photo{height:225px;margin:10px 0;border-radius:15px;background:#ffffff0b;display:grid;place-items:center;font-size:80px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.name{font-size:23px;font-weight:950;letter-spacing:.06em;text-transform:uppercase}.passport{color:#d8bf6d;font:10px monospace;margin-top:3px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#0004;border:1px solid #fff2;border-radius:10px;padding:8px}.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:#d7cda8}.tier{margin-top:13px;color:#f0c040;font-weight:900;letter-spacing:.12em}.actions{display:flex;gap:8px;margin-top:18px}.btn{border:1px solid #ffffff22;background:#ffffff0b;color:#fff;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.main{background:#00d4aa;color:#00110b;border:0}.note{color:#8ea096;margin-top:12px;font-size:12px}.err{color:#ffb4b4}</style></head><body><div class="wrap" id="app">Memuatkan kad...</div><script>'use strict';const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtdWlyaGVudmpydXZmeGVub2F4bSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzc3NTYzNDk0LCJleHAiOjIwOTMxMzk0OTR9.ZNphviTQfnMjkGIdZtevwC8jmJjTCaXHhojcv4g5R20');const A=['passing','dribbling','finishing','first_touch','tackling','heading','pace','stamina','strength','agility','leadership','composure','teamwork','work_rate','positioning','vision','decision_making','anticipation'];const V=x=>Math.max(0,Math.min(20,Number(x)||0));function overall(a){const v=A.map(k=>Number(a[k]));if(v.length!==18||v.some(x=>!Number.isFinite(x)||x<1||x>20))return null;return Math.round(v.reduce((x,y)=>x+y,0)/18*5)}function tier(o,a){if(o===null){const n=A.filter(k=>Number(a[k])>=1&&Number(a[k])<=20).length;return n===0?'BELUM DINILAI':'PENILAIAN BELUM LENGKAP'}return o<20?'BASIC':o<40?'NOVICE':o<60?'INTERMEDIATE':o<80?'ADVANCED':'PRO'}const positionLabels={goalkeeper:'GK',gk:'GK',defender:'DEF',cb:'CB',lb:'LB',rb:'RB',lwb:'LWB',rwb:'RWB',midfielder:'MID',dm:'DM',cm:'CM',am:'AM',lm:'LM',rm:'RM',forward:'FWD',cf:'CF',st:'ST',ss:'SS',rw:'RW',lw:'LW'};function p6(pos,a){const m={goalkeeper:[['positioning','POS'],['anticipation','ANT'],['agility','AGI'],['strength','STR'],['passing','PAS'],['composure','COM']],gk:[['positioning','POS'],['anticipation','ANT'],['agility','AGI'],['strength','STR'],['passing','PAS'],['composure','COM']],defender:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['passing','PAS']],cb:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['passing','PAS']],lb:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['passing','PAS']],rb:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['passing','PAS']],lwb:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['stamina','STA']],rwb:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['stamina','STA']],midfielder:[['passing','PAS'],['vision','VIS'],['dribbling','DRI'],['stamina','STA'],['decision_making','DEC'],['teamwork','TEA']],dm:[['tackling','TAC'],['passing','PAS'],['positioning','POS'],['stamina','STA'],['decision_making','DEC'],['teamwork','TEA']],cm:[['passing','PAS'],['vision','VIS'],['dribbling','DRI'],['stamina','STA'],['decision_making','DEC'],['teamwork','TEA']],am:[['passing','PAS'],['vision','VIS'],['dribbling','DRI'],['first_touch','TOU'],['composure','COM'],['decision_making','DEC']],lm:[['passing','PAS'],['vision','VIS'],['dribbling','DRI'],['stamina','STA'],['pace','PAC'],['teamwork','TEA']],rm:[['passing','PAS'],['vision','VIS'],['dribbling','DRI'],['stamina','STA'],['pace','PAC'],['teamwork','TEA']],forward:[['finishing','FIN'],['pace','PAC'],['dribbling','DRI'],['first_touch','TOU'],['positioning','POS'],['composure','COM']],cf:[['finishing','FIN'],['pace','PAC'],['dribbling','DRI'],['first_touch','TOU'],['positioning','POS'],['composure','COM']],st:[['finishing','FIN'],['pace','PAC'],['dribbling','DRI'],['first_touch','TOU'],['positioning','POS'],['composure','COM']],ss:[['finishing','FIN'],['pace','PAC'],['dribbling','DRI'],['first_touch','TOU'],['positioning','POS'],['composure','COM']]};return(m[pos]||m.midfielder).map(x=>({l:x[1],v:V(a[x[0]])||'—'}))}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}async function main(){const id=new URLSearchParams(location.search).get('id');if(!id)return document.getElementById('app').innerHTML='<div class="err">Player ID diperlukan.</div>';const r=await SB.rpc('get_player_profile',{p_player_id:id});if(r.error||!r.data?.ok||r.data.restricted)return document.getElementById('app').innerHTML='<div class="err">Kad ini belum boleh dipaparkan.</div>';const p=r.data.player,a=r.data.attributes||{},o=overall(a);document.getElementById('app').innerHTML=`<div class="card"><div class="shine"></div><div class="top"><div><div class="ovr">${o===null?'—':o}</div><div class="pos">${esc(positionLabels[p.position]||String(p.position||'—').toUpperCase())}</div></div><div style="font-size:28px">🇲🇾</div></div><div class="photo">${p.photo_url?`<img src="${esc(p.photo_url)}">`:'⚽'}</div><div class="name">${esc(p.preferred_name||p.full_name)}</div><div class="passport">${esc(p.football_passport_no||'PLAYPRO PASSPORT')}</div><div class="stats">${p6(p.position,a).map(x=>`<div class="stat"><b>${x.v}</b><span>${x.l}</span></div>`).join('')}</div><div class="tier">${tier(o,a)}</div></div><div class="actions"><button class="btn main" onclick="share()">↗ Kongsi Kad</button><button class="btn" onclick="location.href='player_profile.html?id='+encodeURIComponent('${p.id}')">Profile</button></div><div class="note">OVR hanya dipaparkan selepas kesemua 18 atribut dinilai. Nilai DNA datang daripada penilai PlayPro, bukan pemain sendiri. Sistem AI belum digunakan pada fasa ini.</div>`}function share(){const u=location.href;navigator.share?navigator.share({title:'PlayPro Player Card',text:'⚽ Tengok Player Card aku di PlayPro',url:u}).catch(()=>{}):navigator.clipboard.writeText(u).then(()=>alert('Link kad disalin.'))}main();</script></body></html>
