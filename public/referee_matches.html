<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Referee Match Operations</title><style>body{margin:0;background:#eef3f7;color:#172334;font:14px Inter,system-ui,sans-serif}.top{background:#071a35;color:#fff;padding:15px 20px;display:flex;justify-content:space-between}.brand{font-size:20px;font-weight:900}.brand span{color:#37c9f1}.wrap{max-width:1100px;margin:auto;padding:22px 16px 60px}.card{background:#fff;border:1px solid #dbe4ec;border-radius:12px;margin-top:16px;overflow:hidden}.head{padding:15px 17px;border-bottom:1px solid #dbe4ec;display:flex;justify-content:space-between;align-items:center}.body{padding:16px}.item{border:1px solid #dbe4ec;border-radius:10px;padding:14px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.label{font-size:11px;color:#68778a}.value{font-weight:800;word-break:break-word}.pill{padding:4px 8px;border-radius:99px;background:#fff3cd;font-size:11px;font-weight:900}.blue{background:#0b4ea2;color:#fff;border:0;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer}.ok{background:#e5f7ec;color:#176b3c}.muted{font-size:12px;color:#68778a}.msg{padding:10px;border-radius:8px;background:#eef6ff;margin-bottom:12px}a{color:#fff;text-decoration:none}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">Play<span>Pro</span> / Match Operations</div><div id="who">—</div></header><main class="wrap"><section class="card"><div class="head"><b>PERLAWANAN DI BAWAH TANGGUNGJAWAB AKU</b><a class="blue" href="/referee">Referee Operations</a></div><div class="body"><div id="msg" class="msg">Hanya appointed referee boleh finalize match selepas match ENDED dan result tersedia.</div><div id="list">Memuatkan…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const s=await SB.auth.getSession(),u=s.data.session?.user;if(!u){$('msg').textContent='Log masuk diperlukan.';return}$('who').textContent=u.email||'PlayPro User';const q=await SB.from('referee_assignments').select('id,fixture_id,role,status,assigned_at,accepted_at,notes').eq('profile_id',u.id).eq('role','referee').order('assigned_at',{ascending:false}).limit(50);if(q.error){$('list').textContent=q.error.message;return}const ids=[...new Set((q.data||[]).map(x=>x.fixture_id))];let fx=[];if(ids.length){const f=await SB.from('fixtures').select('id,match_state,status,scheduled_at,home_team_id,away_team_id,referee_id').in('id',ids);if(!f.error)fx=f.data||[]}const by=new Map(fx.map(x=>[x.id,x]));$('list').innerHTML=(q.data||[]).map(v=>{const f=by.get(v.fixture_id)||{};return '<article class="item"><div class="grid"><div><div class="label">FIXTURE</div><div class="value">'+esc(v.fixture_id)+'</div></div><div><div class="label">MATCH STATE</div><div><span class="pill '+(f.match_state==='finalized'?'ok':'')+'">'+esc(f.match_state||'unknown')+'</span></div></div><div><div class="label">ASSIGNMENT</div><div class="value">'+esc(v.status)+'</div></div><div><div class="label">JADUAL</div><div class="value">'+esc(f.scheduled_at?new Date(f.scheduled_at).toLocaleString('ms-MY'):'—')+'</div></div><div><div class="label">HOME TEAM</div><div class="value">'+esc(f.home_team_id||'—')+'</div></div><div><div class="label">AWAY TEAM</div><div class="value">'+esc(f.away_team_id||'—')+'</div></div></div><div style="margin-top:12px"><button class="blue" onclick="finalizeMatch(\''+esc(v.fixture_id)+'\')">Approve / Finalize</button><div class="muted" style="margin-top:7px">Finalization akan ditolak backend jika syarat rasmi belum dipenuhi.</div></div></article>'}).join('')||'<div class="muted">Tiada perlawanan ditugaskan.</div>'}async function finalizeMatch(id){if(!confirm('Sahkan bahawa MATCH REPORT/result sudah lengkap dan perlawanan telah ENDED?'))return;const r=await SB.rpc('finalize_match',{p_fixture_id:id});if(r.error){$('msg').textContent='Finalize ditolak: '+r.error.message;$('msg').style.background='#ffeaea';return}$('msg').textContent='Match berjaya difinalize sebagai official.';$('msg').style.background='#e5f7ec';await load()}load().catch(e=>{$('list').textContent='Match Operations gagal dimuatkan.';console.error(e)})</script></body></html>
