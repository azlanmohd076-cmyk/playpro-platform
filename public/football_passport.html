<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro — Football Passport</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{margin:0;background:#07100c;color:#edf6f1;font:14px system-ui}.wrap{max-width:1050px;margin:auto;padding:16px}.top,.bottom{display:flex;gap:18px;align-items:center;background:#0d1c15;padding:12px 15px}.top a,.bottom a{color:#fff;text-decoration:none;font-weight:900}.spacer{flex:1}.hero{margin-top:12px;padding:22px;border:1px solid #284438;border-radius:12px;background:linear-gradient(135deg,#123022,#0d1c15)}.id{font:700 13px monospace;color:#8fe5cf}.title{font-size:30px;font-weight:950;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.card{background:#101a15;border:1px solid #284438;border-radius:10px;padding:14px;margin-top:10px}.stat b{display:block;font-size:24px;color:#9ff4df}.muted{color:#8da197}.row{padding:11px 0;border-bottom:1px solid #26372f}.row:last-child{border:0}.empty{text-align:center;padding:28px;color:#8da197}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#183a2e;color:#9ff4df;font-size:10px;font-weight:900}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.top a{display:none}}</style></head><body><main class="wrap"><nav class="top"><b style="color:#00d4aa;font-size:21px">PlayPro</b><a href="/">LIVE</a><a href="/">CARI</a><a href="/">ASSESSMENTS</a><a href="/">KEDAI</a><span class="spacer" id="who">—</span></nav><div id="app">Memuatkan Football Passport…</div><nav class="bottom"><a href="/">CREATE</a><a href="/club">MYTEAM</a><a href="/">INBOX</a><a href="/passport">PASSPORT</a></nav></main><script>'use strict';const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ'),$=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const s=await SB.auth.getSession(),u=s.data.session?.user;if(!u){$('app').innerHTML='<div class="card empty">Sila log masuk.</div>';return}$('who').textContent=u.email||'PlayPro User';const r=await SB.from('players').select('id,full_name,preferred_name,position,football_passport_no,verification_status,profile_visibility,club_id,created_at').eq('profile_id',u.id).maybeSingle();if(r.error||!r.data){$('app').innerHTML='<div class="card empty">Football Passport hanya tersedia selepas Player Profile dicipta.</div>';return}const p=r.data;const [stats,discipline,assess]=await Promise.all([SB.from('player_match_stats').select('fixture_id,minutes_played,goals,assists,shots,shots_on_target,yellow_cards,red_cards').eq('player_id',p.id),SB.from('disciplinary_records').select('card_type,match_date,minute,notes').eq('player_id',p.id).order('match_date',{ascending:false}),SB.from('player_assessments').select('assessed_at,passing,crossing,tackling,finishing,dribbling,first_touch,leadership,teamwork,determination,decisions,positioning,pace,strength,agility,balance,stamina').eq('player_id',p.id).order('assessed_at',{ascending:false}).limit(1)]);const ss=stats.data||[],ds=discipline.data||[],a=assess.data?.[0]||null;const total=x=>ss.reduce((n,r)=>n+(Number(r[x])||0),0);$('app').innerHTML='<section class="hero"><div class="id">FOOTBALL PASSPORT · '+esc(p.football_passport_no||'NOT YET ISSUED')+'</div><div class="title">'+esc(p.preferred_name||p.full_name)+'</div><div class="muted">'+esc(p.position||'—')+' · '+esc(p.verification_status||'unverified')+'</div></section><div class="grid"><div class="card stat"><b>'+ss.length+'</b><span class="muted">Official match records</span></div><div class="card stat"><b>'+total('minutes_played')+'</b><span class="muted">Minutes</span></div><div class="card stat"><b>'+total('goals')+'</b><span class="muted">Goals</span></div><div class="card stat"><b>'+total('assists')+'</b><span class="muted">Assists</span></div></div><section class="card"><h3>Identity & Verification</h3><div class="row">Player ID <b>'+esc(p.id)+'</b></div><div class="row">Verification <span class="badge">'+esc(p.verification_status)+'</span></div><div class="row">Passport No. <b>'+esc(p.football_passport_no||'Belum dijana')+'</b></div></section><section class="card"><h3>Latest DNA Assessment</h3>'+(a?'<div class="row">Passing <b>'+a.passing+'/20</b></div><div class="row">Dribbling <b>'+a.dribbling+'/20</b></div><div class="row">Finishing <b>'+a.finishing+'/20</b></div><div class="row">Pace <b>'+a.pace+'/20</b></div><div class="row">Stamina <b>'+a.stamina+'/20</b></div>':'<div class="empty">Belum dinilai. PlayPro tidak akan mencipta nilai DNA secara automatik tanpa provenance.</div>')+'</section><section class="card"><h3>Discipline</h3>'+(ds.length?ds.map(x=>'<div class="row"><b>'+esc(x.card_type)+'</b> · '+esc(x.match_date||'')+' · min '+esc(x.minute||'—')+'<div class="muted">'+esc(x.notes||'')+'</div></div>').join(''):'<div class="empty">Tiada rekod disiplin.</div>')+'</section></section>'}boot();</script></body></html>
