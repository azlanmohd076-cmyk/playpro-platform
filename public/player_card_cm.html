<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100c"><title>PlayPro — Player Card</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{--gold:#f0c040;--g:#00d4aa;--bg:#050806;--muted:#8ea096}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#183b2c,#050806 68%);color:#fff;font:14px system-ui,sans-serif;display:grid;place-items:center;padding:20px}.wrap{text-align:center}.card{width:330px;min-height:500px;border-radius:24px;padding:15px;position:relative;overflow:hidden;background:linear-gradient(155deg,#3b2b06,#100c02);border:2px solid var(--gold);box-shadow:0 0 70px #f0c04066,0 25px 70px #000b;transform-style:preserve-3d;transition:.35s}.card:hover{transform:rotateY(9deg) rotateX(-4deg) scale(1.02)}.shine{position:absolute;inset:-60%;background:linear-gradient(120deg,transparent 42%,#fff5 50%,transparent 58%);animation:s 4s infinite;pointer-events:none}@keyframes s{0%{transform:translateX(-30%)}55%,100%{transform:translateX(30%)}}.top{display:flex;justify-content:space-between;align-items:start}.ovr{font-size:58px;font-weight:950;line-height:.9}.pos{font-weight:900;color:#e7cf79}.photo{height:235px;margin:10px 0;border-radius:15px;background:#ffffff0b;display:grid;place-items:center;font-size:80px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.name{font-size:24px;font-weight:950;letter-spacing:.05em;text-transform:uppercase}.passport{color:#d8bf6d;font:10px monospace;margin-top:3px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.stat{background:#0005;border:1px solid #fff2;border-radius:10px;padding:8px}.stat b{display:block;font-size:20px}.stat span{font-size:9px;color:#d7cda8}.tier{margin-top:12px;color:var(--gold);font-weight:950;letter-spacing:.12em}.discipline{display:none;margin:10px 0 0;padding:8px;border:1px solid #ff5b5b;background:#250909;color:#ffd1d1;border-radius:9px;font-weight:900}.disc .card{background:linear-gradient(155deg,#210b0b,#050303);border-color:#8f3434;box-shadow:0 0 55px #ef444455,0 25px 70px #000b}.disc .discipline{display:block}.note{color:var(--muted);margin-top:12px;font-size:12px}.actions{margin-top:18px;display:flex;gap:8px;justify-content:center}.btn{border:1px solid #ffffff22;background:#ffffff0b;color:#fff;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.main{background:var(--g);color:#00110b;border:0}.err{color:#ffb4b4}</style></head><body><div class="wrap" id="app">Memuatkan kad...</div><script>'use strict';const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtdWlyaGVudmpydXZmeGVub2F4bSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzc3NTYzNDk0LCJleHAiOjIwOTMxMzk0OTR9.ZNphviTQfnMjkGIdZtevwC8jmJjTCaXHhojcv4g5R20');const A=['passing','dribbling','finishing','first_touch','tackling','heading','pace','stamina','strength','agility','leadership','composure','teamwork','work_rate','positioning','vision','decision_making','anticipation'];const V=x=>Math.max(0,Math.min(20,Number(x)||0));const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));function ovr(a){const q=A.map(k=>V(a[k])).filter(Boolean);return q.length?Math.round(q.reduce((x,y)=>x+y,0)/q.length*5):0}function tier(o){return o<20?'BASIC':o<40?'NOVICE':o<60?'INTERMEDIATE':o<80?'ADVANCED':'PRO'}function p6(pos,a){const m={goalkeeper:[['gk_handling','HAN'],['gk_reflexes','REF'],['gk_positioning','POS'],['strength','STR'],['agility','AGI'],['passing','PAS']],defender:[['tackling','TAC'],['heading','HEA'],['positioning','POS'],['strength','STR'],['pace','PAC'],['passing','PAS']],midfielder:[['passing','PAS'],['vision','VIS'],['dribbling','DRI'],['stamina','STA'],['decision_making','DEC'],['teamwork','TEA']],forward:[['finishing','FIN'],['pace','PAC'],['dribbling','DRI'],['first_touch','TOU'],['positioning','POS'],['composure','COM']]};return(m[pos]||m.midfielder).map(x=>({l:x[1],v:V(a[x[0]])}))}async function main(){const id=new URLSearchParams(location.search).get('id');if(!id)return $('app').innerHTML='<div class="err">Player ID diperlukan.</div>';const r=await SB.rpc('get_player_profile',{p_player_id:id});if(r.error||!r.data?.ok||r.data.restricted)return $('app').innerHTML='<div class="err">Kad ini belum boleh dipaparkan.</div>';const p=r.data.player,a=r.data.attributes||{},o=ovr(a);const d=await SB.rpc('get_player_card_state',{p_player_id:id});const disc=d.data?.disciplinary;document.body.classList.toggle('disc',!!disc?.active);const s=p6(p.position,a);$('app').innerHTML=`<div class="card"><div class="shine"></div><div class="top"><div><div class="ovr">${o}</div><div class="pos">${esc((p.position||'').toUpperCase())}</div></div><div style="font-size:28px">🇲🇾</div></div><div class="photo">${p.photo_url?`<img src="${esc(p.photo_url)}">`:'⚽'}</div><div class="name">${esc(p.preferred_name||p.full_name)}</div><div class="passport">${esc(p.football_passport_no||'KYC PENDING')}</div><div class="discipline">⚠️ ${esc(disc?.reason||'DISCIPLINARY ACTION')} · ${disc?.matches_remaining??0} MATCH REMAINING</div><div class="stats">${s.map(x=>`<div class="stat"><b>${x.v||'—'}</b><span>${x.l}</span></div>`).join('')}</div><div class="tier">${tier(o)}</div></div><div class="actions"><button class="btn main" onclick="share()">↗ Kongsi Kad</button><button class="btn" onclick="location.href='player_profile_cm.html?id='+encodeURIComponent('${p.id}')">Profile</button></div><div class="note">Card = profile + Football DNA. Atribut 0 bermaksud belum dinilai. AI belum digunakan.</div>`}function share(){const u=location.href;navigator.share?navigator.share({title:'PlayPro Player Card',text:'⚽ Tengok Player Card aku di PlayPro',url:u}).catch(()=>{}):navigator.clipboard.writeText(u).then(()=>alert('Link kad disalin.'))}main();</script></body></html>
