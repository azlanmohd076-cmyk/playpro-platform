<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayPro · Profil Organizer</title><style>:root{--navy:#071a35;--blue:#0b4ea2;--green:#159957;--gold:#d69e16;--ink:#172334;--muted:#68778a;--line:#dbe4ec;--bg:#eef3f7;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,sans-serif}.top{background:var(--navy);color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center}.brand{font-size:21px;font-weight:900}.brand span{color:#36c8ef}.wrap{max-width:1080px;margin:auto;padding:22px 16px 60px}.hero{background:linear-gradient(135deg,#073b7c,#159957);color:#fff;border-radius:15px;padding:22px;display:grid;grid-template-columns:82px 1fr auto;gap:16px;align-items:center}.avatar{width:82px;height:82px;border-radius:14px;background:#fff2;display:grid;place-items:center;font-size:28px;font-weight:900;border:1px solid #ffffff55}.hero h1{margin:3px 0;font-size:28px}.meta{opacity:.9}.badge{background:#fff;color:#07539e;border-radius:999px;padding:7px 10px;font-weight:900;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:900}.body{padding:16px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf1f4}.row:last-child{border:0}.label{color:var(--muted)}.value{font-weight:800;text-align:right}.notice{padding:12px;border-radius:9px;background:#fff7dd;color:#725900;margin-bottom:12px}.ok{background:#eaf8f1;color:#12683e}.form label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:9px 0 4px}.form input,.form select,.form textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;font:inherit}.form textarea{min-height:90px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid #b9c8d5;background:#fff;border-radius:7px;padding:9px 12px;font-weight:900;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.green{background:var(--green);border-color:var(--green);color:#fff}.hidden{display:none}.muted{color:var(--muted);font-size:12px}@media(max-width:720px){.hero{grid-template-columns:60px 1fr}.avatar{width:60px;height:60px}.hero .badge{grid-column:1/-1}.grid,.two{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="brand">Play<span>Pro</span> / Organizer</div><div id="who">—</div></header><main class="wrap"><div id="notice" class="notice">Memeriksa akaun dan KYC…</div><section class="hero"><div class="avatar">ORG</div><div><div style="font-size:11px;letter-spacing:.12em;opacity:.75">PLAYPRO ORGANIZER</div><h1 id="name">Belum diwujudkan</h1><div class="meta" id="meta">—</div></div><div><span class="badge" id="verified">● Pending</span></div></section><div class="grid"><section class="card"><div class="head">IDENTITI ORGANIZER</div><div class="body" id="identity"><div class="muted">Belum ada profil.</div></div></section><section class="card"><div class="head">CREATE / COMPLETE ORGANIZER</div><div class="body" id="formPanel"><div class="muted">KYC organizer diperlukan sebelum profil boleh diwujudkan.</div><div style="margin-top:12px"><button class="btn primary" id="kycBtn">Buka KYC</button></div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const SB=supabase.createClient('https://muirhenvjruvfxenoaxm.supabase.co','sb_publishable_exWFL10h8zcpyFyEdq7jAw_XoBl2RwZ');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const types={individual:'Individu',club:'Kelab',academy:'Akademi',school:'Sekolah',university:'Universiti',company:'Syarikat',ngo:'NGO',association:'Persatuan',government:'Jabatan / Agensi Kerajaan',community:'Komuniti',other:'Lain-lain'};async function boot(){const {data:{session}}=await SB.auth.getSession();if(!session){$('notice').textContent='Sila log masuk dahulu.';return}const uid=session.user.id;$('who').textContent=session.user.email||'PlayPro User';const {data:o}=await SB.from('organizers').select('*').eq('profile_id',uid).maybeSingle();if(o){render(o);return}const {data:k}=await SB.from('identity_verifications').select('status,id_type,legal_name_claimed').eq('profile_id',uid).eq('subject_type','organizer').order('created_at',{ascending:false}).limit(1).maybeSingle();if(k?.status==='verified'){showForm();$('notice').textContent='KYC organizer telah verified. Lengkapkan profil organizer.';$('notice').className='notice ok'}else{$('notice').textContent='KYC organizer belum verified. Hantar KYC dahulu.';$('kycBtn').onclick=()=>location.href='player_kyc.html'}}function showForm(){$('formPanel').innerHTML='<div class="form"><label>Jenis Organizer<select id="type">'+Object.entries(types).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')+'</select></label><label>Nama Organizer / Organisasi<input id="display" placeholder="Contoh: Seremban Youth Football League"></label><label>Telefon<input id="phone"></label><label>WhatsApp<input id="wa"></label><label>Email<input id="email" type="email"></label><div class="two"><div><label>Bandar<input id="city"></label></div><div><label>Negeri<input id="state"></label></div></div><label>Deskripsi<textarea id="desc"></textarea></label><button class="btn green" id="create">Create Organizer Profile</button></div>';$('create').onclick=create}async function create(){const {data,error}=await SB.rpc('create_organizer_profile',{p_organizer_type:$('type').value,p_display_name:$('display').value,p_description:$('desc').value||null,p_phone:$('phone').value||null,p_whatsapp:$('wa').value||null,p_email:$('email').value||null,p_city:$('city').value||null,p_state:$('state').value||null});if(error){$('notice').textContent=error.message;return}$('notice').textContent='Organizer profile berjaya diwujudkan. Status PlayPro: pending verification.';$('notice').className='notice ok';location.reload()}function render(o){$('name').textContent=o.display_name;$('meta').textContent=`${types[o.organizer_type]||o.organizer_type} · ${o.organizer_code}`;$('verified').textContent=o.verification_status==='verified'?'✓ Verified Organizer':'● '+(o.verification_status||'pending');$('identity').innerHTML=`<div class="row"><span class="label">Organizer ID</span><span class="value">${esc(o.organizer_code)}</span></div><div class="row"><span class="label">Jenis</span><span class="value">${esc(types[o.organizer_type]||o.organizer_type)}</span></div><div class="row"><span class="label">Verification</span><span class="value">${esc(o.verification_status)}</span></div><div class="row"><span class="label">Lokasi</span><span class="value">${esc([o.city,o.state,o.country].filter(Boolean).join(', ')||'—')}</span></div><div class="row"><span class="label">Telefon</span><span class="value">${esc(o.phone||'—')}</span></div><div class="row"><span class="label">WhatsApp</span><span class="value">${esc(o.whatsapp||'—')}</span></div>`;$('formPanel').innerHTML='<div class="muted">Profil organizer aktif dalam ekosistem user ini. Modul Competition akan menggunakan organizer_id ini sebagai pemilik/manager competition — bukan profile palsu.</div>'}boot().catch(e=>{$('notice').textContent='Gagal memuatkan organizer profile.';console.error(e)})</script></body></html>
